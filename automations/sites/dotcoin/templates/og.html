<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Y;src:url(/assets/fonts/yekan-950.woff2) format("woff2");font-weight:950}
@font-face{font-family:Y;src:url(/assets/fonts/yekan-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:A;src:url(/assets/fonts/anton.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#F3C242}
body{position:relative;font-family:Y,sans-serif;color:#000}
.giant{position:absolute;left:56px;bottom:44px;font-family:A,sans-serif;font-size:{{giant_size}}px;line-height:.74;white-space:nowrap;direction:ltr;color:#000}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(0,0,0,.08) 1px,transparent 1px);background-size:100px 100%}
.top{position:absolute;top:56px;right:64px;left:64px;display:flex;justify-content:space-between;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:12px;font-weight:600;font-size:26px;background:#000;color:#F3C242;padding:10px 22px;border-radius:999px}
.kicker i{width:12px;height:12px;border-radius:50%;background:#F3C242}
.mark{display:flex;align-items:center;gap:16px;direction:ltr;font-family:A,sans-serif;font-size:34px;letter-spacing:1px}
.mark img{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 4px #000}
.title{position:absolute;top:150px;right:64px;width:1000px;font-weight:950;font-size:{{title_size}}px;line-height:1.3;text-wrap:balance}
.rule{position:absolute;left:56px;right:56px;bottom:20px;height:6px;background:#000}
</style>
</head>
<body>
<div class="grid"></div>
<div class="giant">{{en}}</div>
<div class="top"><span class="kicker"><i></i>{{kicker}}</span><span class="mark"><img src="/assets/img/logo-192.webp" alt="">DOTCOIN.ME</span></div>
<h1 class="title">{{title}}</h1>
<div class="rule"></div>
</body>
</html>
