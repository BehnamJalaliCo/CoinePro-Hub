<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <!-- Zarib×100 cover pack (owner, 2026-11-15): the reference board ChatGPT gets with every cover -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#0FB5AE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#030B26" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="#030B26"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>
  <g font-family="IRANYekanXFaNum" direction="rtl" text-anchor="end">
    <text x="1020" y="120" font-size="58" font-weight="700" fill="#F4F7FF">کاور پک ضریب صد</text>
    <text x="1020" y="172" font-size="30" fill="#0FB5AE">راهنمای سبک؛ فقط برای الگو، کپی نشود</text>

    <text x="1020" y="280" font-size="40" font-weight="700" fill="#F4F7FF">رنگ‌ها: فقط همین سه رنگ</text>
    <rect x="720" y="320" width="300" height="300" rx="36" fill="#030B26" stroke="#0FB5AE" stroke-width="4"/>
    <rect x="390" y="320" width="300" height="300" rx="36" fill="#0FB5AE"/>
    <rect x="60" y="320" width="300" height="300" rx="36" fill="#F4F7FF"/>
    <text x="1005" y="672" font-size="32" font-weight="700" fill="#F4F7FF">سرمه‌ای ـ پس‌زمینه</text>
    <text x="675" y="672" font-size="32" font-weight="700" fill="#F4F7FF">فیروزه‌ای ـ نور و تأکید</text>
    <text x="345" y="672" font-size="32" font-weight="700" fill="#F4F7FF">سفید ـ تیتر</text>
    <text x="1005" y="716" font-size="30" fill="#0FB5AE">٪۷۰</text>
    <text x="675" y="716" font-size="30" fill="#0FB5AE">٪۲۰</text>
    <text x="345" y="716" font-size="30" fill="#0FB5AE">٪۱۰</text>

    <text x="1020" y="850" font-size="40" font-weight="700" fill="#F4F7FF">فونت تیتر: ایران‌یکان اکو، بولد</text>
    <text x="1020" y="1030" font-size="160" font-weight="700" fill="#F4F7FF">پول <tspan fill="#0FB5AE">نامرئی</tspan></text>
    <text x="1020" y="1160" font-size="112" font-weight="700" fill="#F4F7FF">اشتباه <tspan fill="#0FB5AE">مرگبار</tspan></text>
    <text x="1020" y="1250" font-size="40" font-weight="700" fill="#F4F7FF">ا ب پ ت ث ج چ ح خ د ذ ر ز ژ س ش ص</text>
    <text x="1020" y="1300" font-size="40" font-weight="700" fill="#F4F7FF">ض ط ظ ع غ ف ق ک گ ل م ن و ه ی</text>
    <text x="1020" y="1350" font-size="40" font-weight="700" fill="#F4F7FF">۰ ۱ ۲ ۳ ۴ ۵ ۶ ۷ ۸ ۹</text>

    <text x="700" y="1430" font-size="40" font-weight="700" fill="#F4F7FF">چیدمان</text>
    <text x="700" y="1490" font-size="31" fill="#F4F7FF">تیتر ۲ تا ۴ کلمه، حداکثر ۲ خط</text>
    <text x="700" y="1540" font-size="31" fill="#F4F7FF">تیتر داخل مربع وسط، برای برش ۱:۱ و ۴:۵</text>
    <text x="700" y="1590" font-size="31" fill="#F4F7FF">یک المان مرتبط با موضوع، با نور فیروزه‌ای</text>
    <text x="700" y="1640" font-size="31" fill="#F4F7FF">یک کلمه‌ی کلیدی تیتر فیروزه‌ای</text>
    <text x="700" y="1690" font-size="31" fill="#F4F7FF">هیچ نوشته، عدد، لوگو یا واترمارک دیگر</text>
    <text x="700" y="1740" font-size="31" fill="#F4F7FF">سینمایی، تمیز، خوانا در اندازه‌ی کوچک</text>
  </g>
  <g font-family="IRANYekanX" font-size="30" font-weight="700" fill="#F4F7FF" text-anchor="middle" direction="ltr">
    <text x="870" y="760">#030B26</text>
    <text x="540" y="760">#0FB5AE</text>
    <text x="210" y="760">#F4F7FF</text>
  </g>
  <!-- the 9:16 frame with its grid crops -->
  <g transform="translate(760 1380)">
    <rect x="0" y="0" width="260" height="462" rx="10" fill="#071436" stroke="#F4F7FF" stroke-width="3"/>
    <rect x="0" y="68" width="260" height="325" fill="none" stroke="#0FB5AE" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="0" y="101" width="260" height="260" fill="none" stroke="#F4F7FF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 6"/>
    <rect x="22" y="118" width="216" height="96" rx="8" fill="#0FB5AE" fill-opacity="0.28"/>
    <circle cx="130" cy="290" r="62" fill="#F4F7FF" fill-opacity="0.16" stroke="#0FB5AE" stroke-width="2"/>
    <g font-family="IRANYekanXFaNum" text-anchor="middle">
      <text x="130" y="178" font-size="34" font-weight="700" fill="#F4F7FF">تیتر</text>
      <text x="130" y="300" font-size="24" fill="#F4F7FF">المان</text>
      <text x="130" y="94" font-size="18" fill="#0FB5AE">۴:۵</text>
      <text x="130" y="384" font-size="18" fill="#F4F7FF">۱:۱</text>
    </g>
  </g>
</svg>
