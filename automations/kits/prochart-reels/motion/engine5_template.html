<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
const DATA=/*DATA*/;
const FONTS=/*FONTS*/;
const LOGO_SRC=/*LOGO*/;
const C=document.getElementById('c'), X=C.getContext('2d');
const W=1080,H=1920,M='#D4A64A',K='#000';
const mA=a=>`rgba(212,166,74,${Math.max(0,Math.min(1,a)).toFixed(3)})`;
const kA=a=>`rgba(0,0,0,${Math.max(0,Math.min(1,a)).toFixed(3)})`;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const P=(t,t0,d)=>clamp((t-t0)/d);
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eback=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296;};}
const L={};DATA.lines.forEach(l=>L[l.n]=l.words);
const s=(n,i)=>L[n][i].s, e=(n,i)=>L[n][i].e;
const B=id=>DATA.beats[id];
const END=DATA.end;
const F=(px,w)=>`${px}px YK${w}`;
let LOGO=null;
window.READY=false;
Promise.all(Object.entries(FONTS).map(([k,b64])=>{const f=new FontFace('YK'+k,`url(data:font/ttf;base64,${b64})`);return f.load().then(x=>document.fonts.add(x));}))
 .then(()=>new Promise(r=>{LOGO=new Image();LOGO.onload=r;LOGO.src=LOGO_SRC;}))
 .then(()=>{window.READY=true;});

/* ---------- primitives ---------- */
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));}
function T(str,x,y,px,wt,col,al='center',dir='rtl'){X.font=F(px,wt);X.fillStyle=col;X.textAlign=al;X.textBaseline='middle';X.direction=dir;X.fillText(str,x,y+px*0.06);}
function TW(str,px,wt,dir='rtl'){X.font=F(px,wt);X.direction=dir;return X.measureText(str).width;}
function line(x1,y1,x2,y2,lw,col,dash){X.save();X.strokeStyle=col;X.lineWidth=lw;if(dash)X.setLineDash(dash);X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.stroke();X.restore();}
// pill / chip with right-to-left mask reveal
function chip(t,t0,str,x,y,px,o={}){
  const p=P(t,t0,o.dur||0.38); if(p<=0) return;
  const out=o.out?P(t,o.out,0.3):0; if(out>=1) return;
  const wt=o.wt||'8', dir=o.dir||'rtl';
  const w=TW(str,px,wt,dir)+px*1.0, h=px*1.55;
  X.save(); X.translate(x,y-out*40); X.rotate(o.rot||0);
  const e=eback(p), sc=(o.pop??0.55)+(1-(o.pop??0.55))*e; X.scale(sc,sc);
  X.globalAlpha*=clamp(p*3)*(1-out)*(o.alpha??1);
  const rv=eo(clamp(p*1.4)); X.beginPath(); X.rect(w/2-w*rv-6,-h,w*rv+12,h*2); X.clip();
  rr(-w/2,-h/2,w,h,o.r??h/2);
  if(o.outline){X.fillStyle=K;X.fill();X.lineWidth=Math.max(3,px*0.07);X.strokeStyle=M;X.stroke();T(str,0,0,px,wt,M,'center',dir);}
  else{X.fillStyle=M;X.fill();T(str,0,0,px,wt,K,'center',dir);}
  X.restore();
}
// a row of words, RTL, each word rises out of a mask exactly at its time. words: [{w,s,st}] st: n|hl|ol
function row(t,words,cx,y,px,wt,o={}){
  X.font=F(px,wt);X.direction='rtl';
  const wd=words.map(w=>{X.font=F(px,w.wt||wt);return X.measureText(w.w).width;});
  const gp=i=>o.gap!=null?o.gap:px*0.27+((words[i].st==='hl'||(words[i+1]&&words[i+1].st==='hl'))?px*0.26:0);
  let tot=wd.reduce((a,b)=>a+b,0);for(let i=0;i<words.length-1;i++)tot+=gp(i);
  const sc=o.maxW&&tot>o.maxW?o.maxW/tot:1;
  X.save();X.translate(cx,y);X.scale(sc,sc);
  let xr=tot/2;
  words.forEach((w,i)=>{
    const xc=xr-wd[i]/2, p=P(t,w.s-(o.lead??0.06),o.dur??0.3);
    if(p>0){
      X.save();
      const hb=w.st==='hl';
      X.beginPath();X.rect(xc-wd[i]/2-px*0.45,-px*1.0,wd[i]+px*0.9,px*2.0);X.clip();
      const yo=(1-eo(p))*px*0.85; X.translate(xc,yo); const k=0.86+0.14*eback(p); X.scale(k,k);
      X.globalAlpha*=clamp(p*3)*(o.alpha??1)*(w.al??1);
      if(hb){rr(-wd[i]/2-px*0.22,-px*0.66,wd[i]+px*0.44,px*1.32,px*0.2);X.fillStyle=M;X.fill();T(w.w,0,0,px,w.wt||wt,K);}
      else if(w.st==='ol'){X.font=F(px,w.wt||wt);X.textAlign='center';X.textBaseline='middle';X.direction='rtl';X.lineWidth=Math.max(2,px*0.03);X.strokeStyle=M;X.strokeText(w.w,0,px*0.06);}
      else T(w.w,0,0,px,w.wt||wt,M);
      X.restore();
    }
    xr-=wd[i]+(i<words.length-1?gp(i):0);
  });
  X.restore();
  return tot*sc;
}
const WL=(n,i0,i1,st={})=>L[n].slice(i0,i1+1).map((w,k)=>({w:w.w,s:w.s,st:st[i0+k]||'n'}));

/* ---------- background: parallax grids, glow, particles ---------- */
const PR=(()=>{const r=rng(7);return Array.from({length:130},()=>({x:r()*W,y:r()*H,z:0.2+r()*0.8,ph:r()*6.28,sp:0.5+r()}));})();
function grid(step,a,cam,par,t,sp){
  X.save();X.strokeStyle=mA(a);X.lineWidth=1.4;
  const z=1+(cam.z-1)*par;X.translate(540,960);X.scale(z,z);X.translate(-540,-960);
  const ox=(((-cam.x*par-t*sp)%step)+step)%step, oy=(((-cam.y*par-t*sp*0.6)%step)+step)%step;
  X.beginPath();
  for(let x=ox-step*3;x<W+step*3;x+=step){X.moveTo(x,-300);X.lineTo(x,H+300);}
  for(let y=oy-step*3;y<H+step*3;y+=step){X.moveTo(-300,y);X.lineTo(W+300,y);}
  X.stroke();X.restore();
}
function bg(t,cam){
  X.fillStyle=K;X.fillRect(0,0,W,H);
  const gx=540+Math.sin(t*0.37)*220-cam.x*0.2, gy=860+Math.cos(t*0.29)*180-cam.y*0.2;
  const g=X.createRadialGradient(gx,gy,0,gx,gy,980);g.addColorStop(0,mA(0.16));g.addColorStop(0.55,mA(0.05));g.addColorStop(1,mA(0));
  X.fillStyle=g;X.fillRect(0,0,W,H);
  grid(36,0.035,cam,0.25,t,4);
  grid(144,0.085,cam,0.55,t,9);
  // sweeping scan line
  const sy=((t*260)%2600)-340; const sg=X.createLinearGradient(0,sy-120,0,sy+4);sg.addColorStop(0,mA(0));sg.addColorStop(1,mA(0.07));
  X.fillStyle=sg;X.fillRect(0,sy-120,W,124);
  for(const p of PR){
    const par=0.2+p.z*0.9;
    let x=p.x+Math.sin(t*0.7*p.sp+p.ph)*34*p.z-cam.x*par, y=p.y-t*(16+46*p.z)*p.sp-cam.y*par;
    x=((x%W)+W)%W;y=((y%H)+H)%H;
    const r=0.8+2.6*p.z*p.z, a=(0.1+0.45*p.z)*(0.55+0.45*Math.sin(t*2.2*p.sp+p.ph));
    X.fillStyle=mA(a);X.beginPath();X.arc(x,y,r,0,6.283);X.fill();
  }
}
function vignette(){const g=X.createRadialGradient(540,900,500,540,900,1250);g.addColorStop(0,kA(0));g.addColorStop(1,kA(0.75));X.fillStyle=g;X.fillRect(0,0,W,H);}
function burst(t,t0,cx,cy,o={}){
  const life=o.life||0.8, dt=t-t0; if(dt<0||dt>life) return;
  const r=rng(o.seed||3), n=o.n||34, sp=o.sp||820;
  X.save();X.strokeStyle=M;X.lineCap='round';
  for(let i=0;i<n;i++){const a=r()*6.283,v=sp*(0.35+0.65*r()),d=v*dt*(1-0.45*dt/life),x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d+220*dt*dt,al=1-dt/life,len=10+18*r();
    X.globalAlpha=al;X.lineWidth=2+3*r();X.beginPath();X.moveTo(x,y);X.lineTo(x-Math.cos(a)*len*(1-dt/life),y-Math.sin(a)*len*(1-dt/life));X.stroke();}
  // shock ring
  X.globalAlpha=(1-dt/life)*0.9;X.lineWidth=6*(1-dt/life)+1;X.beginPath();X.arc(cx,cy,30+(o.ring||420)*eo(dt/life),0,6.283);X.stroke();
  X.restore();
}

/* ---------- candles ---------- */
const CD=(()=>{const r=rng(42);let v=100;const a=[];for(let i=0;i<160;i++){const o=v,d=(r()-0.46)*7+Math.sin(i/6)*2.2,c=o+d,h=Math.max(o,c)+0.5+r()*3.2,l=Math.min(o,c)-0.5-r()*3.2;a.push({o,c,h,l});v=c;}return a;})();
function vrange(a,b){let lo=1e9,hi=-1e9;for(let i=Math.max(0,a);i<Math.min(CD.length,b);i++){lo=Math.min(lo,CD[i].l);hi=Math.max(hi,CD[i].h);}return [lo-(hi-lo)*0.08,hi+(hi-lo)*0.08];}
function candle(x,d,g,map,bw,lw=3,al=1){
  if(g<=0) return; g=clamp(g);
  const c=d.o+(d.c-d.o)*g, hi=Math.max(d.o,c)+(d.h-Math.max(d.o,d.c))*g, lo=Math.min(d.o,c)-(Math.min(d.o,d.c)-d.l)*g;
  const yo=map(d.o),yc=map(c),yh=map(hi),yl=map(lo),top=Math.min(yo,yc),bh=Math.max(3,Math.abs(yc-yo));
  X.save();X.globalAlpha*=al;X.strokeStyle=M;X.fillStyle=M;X.lineWidth=lw;
  X.beginPath();X.moveTo(x,yh);X.lineTo(x,top);X.moveTo(x,top+bh);X.lineTo(x,yl);X.stroke();
  if(d.c>=d.o) X.fillRect(x-bw/2,top,bw,bh); else {X.fillStyle=K;X.fillRect(x-bw/2,top,bw,bh);X.strokeRect(x-bw/2+lw/2,top+lw/2,bw-lw,Math.max(1,bh-lw));}
  X.restore();
}
// draw candles index i in [a, a+n) with growth for fractional tail; xOf(i) gives centre x
function candles(a,n,xOf,map,bw,o={}){
  const full=Math.floor(n), fr=n-full;
  for(let k=0;k<=full;k++){const i=a+k;if(i<0||i>=CD.length)continue;const g=k<full?1:fr;if(g<=0)continue;const x=xOf(i);if(x<-60||x>W+60)continue;
    candle(x,CD[i],o.grow?eo(g):1,map,bw,o.lw||3,(o.al??1)*(o.grow?1:clamp(g*1.5)));}
}

/* ---------- icons ---------- */
function playMorph(x,y,s,m,col=K){ // m=0 play, 1 pause
  const tri=[[[-.38,-.5],[.06,-.26],[.06,.26],[-.38,.5]],[[.06,-.26],[.5,0],[.5,0],[.06,.26]]];
  const pau=[[[-.42,-.5],[-.12,-.5],[-.12,.5],[-.42,.5]],[[.12,-.5],[.42,-.5],[.42,.5],[.12,.5]]];
  X.save();X.fillStyle=col;
  for(let q=0;q<2;q++){X.beginPath();for(let v=0;v<4;v++){const px=lerp(tri[q][v][0],pau[q][v][0],m)*s,py=lerp(tri[q][v][1],pau[q][v][1],m)*s;v?X.lineTo(x+px,y+py):X.moveTo(x+px,y+py);}X.closePath();X.fill();}
  X.restore();
}
function rewindIcon(x,y,s,col=M){X.save();X.fillStyle=col;for(const dx of [-.02,.46]){X.beginPath();X.moveTo(x+(dx-.48)*s,y);X.lineTo(x+dx*s,y-.42*s);X.lineTo(x+dx*s,y+.42*s);X.closePath();X.fill();}X.restore();}
function stepIcon(x,y,s,col=M){X.save();X.fillStyle=col;X.beginPath();X.moveTo(x-.4*s,y-.42*s);X.lineTo(x+.25*s,y);X.lineTo(x-.4*s,y+.42*s);X.closePath();X.fill();X.fillRect(x+.28*s,y-.42*s,.14*s,.84*s);X.restore();}
function replayArc(x,y,r,rot,lw=8,col=M){X.save();X.translate(x,y);X.rotate(rot);X.strokeStyle=col;X.lineWidth=lw;X.lineCap='round';X.beginPath();X.arc(0,0,r,0.35,5.6);X.stroke();
  const a=5.6,ax=Math.cos(a)*r,ay=Math.sin(a)*r;X.fillStyle=col;X.beginPath();X.moveTo(ax+lw*1.6,ay-lw*0.2);X.lineTo(ax-lw*1.2,ay-lw*1.9);X.lineTo(ax-lw*1.0,ay+lw*1.5);X.closePath();X.fill();X.restore();}
function lockIcon(x,y,s,closed,col=M){X.save();X.strokeStyle=col;X.fillStyle=col;X.lineWidth=s*0.12;const sh=(1-closed)*s*0.28;
  X.beginPath();X.arc(x,y-s*0.15-sh,s*0.28,Math.PI,0);X.lineTo(x+s*0.28,y-s*0.05-sh*0.3);X.moveTo(x-s*0.28,y-s*0.15-sh);X.lineTo(x-s*0.28,y-s*0.05);X.stroke();
  rr(x-s*0.42,y-s*0.05,s*0.84,s*0.62,s*0.1);X.fill();X.fillStyle=K;X.beginPath();X.arc(x,y+s*0.22,s*0.08,0,6.283);X.fill();X.restore();}
function checkMark(x,y,s,p,col=K,lw=10){if(p<=0)return;X.save();X.strokeStyle=col;X.lineWidth=lw;X.lineCap='round';X.lineJoin='round';
  const pts=[[-.32,0],[-.08,.24],[.36,-.24]],L1=Math.hypot(.24,.24),L2=Math.hypot(.44,.48),tot=L1+L2,d=p*tot;
  X.beginPath();X.moveTo(x+pts[0][0]*s,y+pts[0][1]*s);
  if(d<=L1){const q=d/L1;X.lineTo(x+lerp(pts[0][0],pts[1][0],q)*s,y+lerp(pts[0][1],pts[1][1],q)*s);}
  else{X.lineTo(x+pts[1][0]*s,y+pts[1][1]*s);const q=(d-L1)/L2;X.lineTo(x+lerp(pts[1][0],pts[2][0],q)*s,y+lerp(pts[1][1],pts[2][1],q)*s);}
  X.stroke();X.restore();}
function qmark(x,y,px,al=1,glow=0){X.save();X.globalAlpha*=al;if(glow){X.shadowColor=mA(0.9);X.shadowBlur=glow;}T('؟',x,y,px,'X',M);X.restore();}
function logo(x,y,sz,al=1){if(!LOGO)return;X.save();X.globalAlpha*=al;const r=LOGO.width/LOGO.height;X.drawImage(LOGO,x-sz*r/2,y-sz/2,sz*r,sz);X.restore();}
function strokeProgress(pts,p){ // polyline drawn up to fraction p
  let tot=0;const seg=[];for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);tot+=l;}
  let d=p*tot;X.beginPath();X.moveTo(pts[0][0],pts[0][1]);let last=pts[0];
  for(let i=1;i<pts.length;i++){if(d<=0)break;const l=seg[i-1];const q=Math.min(1,d/l);last=[lerp(pts[i-1][0],pts[i][0],q),lerp(pts[i-1][1],pts[i][1],q)];X.lineTo(last[0],last[1]);d-=l;}
  X.stroke();return last;}

/* ---------- transitions ---------- */
function wipe(t,tc){ // mustard diagonal band right->left, fully covering at tc
  const a=t-(tc-0.3), b=t-tc; if(a<0||b>0.42) return;
  const lead=eio(clamp(a/0.3)), trail=eio(clamp(b/0.42)), sl=520;
  const xR=lerp(W+sl,-sl,trail), xL=lerp(W+sl,-sl,lead);
  X.save();X.fillStyle=M;X.beginPath();X.moveTo(xL+sl/2,0);X.lineTo(xR+sl/2+40,0);X.lineTo(xR-sl/2+40,H);X.lineTo(xL-sl/2,H);X.closePath();X.fill();
  X.fillStyle=kA(0.22);const m=(xL+xR)/2;X.beginPath();X.moveTo(m+sl/2-30,0);X.lineTo(m+sl/2+30,0);X.lineTo(m-sl/2+30,H);X.lineTo(m-sl/2-30,H);X.closePath();X.fill();
  line(xL+sl/2-70,0,xL-sl/2-70,H,10,M);
  X.restore();
}

/* ---------- camera ---------- */
function camOf(t,t0,t1,o={}){
  const ph=o.ph||0;let z=1+(o.zoom??0.05)*eio(P(t,t0,t1-t0)),x=Math.sin(t*0.8+ph)*(o.dx??12),y=Math.cos(t*0.63+ph)*(o.dy??10),r=Math.sin(t*0.45+ph)*(o.rot??0.006);
  (o.steps||[]).forEach(([ts,dz,dx,dy,d])=>{const q=eio(P(t,ts,d||0.5));z+=dz*q;x+=(dx||0)*q;y+=(dy||0)*q;});
  (o.punch||[]).forEach(([tp,a])=>{const q=t-tp;if(q>0)z+=a*Math.exp(-q*3.5)*(1-Math.exp(-q*28));});
  (o.shake||[]).forEach(([ts,a])=>{const q=t-ts;if(q>0&&q<0.6){const k=a*Math.exp(-q*8);x+=Math.sin(q*95)*k;y+=Math.cos(q*71)*k;r+=Math.sin(q*60)*k*0.0012;}});
  return {x,y,z,r};
}
function applyCam(c){X.translate(540,960);X.scale(c.z,c.z);X.rotate(c.r);X.translate(-540-c.x,-960-c.y);}

/* ---------- player bar (replay UI) ---------- */
function player(t,y,st){ // st: {al, head(0..1), play(0..1), pr: rewind pulse t, pp: play pulse t, ps: step pulse t, count}
  const al=st.al??1; if(al<=0) return;
  X.save();X.globalAlpha*=al;
  rr(70,y-70,940,140,70);X.fillStyle=kA(0.88);X.fill();X.lineWidth=4;X.strokeStyle=M;X.stroke();
  const pulse=(tp)=>{const q=t-tp;return q>0&&q<0.45?Math.sin(q/0.45*Math.PI):0;};
  // buttons (RTL: play on the right)
  const bx=[910,800,690];
  // play button
  let k=1+0.22*pulse(st.pp||-9);X.save();X.translate(bx[0],y);X.scale(k,k);X.beginPath();X.arc(0,0,46,0,6.283);X.fillStyle=M;X.fill();playMorph(4,0,46,st.play??0,K);X.restore();
  // rewind
  k=1+0.3*pulse(st.pr||-9);X.save();X.translate(bx[1],y);X.scale(k,k);X.beginPath();X.arc(0,0,40,0,6.283);X.lineWidth=4;X.strokeStyle=M;X.stroke();
  if(pulse(st.pr||-9)>0){X.fillStyle=mA(0.35*pulse(st.pr));X.fill();}rewindIcon(-2,0,40);X.restore();
  // step forward
  k=1+0.3*pulse(st.ps||-9);X.save();X.translate(bx[2],y);X.scale(k,k);X.beginPath();X.arc(0,0,40,0,6.283);X.lineWidth=4;X.strokeStyle=M;X.stroke();
  if(pulse(st.ps||-9)>0){X.fillStyle=mA(0.35*pulse(st.ps));X.fill();}stepIcon(0,0,36);X.restore();
  // timeline (RTL: progress grows right->left)
  const x1=610,x0=130,hd=lerp(x1,x0,clamp(st.head??0.5));
  line(x0,y+18,x1,y+18,8,mA(0.3));line(hd,y+18,x1,y+18,8,M);
  X.beginPath();X.arc(hd,y+18,15,0,6.283);X.fillStyle=M;X.fill();
  // counter
  if(st.count!=null) T(`کندل ${Math.round(st.count)}`,370,y-24,34,'7',M);
  X.restore();
}

/* ---------- subtitles (screen space, safe zone) ---------- */
const SUBS=DATA.subs.map((c,i,a)=>({...c,until:Math.min(i+1<a.length?a[i+1].words[0].s-0.04:c.end+0.6,c.end+0.7)}));
function subtitles(t){
  if(t<B('2a')||t>=B('10a')) return;
  const c=SUBS.find(c=>t>=c.words[0].s-0.06&&t<c.until); if(!c) return;
  const px=60, y=1452;
  const words=c.words.map((w,i)=>{const nx=i+1<c.words.length?c.words[i+1].s:c.end+0.25;return {w:w.w,s:w.s,st:(t>=w.s&&t<nx)?'hl':'n'};});
  X.font=F(px,'8');X.direction='rtl';
  const tot=words.reduce((a,w)=>a+X.measureText(w.w).width,0)+px*0.52*(words.length-1);
  const mw=800, sc=tot>mw?mw/tot:1, bw=Math.min(tot,mw)+90;
  const pin=P(t,c.words[0].s-0.06,0.25);
  X.save();X.globalAlpha*=eo(pin);

    const ar=P(t,s(9,5)-0.1,0.3);if(ar>0){const by=1200+Math.abs(Math.sin(t*5))*26;X.save();X.globalAlpha*=ar;X.strokeStyle=M;X.lineWidth=12;X.lineCap='round';X.lineJoin='round';X.beginPath();X.moveTo(540,by-80);X.lineTo(540,by);X.moveTo(500,by-36);X.lineTo(540,by);X.lineTo(580,by-36);X.stroke();X.restore();}
  }
  if(layer==='hud'){chip(t,s(9,3)-0.08,'کامنت کن',540,420,64,{wt:'X'});}
}

/* shot 10 — the warning, calm: «یادت باشه، معامله ریسک داره و نتیجه‌ی گذشته، تضمین آینده نیست.» */
function shot10(t,layer){
  if(layer==='cam') return camOf(t,S9,S10,{zoom:0.05,ph:8,dx:6,dy:6,rot:0.003});
  if(layer==='scene'){
    // faint candles drifting slowly
    X.save();X.globalAlpha*=0.22;const [lo,hi]=vrange(90,130),map=v=>1080+260*(1-(v-lo)/(hi-lo));candles(90,40,i=>(i-90)*34-((t-S9)*24),map,18,{lw:2});X.restore();
    const fr=eo(P(t,s(10,0)-0.15,0.9));
    X.save();X.strokeStyle=M;X.lineWidth=4;const pts=[[540,420],[980,420],[980,1010],[100,1010],[100,420],[540,420]];strokeProgress(pts,fr);X.restore();
    const tr=P(t,s(10,0)-0.1,0.4);if(tr>0){X.save();X.translate(540,420);X.scale(eback(tr),eback(tr));X.beginPath();X.arc(0,0,60,0,6.283);X.fillStyle=K;X.fill();
      X.strokeStyle=M;X.lineWidth=7;X.lineJoin='round';X.beginPath();X.moveTo(0,-34);X.lineTo(36,28);X.lineTo(-36,28);X.closePath();X.stroke();X.fillStyle=M;X.fillRect(-3.5,-12,7,22);X.beginPath();X.arc(0,19,4.5,0,6.283);X.fill();X.restore();}
    const qa=P(t,s(10,9)-0.1,0.5);if(qa>0) qmark(880,880,230,0.28*eo(qa)+0.05*Math.sin(t*4));
  }
  if(layer==='hud'){
    row(t,WL(10,0,1),540,540,58,'7');
    row(t,WL(10,2,4,{3:'hl'}),540,670,88,'X');
    row(t,WL(10,5,7),540,800,88,'X');
    row(t,WL(10,8,10,{10:'hl'}),540,930,88,'X');
  }
}

/* shot 11 — end card: «اول نمودار، بعد تصمیم… پرو چارت.» + «کامنت: بازپخش» */
function shot11(t,layer){
  if(layer==='cam') return camOf(t,S10,END,{zoom:0.06,ph:9,dx:5,dy:5,rot:0.002});
  if(layer==='scene'){
    // three small candles grow on «نمودار»
    [0,1,2].forEach(k=>{const g=eo(P(t,s(11,1)-0.05+k*0.12,0.35));if(g<=0)return;const h=[70,110,150][k]*g;X.fillStyle=M;X.fillRect(470+k*50,520-h,30,h);line(485+k*50,520-h-22*g,485+k*50,520,4,M);});
    // mustard block for «بعد تصمیم»
    const bp=eio(P(t,s(11,2)-0.1,0.4));
    if(bp>0){X.fillStyle=M;rr(980-860*bp,735,860*bp,150,24);X.fill();}
    // logo + ring
    const lp=P(t,s(11,4)-0.12,0.45);
    if(lp>0){X.save();X.translate(540,1015);const k=eback(lp);X.scale(k,k);logo(0,0,130);X.restore();burst(t,s(11,4),540,1015,{n:26,sp:600,ring:260,seed:17,life:0.7});
      X.save();X.strokeStyle=mA(0.8);X.lineWidth=4;X.beginPath();X.arc(540,1015,110,t*1.6,t*1.6+4.5*eo(lp));X.stroke();X.restore();}
    // CTA pill «کامنت کن: بازپخش»
    const cp=P(t,B('11c')-0.05,0.45);
    if(cp>0){X.save();X.translate(540,1300);const k=eback(cp);X.scale(k,k);
      rr(-330,-62,660,124,62);X.fillStyle=K;X.fill();X.lineWidth=5;X.strokeStyle=M;X.stroke();
      T('کامنت کن:',150,0,50,'X',M);rr(-300,-46,330,92,46);X.fillStyle=M;X.fill();T('بازپخش',-135,0,56,'X',K);
      const q=((t-B('11c'))%0.9)/0.9;X.globalAlpha*=(1-q)*0.8;X.lineWidth=4;X.strokeStyle=M;rr(-330-q*50,-62-q*30,660+q*100,124+q*60,62+q*30);X.stroke();X.restore();}
  }
  if(layer==='hud'){
    row(t,WL(11,0,1),540,640,128,'X');
    X.save();X.beginPath();X.rect(0,735,W,150);X.clip();row(t,WL(11,2,3).map(w=>({...w,st:'n'})),540,810,118,'X',{});X.restore();
    // black text on the mustard block
    const bp=eio(P(t,s(11,2)-0.1,0.4));
    if(bp>0){X.save();X.beginPath();X.rect(980-860*bp,735,860*bp,150);X.clip();
      const wds=WL(11,2,3);X.font=F(118,'X');const w0=X.measureText(wds[0].w).width,w1=X.measureText(wds[1].w).width,gap=118*0.27,tot=w0+w1+gap;
      const x0=540+tot/2-w0/2, x1=540+tot/2-w0-gap-w1/2;
      [[wds[0],x0],[wds[1],x1]].forEach(([w,x])=>{const p=P(t,w.s-0.06,0.3);if(p>0){X.save();X.translate(x,810+(1-eo(p))*90);X.globalAlpha*=clamp(p*3);T(w.w,0,0,118,'X',K);X.restore();}});
      X.restore();}
    row(t,WL(11,4,5),540,1160,96,'X');
  }
}

const SHOTS=[[0,S1,shot1],[S1,S2,shot2],[S2,S3,shot34],[S3,S5,shot5],[S5,S6,shot6],[S6,S7,shot7],[S7,S8,shot8],[S8,S9,shot9],[S9,S10,shot10],[S10,999,shot11]];
const WIPES=[S1,S5,S6,S7,S8,S9,S10];
function drawShot(t,sh){
  const cam=sh[2](t,'cam');
  bg(t,cam);
  X.save();applyCam(cam);sh[2](t,'scene');X.restore();
  vignette();
  // HUD gets a softer share of the camera (parallax)
  X.save();const hc={x:cam.x*0.45,y:cam.y*0.45,z:1+(cam.z-1)*0.35,r:cam.r*0.5};applyCam(hc);sh[2](t,'hud');X.restore();
}
function draw(t){
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;X.setLineDash([]);
  const k=SHOTS.findIndex(sh=>t>=sh[0]&&t<sh[1]);const sh=SHOTS[Math.max(0,k)];
  drawShot(t,sh);
  // iris transition from the chart story into the decision shot
  if(sh[2]===shot5&&t<S3+0.45){
    const r=eio(P(t,S3,0.45))*1250;
    X.save();X.beginPath();X.rect(0,0,W,H);X.arc(540,860,r,0,6.283,true);X.clip();drawShot(t,SHOTS[2]);X.restore();
    X.save();X.strokeStyle=M;X.lineWidth=14;X.beginPath();X.arc(540,860,r,0,6.283);X.stroke();X.restore();
  }
  subtitles(t);
  WIPES.forEach(tc=>wipe(t,tc));
  // closing fade on the last 0.25 s
  const fo=P(t,END-0.25,0.25);if(fo>0){X.fillStyle=kA(fo*0.6);X.fillRect(0,0,W,H);}
}
window.frame=function(t){draw(t);return C.toDataURL('image/jpeg',0.93);};
window.draw=draw;
