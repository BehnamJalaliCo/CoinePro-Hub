    <line x1="224" y1="240" x2="224" y2="300"/><rect x="216" y="252" width="16" height="30" fill="#000000"/>
    <line x1="252" y1="190" x2="252" y2="270"/><rect x="244" y="205" width="16" height="50" fill="#D4A64A"/>
    <line x1="280" y1="150" x2="280" y2="225"/><rect x="272" y="162" width="16" height="48" fill="#D4A64A"/>
