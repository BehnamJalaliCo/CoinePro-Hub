<!doctype html>
<!-- A Telegram card (1080x1350): copy it, change the texts and the picture, render with tg_card.py.
     The page's look: ink #05060A, the spectral light, Estedad/IRANYekanX for Persian, Geist for Latin. -->
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
@@FONTS@@
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#05060A;color:#F2F4F8;font-family:YKX,EST,sans-serif;overflow:hidden}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 85% 10%,rgba(91,140,255,.35),transparent 60%),
  radial-gradient(800px 600px at 10% 90%,rgba(168,85,247,.28),transparent 60%),#05060A}
.wrap{position:absolute;inset:72px;display:flex;flex-direction:column;gap:36px}
.kicker{font:800 38px EST;color:#9FB4FF;letter-spacing:0}
.title{font:900 92px/1.18 YKX,EST;unicode-bidi:plaintext}
.en{font-family:GEI,YKX,sans-serif;direction:ltr;unicode-bidi:isolate}
.body{font:500 44px/1.6 EST;color:#D6DBE6}
.hero{flex:1;border-radius:36px;background:center/cover no-repeat;border:1px solid rgba(255,255,255,.13)}
.foot{display:flex;justify-content:space-between;align-items:center;font:700 34px GEI;color:#8B93A7;direction:ltr}
.handle{display:flex;align-items:center;gap:16px}
.handle img{width:56px;height:56px;border-radius:50%}
</style></head><body><div class="bg"></div><div class="wrap">
  <div class="kicker">🛠 ابزار روز</div>
  <div class="title">ایجنت کدنویسی <span class="en">OpenAI</span> توی ترمینال</div>
  <div class="body">پروژه رو میخونه، فایل‌ها رو تغییر میده و دستورها رو خودش اجرا میکنه</div>
  <div class="hero" style="background-image:url('hero.jpg')"></div>
  <div class="foot"><span class="handle"><img src="@@LOGO@@" alt="">t.me/behnamjalali_tech</span><span>Ai &amp; TECH</span></div>
</div></body></html>
