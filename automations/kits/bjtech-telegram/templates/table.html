<!doctype html>
<!-- A comparison table (1080x1350): rows are things compared, columns what matters; numbers ONLY from the
     official pages (the source line at the bottom names them). Render with tg_card.py. -->
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
@@FONTS@@
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:#05060A;color:#F2F4F8;font-family:EST,sans-serif;overflow:hidden}
.wrap{position:absolute;inset:64px;display:flex;flex-direction:column;gap:32px}
h1{font:900 70px/1.2 YKX,EST}
table{width:100%;border-collapse:separate;border-spacing:0 14px;font:600 36px EST}
th{font:800 30px EST;color:#9FB4FF;text-align:right;padding:0 18px}
td{background:#0B0D15;padding:26px 18px;border-top:1px solid rgba(255,255,255,.13);border-bottom:1px solid rgba(255,255,255,.13)}
td:first-child{border-radius:0 22px 22px 0;border-right:1px solid rgba(255,255,255,.13)}
td:last-child{border-radius:22px 0 0 22px;border-left:1px solid rgba(255,255,255,.13)}
.en,.num{font-family:GEI,sans-serif;direction:ltr;unicode-bidi:isolate}
.win{color:#5BE49B}
.src{margin-top:auto;font:500 26px GEI;color:#8B93A7;direction:ltr;text-align:left}
</style></head><body><div class="wrap">
  <h1>⚖️ مقایسه‌ی قیمت مدل‌ها</h1>
  <table><thead><tr><th>مدل</th><th>ورودی / ۱M</th><th>خروجی / ۱M</th><th>مناسب برای</th></tr></thead><tbody>
    <tr><td class="en">GPT-6.2 Astra</td><td class="num">$8</td><td class="num">$40</td><td>سخت‌ترین کارها</td></tr>
    <tr><td class="en">GPT-6.2 Sol</td><td class="num win">$2</td><td class="num win">$10</td><td>بیشتر کارها</td></tr>
  </tbody></table>
  <div class="src">source: developers.openai.com/api/docs/pricing (checked today)</div>
</div></body></html>
