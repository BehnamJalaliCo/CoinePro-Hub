<script>
/* @behnamjalali.tech — the LUMEN stage (KIT/motion/stage.html; owner 2026-11-18: «پریمیوم‌ترین حالت ممکن که

   streamed captions, the key words). motion/reel.py fills the slots and appends the day's motion/scenes.js.
   Every frame is a pure function of time: frame(t) draws it and returns a JPEG data URL. DATA.size: 'reel'
   (1080×1920, Instagram) or 'wide' (1920×1080, the YouTube long video) — every API below works on both.

   THE DAY'S SCENES (motion/scenes.js) USE THIS API — parameters and shots, never a new engine:
   CONFIG({...})                    the video's settings (keys below)
   SHOT(at, (s, t) => {...}, {tr, d, caps, bg, name})

                                    its transition brings it in), t = the video's time. tr: the transition INTO it:

                                    'cut'; default = the look's family; d: its length (0.42 s). caps:false hides
                                    the captions (a headline says it all). bg: 'grid' | 'aurora' | 'void' | 'dots'.

           i holding frag; END the video's end.
   Time:   pr(t,a,b) 0..1 · E.o3 E.o5 E.io E.back E.expo E.in2 E.spring · win(t,a,b,fi,fo) · osc(t,f,a)
           · ease(s, at, d, e) = e(pr(s, at, at+d)).
   Camera: CAM(s, {z, x, y, r, drift, punch:[t…]}) sets the shot's camera (always a micro drift; `punch`

   Type (Persian is Estedad, Latin is Geist, code is Geist Mono; Persian digits on screen):
           T(str, x, y, px, {w:300..900, f:'fa'|'en'|'mono', col, al:'center'|'right'|'left', alpha, spec, glow,
             track, maxW}) one line; spec:true fills it with the spectral gradient.
           HEAD(s, at, str, x, y, px, {keys:[words], w, stagger, al, lineH, maxW}) a kinetic headline (words rise
             out of a mask, key words in the spectrum; wraps by itself).
           BIG(s, at, str, x, y, px, {f, spec, track}) a giant number or name that lands with a blur-to-sharp.
           fa(n, dec) Persian digits («٫» decimals, «٬» groups) · count(s, at, d, from, to) an eased number.
   Panels: PANEL(x, y, w, h, {r, title, dot, alpha, accent, glass, tilt, lift}) a glass card (returns its inner
             box {x,y,w,h}); TERM(box, lines, s, at, {cps, prompt, col}) a terminal typing; CODE(box, src, s, at,
             {cps, from, scroll}) code with colours; BARS(box, rows, s, at, {hi, unit, max, title}) benchmark bars

             {unit, sub, al}) a big counter; CHIP(str, x, y, {col, f, px, al, alpha, fill}); CHECK(x, y, s, at, ok);
             IMG(name, x, y, w, h, {r, fit:'cover'|'contain', alpha, tilt, ring, zoom}) a still in a framed card
             (name = assets/use/<name>.jpg|png); ORB(x, y, r, s, {col}) a glowing node; LINK(x1, y1, x2, y2, s, at,
             {col}) a link with flowing light; NET(nodes, links, s, at) a network of agents; STREAM(box, s, {col})

   Colours: INK #05060A · TEXT #F2F4F8 · MUTED #8B91A5 · SPEC (the spectral stops) · PILLAR (the video's accent:
           repo mint · model violet · news red · tool cyan · trick amber · behind pink) · ACC = PILLAR's colour.

   mood: 0..3} (DIRECTION §6, the look of the day), kicker (the small label over the brand mark, e.g. «مدل

   The stage draws on top of the shots: the grade and grain, the brand mark, the captions, the gap chip, the

const D = /*DATA*/;
const IMG_SRC = /*IMAGES*/;
const FONTS = /*FONTS*/;
const LOGO_SRC = /*LOGO*/;
const LOGOR_SRC = /*LOGOR*/;  // ⟨2026-11-19⟩ the round logo with its rim: beside the handle, never a coloured dot
const WIDE = D.size === 'wide';
const W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920;
const U = WIDE ? 1080 / 1920 : 1;              // the reel's px in a wide frame (type scale)
const MAIN = document.getElementById('c'); MAIN.width = W; MAIN.height = H;
const MX = MAIN.getContext('2d');
let X = MX;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const OFF = [mk(W, H), mk(W, H)].map(c => c.getContext('2d'));
const GLOWC = mk(W / 4 | 0, H / 4 | 0), GX = GLOWC.getContext('2d');
const INK = '#05060A', INK2 = '#0B0D15', TEXT = '#F2F4F8', MUTED = '#8B91A5', LINE = 'rgba(255,255,255,0.13)';
const SPEC = ['#7B61FF', '#3D8BFF', '#22D3EE', '#3CFFB5', '#FFD166', '#FF5FA2'];
const PILLARS = {repo: '#3CFFB5', model: '#9B87FF', news: '#FF4D5E', tool: '#22D3EE', trick: '#FFD166',
                 behind: '#FF5FA2', explain: '#3D8BFF'};
const PILLAR_FA = {repo: 'ریپوی روز', model: 'معرفی مدل', news: 'خبر داغ', tool: 'ابزار روز', trick: 'ترفند روز',
                   behind: 'پشت صحنه', explain: 'ساده بگم'};
const TR_FAMILY = ['scan', 'zoom', 'slide', 'iris', 'dissolve'];
const CFG = {pillar: 'model', look: {tr: 0, bg: 0, mood: 0}, kicker: '', caps: {}, noCaps: [], capY: WIDE ? H - 150 : 1440,
             gap: null, cta: null, end: null, edge: null, tail: 2.6, progress: true, handle: 'behnamjalali.tech',
             telegram: 't.me/behnamjalali_tech', endCard: true, captions: !WIDE, chapter: null};
let ACC = PILLARS.model;
const SH = [], BEATS = [];
const IM = {};
let LOGO = null, LOGOR = null, END = 0, NOW = 0;

/* ---------------------------------------------------------------- the scenes' API -- */
function CONFIG(o) { Object.assign(CFG, o); if (o.look) CFG.look = Object.assign({tr: 0, bg: 0, mood: 0}, o.look); ACC = PILLARS[CFG.pillar] || PILLARS.model; }

function LN(i) { return D.lines[i]; }
function WD(i, j) { const w = D.lines[i].words; return w[j < 0 ? w.length + j : j]; }
function WF(i, frag) { const w = D.lines[i].words.find(x => x.w.includes(frag)); if (!w) throw new Error(`WF(${i}, ${frag}): no such word`); return w; }

const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, p) => a + (b - a) * p;
const pr = (t, a, b) => cl((t - a) / Math.max(1e-6, b - a));
const E = {
  o3: p => 1 - Math.pow(1 - p, 3), o5: p => 1 - Math.pow(1 - p, 5), in2: p => p * p,
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),

const win = (t, a, b, fi = .25, fo = .25) => Math.min(pr(t, a, a + fi), 1 - pr(t, b - fo, b));
const osc = (t, f, a) => Math.sin(t * f * Math.PI * 2) * a;
function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
const FA_D = '۰۱۲۳۴۵۶۷۸۹';
function fa(n, dec = 0, group = true) {
  if (typeof n === 'string') return n.replace(/[0-9]/g, d => FA_D[+d]);
  let s = Number(n).toFixed(dec);
  let [a, b] = s.split('.');
  if (group) a = a.replace(/\B(?=(\d{3})+(?!\d))/g, '٬');
  s = b ? a + '٫' + b : a;

}
const count = (s, at, d, from, to) => mix(from, to, E.o5(pr(s, at, at + d)));
const LATIN = /[A-Za-z0-9$%@./:_\-+#×]/;
const isLatin = w => /^[\x20-\x7E×→←–—≈± ]+$/.test(w) && /[A-Za-z0-9$%]/.test(w);

/* ------------------------------------------------------------------- type -- */
const FAM = {fa: 'EST', en: 'GEI', mono: 'GMO'};
function font(px, w = 700, f = 'fa') { return `${w} ${Math.round(px)}px ${FAM[f] || f}`; }
function specFill(x0, y0, x1, y1, t = NOW, alpha = 1) {
  const g = X.createLinearGradient(x0, y0, x1, y1);
  const sh = (t * .12) % 1;
  for (let k = 0; k <= 6; k++) {
    const p = (k / 6 + sh) % 1;
    g.addColorStop(p, SPEC[k % SPEC.length]);
  }
  g.addColorStop(0, SPEC[Math.floor(sh * 6) % 6]); g.addColorStop(1, SPEC[(Math.floor(sh * 6) + 5) % 6]);
  return g;
}
function T(str, x, y, px, o = {}) {
  const f = o.f || (isLatin(String(str)) ? 'en' : 'fa');
  X.save();
  X.globalAlpha *= (o.alpha === undefined ? 1 : o.alpha);
  X.font = font(px, o.w || (f === 'fa' ? 800 : 700), f);
  X.direction = f === 'fa' ? 'rtl' : 'ltr';
  X.textAlign = o.al || 'center';
  X.textBaseline = 'alphabetic';
  if (o.track) X.letterSpacing = `${o.track}px`;
  let s = String(str);
  if (o.maxW) { const m = X.measureText(s).width; if (m > o.maxW) X.font = font(px * o.maxW / m, o.w || (f === 'fa' ? 800 : 700), f); }
  const m = X.measureText(s);
  const w = m.width;
  const x0 = X.textAlign === 'center' ? x - w / 2 : (X.textAlign === 'right' ? x - w : x);
  if (o.glow) { X.shadowColor = o.glowCol || o.col || ACC; X.shadowBlur = o.glow; }
  if (o.shadow) { X.shadowColor = 'rgba(0,0,0,.55)'; X.shadowBlur = o.shadow; X.shadowOffsetY = o.shadow / 4; }
  if (!o.glow && !o.shadow) { X.shadowColor = 'transparent'; X.shadowBlur = 0; X.shadowOffsetY = 0; }
  X.fillStyle = o.spec ? specFill(x0, y - px, x0 + w, y, NOW) : (o.col || TEXT);

}
function measure(str, px, w = 800, f = 'fa') { X.save(); X.font = font(px, w, f); X.direction = f === 'fa' ? 'rtl' : 'ltr'; const m = X.measureText(str).width; X.restore(); return m; }
// RTL tokens: a run of Latin words stays one token (its own order), so «GPT-6 Astra» never flips
function tokens(str) {
  const raw = String(str).split(/\s+/).filter(Boolean), out = [];
  for (const w of raw) {
    const lat = isLatin(w);
    if (lat && out.length && out[out.length - 1].lat) out[out.length - 1].w += ' ' + w;
    else out.push({w, lat});
  }
  return out;
}
function layoutRTL(toks, px, maxW, wFa = 800, wEn = 700) {
  const gap = px * .3, rows = [[]];
  let used = 0;
  for (const tk of toks) {
    tk.mw = measure(tk.w, px, tk.lat ? wEn : wFa, tk.lat ? 'en' : 'fa');
    if (used && used + gap + tk.mw > maxW) { rows.push([]); used = 0; }
    rows[rows.length - 1].push(tk); used += (used ? gap : 0) + tk.mw;
    tk.row = rows.length - 1;
  }
  for (const r of rows) {
    const tw = r.reduce((a, k) => a + k.mw, 0) + gap * (r.length - 1);
    let xr = tw / 2;  // relative to the centre, right to left
    for (const k of r) { k.xr = xr; k.xc = xr - k.mw / 2; xr -= k.mw + gap; }
    r.w = tw;
  }
  return rows;
}
function HEAD(s, at, str, x, y, px, o = {}) {
  const toks = tokens(str), keys = o.keys || [], stagger = o.stagger === undefined ? .07 : o.stagger;
  const rows = layoutRTL(toks, px, o.maxW || (W - 160), o.w || 900, 800), lh = px * (o.lineH || 1.18);
  const al = o.al || 'center';
  toks.forEach((k, i) => {
    const p = E.o5(pr(s, at + i * stagger, at + i * stagger + .55));
    if (p <= 0) return;
    const rw = rows[k.row].w;
    const cx = al === 'right' ? x - rw / 2 : al === 'left' ? x + rw / 2 : x;
    const yy = y + k.row * lh;
    X.save();
    X.beginPath(); X.rect(0, yy - px * 1.05, W, px * 1.42); X.clip();
    const dy = (1 - p) * px * .9;
    const isKey = keys.some(q => k.w.includes(q));
    T(k.w, cx + k.xc, yy + dy, px, {f: k.lat ? 'en' : 'fa', w: k.lat ? 800 : (o.w || 900), spec: isKey, col: o.col || TEXT,
                                     alpha: Math.min(1, p * 1.4), al: 'center'});
    X.restore();
  });
  return rows.length * lh;
}
function BIG(s, at, str, x, y, px, o = {}) {
  const p = E.o5(pr(s, at, at + .6));
  if (p <= 0) return;
  if (o.bloom !== false) {  // a soft light behind the hero
    const g = X.createRadialGradient(x, y - px * .35, 0, x, y - px * .35, px * 2.2);
    g.addColorStop(0, ACC + '30'); g.addColorStop(1, ACC + '00');
    X.save(); X.globalAlpha *= p; X.fillStyle = g; X.fillRect(x - px * 2.2, y - px * 2.6, px * 4.4, px * 4.4); X.restore();
  }
  X.save();
  X.globalAlpha *= p;
  const z = mix(1.18, 1, p);
  X.translate(x, y); X.scale(z, z);
  if (p < 1) X.filter = `blur(${(1 - p) * 14}px)`;
  T(str, 0, 0, px, {f: o.f || (isLatin(str) ? 'en' : 'fa'), w: o.w || 900, spec: o.spec !== false, track: o.track || 0, col: o.col, al: o.al || 'center'});
  X.restore();
}

/* ----------------------------------------------------------------- panels -- */
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function PANEL(x, y, w, h, o = {}) {
  const r = o.r === undefined ? 34 * (WIDE ? .8 : 1) : o.r, a = o.alpha === undefined ? 1 : o.alpha;
  X.save();
  X.globalAlpha *= a;
  if (o.lift !== false) { X.shadowColor = 'rgba(0,0,0,.55)'; X.shadowBlur = 60; X.shadowOffsetY = 24; }
  rr(x, y, w, h, r);
  const g = X.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, o.fill || 'rgba(22,25,38,0.92)'); g.addColorStop(1, o.fill2 || 'rgba(11,13,21,0.94)');
  X.fillStyle = g; X.fill();
  X.shadowColor = 'transparent'; X.shadowBlur = 0; X.shadowOffsetY = 0;
  // the hairline and the top light
  X.lineWidth = 1.6; X.strokeStyle = o.accent ? o.accent + '66' : LINE; X.stroke();
  const hl = X.createLinearGradient(x, y, x + w, y);
  hl.addColorStop(0, 'rgba(255,255,255,0)'); hl.addColorStop(.5, 'rgba(255,255,255,.28)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
  X.beginPath(); X.moveTo(x + r, y + .8); X.lineTo(x + w - r, y + .8); X.strokeStyle = hl; X.lineWidth = 1.4; X.stroke();
  let top = y;

    const hh = 64 * (WIDE ? .85 : 1);
    X.beginPath(); X.moveTo(x, y + hh); X.lineTo(x + w, y + hh); X.strokeStyle = 'rgba(255,255,255,.07)'; X.lineWidth = 1.2; X.stroke();
    const dot = o.dot || ACC;
    X.beginPath(); X.arc(x + 34, y + hh / 2, 7, 0, 7); X.fillStyle = dot; X.shadowColor = dot; X.shadowBlur = 14; X.fill();
    X.shadowBlur = 0; X.shadowColor = 'transparent';
    T(o.title, x + 56, y + hh / 2 + 9, 25 * (WIDE ? .85 : 1), {f: 'mono', w: 500, col: MUTED, al: 'left'});
    if (o.right) T(o.right, x + w - 30, y + hh / 2 + 9, 24 * (WIDE ? .85 : 1), {f: isLatin(o.right) ? 'mono' : 'fa', w: 600, col: MUTED, al: 'right'});
    top = y + hh;

}
const TOKC = {kw: '#C792EA', str: '#3CFFB5', num: '#FFD166', fn: '#7AB8FF', com: '#5B6078', op: '#89DDFF', txt: '#E6E9F2'};
function codeLine(str, x, y, px, upto = Infinity) {
  // a tiny highlighter: keywords, strings, numbers, calls, comments
  const re = /(\/\/.*$|#.*$)|("[^"]*"|'[^']*'|`[^`]*`)|\b(const|let|var|function|return|import|from|def|class|await|async|for|in|if|else|new|true|false|null|pip|npm|npx|git|clone|install|run|uv|curl)\b|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)(?=\()|([{}()\[\];,.=+\-*\/<>:|&!]+)/g;
  let last = 0, xx = x, shown = 0, m;
  X.font = font(px, 500, 'mono'); X.direction = 'ltr'; X.textAlign = 'left';
  const put = (txt, col) => {
    if (shown >= upto) return;
    const part = txt.slice(0, Math.max(0, upto - shown)); shown += txt.length;
    X.fillStyle = col; X.fillText(part, xx, y); xx += X.measureText(part).width;

    if (m.index > last) put(str.slice(last, m.index), TOKC.txt);
    const col = m[1] ? TOKC.com : m[2] ? TOKC.str : m[3] ? TOKC.kw : m[4] ? TOKC.num : m[5] ? TOKC.fn : TOKC.op;
    put(m[0], col); last = m.index + m[0].length;

}

  X.save(); X.globalAlpha *= a; X.fillStyle = ACC; X.shadowColor = ACC; X.shadowBlur = 12;
  X.fillRect(x + 4, y - px * .82, px * .5, px * .98); X.restore();
}
function TERM(box, lines, s, at, o = {}) {
  const cps = o.cps || 38, px = o.px || 30 * (WIDE ? .85 : 1), lh = px * 1.55;
  let tt = at, y = box.y + px;
  X.save(); X.beginPath(); X.rect(box.x - 10, box.y - 6, box.w + 20, box.h + 12); X.clip();
  lines.forEach((ln, i) => {
    const cmd = typeof ln === 'string' ? {c: ln} : ln;
    const isOut = !!cmd.out;
    const n = (cmd.c || cmd.out || '').length;
    const dur = isOut ? .12 : n / cps;
    const vis = isOut ? (s >= tt ? n : 0) : Math.floor(cl((s - tt) / Math.max(.01, dur)) * n);
    if (s >= tt - .02) {
      let x = box.x;
      if (!isOut) { X.font = font(px, 600, 'mono'); X.direction = 'ltr'; X.textAlign = 'left'; X.fillStyle = ACC; X.fillText(o.prompt || '$', x, y); x += px * 1.1; }
      const end = isOut ? (X.font = font(px, 400, 'mono'), X.fillStyle = cmd.col || MUTED, X.direction = 'ltr', X.textAlign = 'left', X.fillText(cmd.out, x, y), x + X.measureText(cmd.out).width)
                        : codeLine(cmd.c, x, y, px, vis);

      const lastLine = i === lines.length - 1 || s < tt + dur + (cmd.wait || .25);
      if (!isOut && (typing || (lastLine && i === lines.length - 1))) caret(end, y, px, s);
      y += lh;

  rr(x, y - 30, w, 60, 30); X.fillStyle = 'rgba(12,14,22,.66)'; X.fill(); X.lineWidth = 1.4; X.strokeStyle = LINE; X.stroke();
  if (LOGOR) {
    X.save(); X.beginPath(); X.arc(x + 7 + lr, y, lr, 0, 7); X.clip();
    X.drawImage(LOGOR, x + 7, y - lr, 2 * lr, 2 * lr); X.restore();
  } else {
    const pulse = .6 + .4 * Math.cos(t * 3.2);
    X.beginPath(); X.arc(x + 30, y, 8, 0, 7); X.fillStyle = specFill(x + 20, y - 8, x + 40, y + 8, t); X.shadowColor = ACC; X.shadowBlur = 14 * pulse; X.fill(); X.shadowBlur = 0;
  }

  const kick = CFG.kicker || PILLAR_FA[CFG.pillar] || '';
  if (kick) CHIP(kick, WIDE ? x + w + 24 : W / 2, WIDE ? y : y + 64, {px: WIDE ? 22 : 24, col: ACC, al: WIDE ? 'left' : 'center', alpha: .95});
  X.restore();
}
// ⟨2026-11-19⟩ the owner: a counter («۷ از 12» on a story) mixed digits and bidi scrambled its order. Every counter
// on the stage is COUNTER(n, of): Persian digits only, one right-to-left run (RLI … PDI), never a template string.
function COUNTER(n, of) {
  const s = `${fa(n, 0, false)} از ${fa(of, 0, false)}`;
  if (/[0-9٠-٩]/.test(s)) throw new Error('a counter with a Latin digit: ' + s);
  return '\u2067' + s + '\u2069';
}
function chapterChip(t) {
  const c = CFG.chapter; if (!c) return;
  const a = pr(t, .6, 1.1) * (1 - pr(t, END - .5, END));
  if (a <= 0) return;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = a;
  CHIP('فصل ' + COUNTER(c.n, c.of) + (c.title ? ` · ${c.title}` : ''), W - 70, WIDE ? 70 : 230,
       {px: WIDE ? 24 : 26, col: ACC, al: 'right', f: 'fa'});
  X.restore();
}
// a chapter's opening card (use it as the first shot of a long video's chapter): its number, title and re-hook
function CHAPTER(s, n, of, title, hook) {

  const p = E.o5(pr(s, 0, .7));
  X.save(); X.globalAlpha *= p;
  T(fa(n).padStart(2, '۰'), W / 2, H * .38, WIDE ? 220 : 300, {f: 'fa', w: 900, spec: true});
  X.restore();
  DIVIDER(W / 2 - (WIDE ? 380 : 300), H * .38 + (WIDE ? 50 : 70), WIDE ? 760 : 600, s, .25);
  HEAD(s, .35, title, W / 2, H * .38 + (WIDE ? 150 : 200), WIDE ? 74 : 86, {keys: [], maxW: WIDE ? 1500 : 940});
  if (hook) T(hook, W / 2, H * .38 + (WIDE ? 250 : 330), WIDE ? 38 : 44, {f: 'fa', w: 600, col: MUTED, alpha: ease(s, .9, .5), maxW: WIDE ? 1500 : 940});
  T('فصل ' + COUNTER(n, of), W / 2, H * .38 - (WIDE ? 250 : 330), WIDE ? 28 : 32, {f: 'fa', w: 700, col: ACC, alpha: ease(s, .1, .4)});
}
function videoBar(t) {
  // ⟨2026-11-18⟩ a long video's slim progress bar over the WHOLE video, its chapters as segments (D.videobar from
  // long.py bar: {start, total, marks:[chapter starts]}); the viewer always sees how far they are and what is left
  const vb = D.videobar; if (!vb || !vb.total) return;
  const p = cl((vb.start + t) / vb.total), y = H - 10, h = 6;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0);
  X.fillStyle = 'rgba(255,255,255,.10)'; X.fillRect(0, y, W, h);
  X.fillStyle = specFill(0, 0, W, 0, t); X.fillRect(W - W * p, y, W * p, h);  // right to left, as Persian reads
  X.fillStyle = INK;

}
function progressLine(t) {

  if (!CFG.progress) return;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0);
  const p = cl(t / END), y = WIDE ? 0 : 0;
  X.fillStyle = 'rgba(255,255,255,.06)'; X.fillRect(0, y, W, 6);
  X.fillStyle = specFill(0, 0, W, 0, t); X.fillRect(W - W * p, y, W * p, 6);  // right to left, as Persian reads
  X.restore();
}
function gapChip(t) {
  const g = CFG.gap; if (!g) return;
  const endAt = CFG.cta ? CFG.cta.at : (CFG.end ? CFG.end.at : END);
  const a = pr(t, g.at, g.at + .4) * (1 - pr(t, endAt - .3, endAt));

  CHIP(flipped ? g.a : g.q, x, y, {px: WIDE ? 26 : 30, col: flipped ? '#3CFFB5' : ACC, fill: flipped ? 'rgba(60,255,181,.10)' : 'rgba(255,255,255,.06)'});
  X.restore();
}
function ctaCard(t) {
  const c = CFG.cta; if (!c) return;
  const endAt = CFG.end ? CFG.end.at : END;
  const a = E.o5(pr(t, c.at, c.at + .5)) * (1 - pr(t, endAt - .25, endAt));
  if (a <= 0) return;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = a;
  const w = WIDE ? 760 : 940, h = WIDE ? 230 : 360, x = (W - w) / 2, y = WIDE ? H * .5 - h / 2 : 860 - h / 2;
  X.translate(0, (1 - a) * 40);

  const px = WIDE ? 34 : 50;
  T(c.line || 'این کلمه رو کامنت کن، برات دایرکت می‌فرستم', W / 2, y + (WIDE ? 120 : 140), px * .7, {f: 'fa', w: 600, col: '#C9CEDA', maxW: w - 80});
  const word = c.word || 'مدل', ww = measure(word, px * 1.6, 900) + 80;
  rr(W / 2 - ww / 2, y + (WIDE ? 140 : 180), ww, px * 2.1, px * 1.05); X.fillStyle = 'rgba(255,255,255,.07)'; X.fill();
  X.lineWidth = 2.5; X.strokeStyle = specFill(W / 2 - ww / 2, 0, W / 2 + ww / 2, 0, t); X.stroke();
  const typed = Math.floor(cl((t - c.at - .3) / .5) * [...word].length);
  T([...word].slice(0, typed).join(''), W / 2, y + (WIDE ? 140 : 180) + px * 1.45, px * 1.25, {f: 'fa', w: 900, spec: true});
  X.restore();
}
function endCard(t) {
  const e = CFG.end; if (!e) return;
  const a = E.o5(pr(t, e.at, e.at + .6));
  if (a <= 0) return;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0);
  X.globalAlpha = a * .92; X.fillStyle = INK; X.fillRect(0, 0, W, H);
  X.globalAlpha = a;

  const ring = X.createConicGradient(t * 1.2, W / 2, cy); SPEC.forEach((c, i) => ring.addColorStop(i / 6, c)); ring.addColorStop(1, SPEC[0]);
  X.beginPath(); X.arc(W / 2, cy, r + 14, 0, 7); X.lineWidth = 7; X.strokeStyle = ring; X.shadowColor = ACC; X.shadowBlur = 40; X.stroke(); X.shadowBlur = 0;
  if (LOGO) { X.save(); X.beginPath(); X.arc(W / 2, cy, r, 0, 7); X.clip(); X.drawImage(LOGO, W / 2 - r, cy - r, 2 * r, 2 * r); X.restore(); }
  else { X.beginPath(); X.arc(W / 2, cy, r, 0, 7); X.fillStyle = INK2; X.fill(); T('BJ', W / 2, cy + r * .3, r * .8, {f: 'en', w: 900, spec: true}); }
  T('Behnam Jalali', W / 2, cy + r + (WIDE ? 90 : 120), WIDE ? 58 : 76, {f: 'en', w: 800, col: TEXT});
  T('@' + CFG.handle, W / 2, cy + r + (WIDE ? 145 : 190), WIDE ? 32 : 40, {f: 'mono', w: 500, col: MUTED});
  const tg = CFG.telegram;

/* ------------------------------------------------------------- transitions -- */
function shotAt(t) { let s = null; for (const sh of SH) if (t >= sh.at) s = sh; return s; }
function drawShot(ctx, sh, t) {
  X = ctx;
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0);
  bgDraw(t, sh.bg);
  X.save();
  sh.fn(t - sh.at, t);
  X.restore();
  X.restore();
  X = MX;
}
function blend(kind, p, A, B) {
  // A = the outgoing shot, B = the incoming one, p 0..1
  const q = E.io(p);
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0);
  if (kind === 'zoom') {
    X.globalAlpha = 1; const za = 1 + q * .35; X.translate(W / 2, H / 2); X.scale(za, za); X.translate(-W / 2, -H / 2);
    X.filter = `blur(${q * 18}px)`; X.drawImage(A.canvas, 0, 0); X.setTransform(1, 0, 0, 1, 0, 0); X.filter = 'none';
    const zb = .82 + .18 * E.o3(p); X.globalAlpha = E.o3(p); X.translate(W / 2, H / 2); X.scale(zb, zb); X.translate(-W / 2, -H / 2);
    X.filter = `blur(${(1 - p) * 14}px)`; X.drawImage(B.canvas, 0, 0); X.filter = 'none';
  } else if (kind === 'slide') {
    const dx = W * q; X.filter = `blur(${Math.sin(p * Math.PI) * 10}px)`;
    X.drawImage(A.canvas, -dx * .35, 0); X.globalAlpha = 1; X.drawImage(B.canvas, W - dx, 0); X.filter = 'none';
    X.fillStyle = specFill(W - dx - 4, 0, W - dx + 4, H, NOW); X.globalAlpha = Math.sin(p * Math.PI); X.fillRect(W - dx - 3, 0, 6, H);
  } else if (kind === 'iris') {
    X.drawImage(A.canvas, 0, 0);
    const r = Math.hypot(W, H) * .55 * E.io(p);
    X.save(); X.beginPath(); X.arc(W / 2, H * .45, r, 0, 7); X.clip(); X.drawImage(B.canvas, 0, 0); X.restore();
    const g = X.createConicGradient(NOW, W / 2, H * .45); SPEC.forEach((c, i) => g.addColorStop(i / 6, c)); g.addColorStop(1, SPEC[0]);
    X.lineWidth = 10; X.strokeStyle = g; X.globalAlpha = Math.sin(p * Math.PI); X.shadowColor = '#fff'; X.shadowBlur = 30;
    X.beginPath(); X.arc(W / 2, H * .45, r, 0, 7); X.stroke();

    X.drawImage(A.canvas, 0, 0); X.globalAlpha = q; X.drawImage(B.canvas, 0, 0);
  } else if (kind === 'scan') {
    // a light bar sweeps top to bottom; the next shot is behind it
    const y = mix(-120, H + 120, q);
    X.drawImage(A.canvas, 0, 0);
    X.save(); X.beginPath(); X.rect(0, 0, W, y); X.clip(); X.drawImage(B.canvas, 0, 0); X.restore();
    const g = X.createLinearGradient(0, y - 90, 0, y + 30); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.85, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    X.globalCompositeOperation = 'screen'; X.fillStyle = g; X.fillRect(0, y - 90, W, 120);
    X.fillStyle = specFill(0, y, W, y, NOW); X.globalAlpha = .9; X.fillRect(0, y - 2, W, 4);
  } else {
    X.drawImage(B.canvas, 0, 0);
  }
  X.restore();
}

/* --------------------------------------------------------------- the frame -- */
function edgeAlpha(t) {
  const spans = CFG.edge || [[0, 1.2], [CFG.end ? CFG.end.at : END - 2.6, END]];
  let a = 0;
  for (const [a0, a1] of spans) a = Math.max(a, win(t, a0, a1, .15, .45));
  return a;
}
function frame(t) {
  NOW = t;
  X = MX; X.setTransform(1, 0, 0, 1, 0, 0);
  const i = SH.findIndex((s, k) => t >= s.at && (k === SH.length - 1 || t < SH[k + 1].at));
  if (i < 0) { bgDraw(t); }
  else {
    const sh = SH[i], d = sh.d || .42, kind = sh.tr || TR_FAMILY[CFG.look.tr % TR_FAMILY.length];
    const into = t - sh.at;
    if (i > 0 && kind !== 'cut' && into < d) {
      drawShot(OFF[0], SH[i - 1], t);
      drawShot(OFF[1], sh, t);
      X = MX; X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, W, H);
      blend(kind, into / d, OFF[0], OFF[1]);
    } else {
      drawShot(MX, sh, t);
    }
  }
  X = MX; X.setTransform(1, 0, 0, 1, 0, 0);

  brand(t); chapterChip(t); gapChip(t); captions(t); ctaCard(t); endCard(t); progressLine(t);
  EDGE(edgeAlpha(t), t);

}
function timeline() {
  const shots = SH.map((s, k) => ({at: s.at, name: s.name, tr: k === 0 ? 'cut' : (s.tr || TR_FAMILY[CFG.look.tr % TR_FAMILY.length])}));
  const marks = [...SH.map(s => s.at), ...BEATS.map(b => b.t), END].sort((a, b) => a - b);
  let longest = 0, where = 0;
  for (let k = 1; k < marks.length; k++) if (marks[k] - marks[k - 1] > longest) { longest = marks[k] - marks[k - 1]; where = marks[k - 1]; }
  return {end: END, size: D.size || 'reel', shots, beats: BEATS, longest, longest_at: where, mood: CFG.look.mood,
          gap: CFG.gap, cta: CFG.cta, endcard: CFG.end, pillar: CFG.pillar,
          lines: D.lines.map(l => ({n: l.n, s: l.s, e: l.e}))};
}

/* ----------------------------------------------------------------- loading -- */
async function boot() {
  const faces = [];

    const [fam, wgt] = key.split(':');
    faces.push(new FontFace(fam, `url(data:font/ttf;base64,${b64})`, {weight: wgt}));
  }
  for (const f of faces) { await f.load(); document.fonts.add(f); }
  await document.fonts.ready;
  const load = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  for (const [k, v] of Object.entries(IMG_SRC)) IM[k] = await load(v);
  if (LOGO_SRC) LOGO = await load(LOGO_SRC);
  if (LOGOR_SRC) LOGOR = await load(LOGOR_SRC);
  grainInit();
  END = (D.dur || (D.lines.length ? D.lines[D.lines.length - 1].e : 10)) + CFG.tail;
  if (CFG.endAt) END = CFG.endAt;
  if (!CFG.end && CFG.endCard) CFG.end = {at: END - CFG.tail};
  window.END = END;
  window.READY = true;
}

boot().catch(e => { window.BOOT_ERROR = String(e); console.error(e); });
