<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000928}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
/* ipoxxo reel stage (KIT/motion/stage.html; owner 2026-11-17: edutainment reels, ipoxxo the sponsor).
   motion/reel.py fills the five slots and puts the day's motion/scenes.js at the end. Every frame is a pure
   function of time: frame(t) draws it and returns a JPEG data URL.

   THE DAY'S SCENES (motion/scenes.js) USE THIS API — write parameters and shots, not a new engine:
   CONFIG({...})                 the reel's settings (below)
   SHOT(at, (s, t) => {...}, {tr, d, caps, name})
                                 a shot from `at` (s) until the next shot; s = time inside the shot (may be
                                 a little negative while a transition brings it in), t = the reel's time.
                                 tr: the transition INTO this shot ('cut','whip','wipe','zoom','flash','stream',
                                 'match','glitch'; default = the look's family); d: its length (0.36 s);
                                 caps:false hides the captions under this shot (a big headline says it all).
   BEAT(t, 'what')               an interrupt inside a shot (a counter lands, a punch-in, a new layer): the QC
                                 measures the longest stretch without a shot change or a BEAT (must be <= 4 s).
   Words:  LN(i) line i (0-based) {s, e, words:[{w,s,e}]}; WD(i, j) word j (-1 = last); WF(i, 'frag') the
           first word of line i that contains frag; END the reel's end.
   Time:   pr(t, a, b) 0..1; E.o3 / E.io / E.back / E.expo / E.in2 easings; win(t, a, b, fi, fo) a window's
           alpha; osc(t, f, a) a sine.
   Draw:   plate(name, cam) a still covering the frame; cam = {z, x, y, r, ax, ay, alpha}; CAM(s, dur, kind, amt)
           gives a camera ('push','pull','panL','panR','up','down','orbit','drift','punch'), always with a micro drift.
           img(name, x, y, w, {alpha, r, sh}) a still (a cut-out PNG keeps its alpha) centred at x, y, w wide.
           disc(name, x, y, r, {alpha, ring}) a still in a circle (a microscope, a lens).
           T(str, x, y, px, {f:'YB'|'YR'|'LB'|'LR', col, al, alpha, glow, stroke, shadow}) one line of text
           (YB/YR Persian with Persian digits, LB/LR Latin); RICH(parts, x, y, px, {al}) one line in pieces
           [{s, col, f}]; HEAD(t, at, str, x, y, px, {keys, col, f, stagger}) a kinetic headline, word by word.
           fa(n, dec, group) Persian digits with «٬» (group false: a year); count(t, a, b, from, to) an eased number.
           pill(x, y, w, h, {fill, line, lw, r}); chip(str, x, y, px, {fill, col, line}); ring(x, y, r, p, {col, lw});
           xmark / check(x, y, size, p, col); arrow(x1, y1, x2, y2, p, col, lw); gauge(x, y, h, v, max, {ticks, unit});
           vign(a); sweep(t, at, dur) a light sweep; glowLine(x1, y1, x2, y2, col, lw, glow).
   Colours: NAVY #000928, CYAN #04F6FF, WHITE #F5FBFF, BLUE #1498ED, ACC (the look's support accent).

   CONFIG keys: look {tr: 0..6, cam: 0..5, accent: 0..4, mood: 0..3, grade: {col, a}} (DIRECTION §5);
   badgeIn (s, default 1.9): the sponsor badge comes in after the hook; gap {at, close, q, a}: the open
   question chip (from `at` to the payoff `close`, then it flips to the answer `a`); sponsorLine: the index of
   the sponsor line (the badge turns into the sponsor card on its first word; the end card follows);
   caps {i: {text, keys}}: the on-screen words of line i (digits as digits) and the words in cyan;
   capY / capPx / capWords: where and how big the captions are; noCaps [i…]; tail: seconds after the last word.
   The stage draws by itself, on top of the shots: the grade, the captions, the gap chip, the badge, the
   sponsor card and the end card (the page's mark: the round logo, «ipoxxo», «t.me/ipoxxo»). */
const D = /*DATA*/;
const IMG_SRC = /*IMAGES*/;
const FONTS = /*FONTS*/;
const LOGO_SRC = /*LOGO*/;
const W = 1080, H = 1920;
const MAIN = document.getElementById('c');
const MX = MAIN.getContext('2d');
let X = MX;
const OFF = [0, 1].map(() => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); });
const NAVY = '#000928', CYAN = '#04F6FF', WHITE = '#F5FBFF', BLUE = '#1498ED';
const ACCENTS = ['#1498ED', '#8B7CF6', '#2EF2B5', '#FF4FD8', '#FFB547'];
const TR_FAMILY = ['whip', 'wipe', 'zoom', 'flash', 'stream', 'match', 'glitch'];
const CFG = {look: {tr: 2, cam: 0, accent: 0, mood: 0, grade: null}, badgeIn: 1.9, gap: null, sponsorLine: null,
             caps: {}, capY: 1310, capPx: 74, capWords: 3, noCaps: [], tail: 2.4};
let ACC = ACCENTS[0];
const SH = [], BEATS = [];
const IM = {};
let LOGO = null, END = 0;

/* ---------------------------------------------------------------- the scenes' API -- */
function CONFIG(o) { Object.assign(CFG, o); if (o.look) CFG.look = Object.assign({tr: 2, cam: 0, accent: 0, mood: 0}, o.look); ACC = ACCENTS[(CFG.look.accent || 0) % 5]; }
function SHOT(at, fn, o = {}) { SH.push({at, fn, tr: o.tr, d: o.d, caps: o.caps !== false, name: o.name || ''}); SH.sort((a, b) => a.at - b.at); }
function BEAT(t, what = '') { BEATS.push({t, what}); }
function LN(i) { return D.lines[i]; }
function WD(i, j) { const w = D.lines[i].words; return w[j < 0 ? w.length + j : j]; }
function WF(i, frag) { const w = D.lines[i].words.find(x => x.w.includes(frag)); if (!w) throw new Error(`WF(${i}, ${frag}): no such word`); return w; }

const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, p) => a + (b - a) * p;
const pr = (t, a, b) => cl((t - a) / Math.max(1e-6, b - a));
const E = {
  o3: p => 1 - Math.pow(1 - p, 3), in2: p => p * p, io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  expo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
};
const win = (t, a, b, fi = .25, fo = .25) => Math.min(pr(t, a, a + fi), 1 - pr(t, b - fo, b));
const osc = (t, f, a) => Math.sin(t * f * Math.PI * 2) * a;
function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
const FA = '۰۱۲۳۴۵۶۷۸۹';
function fa(n, dec = 0, group = true) { // Persian digits; group: «٬» every three digits (false for a year)
  const neg = n < 0; n = Math.abs(n);
  let [a, b] = n.toFixed(dec).split('.');
  if (group) a = a.replace(/\B(?=(\d{3})+(?!\d))/g, '٬');
  const s = (neg ? '-' : '') + a + (b ? '٫' + b : '');
  return s.replace(/\d/g, d => FA[+d]);
}
function count(t, a, b, from, to) { return mix(from, to, E.o3(pr(t, a, b))); }

/* ------------------------------------------------------------------ the camera -- */
function CAM(s, dur, kind = 'push', amt = 1) {
  const p = E.io(pr(s, 0, Math.max(.1, dur)));
  const c = {z: 1.1, x: 0, y: 0, r: 0};
  if (kind === 'push') c.z = 1.04 + .14 * amt * p;
  else if (kind === 'pull') c.z = 1.18 - .14 * amt * p;
  else if (kind === 'panL') { c.z = 1.14; c.x = 70 * amt * (1 - 2 * p); }
  else if (kind === 'panR') { c.z = 1.14; c.x = -70 * amt * (1 - 2 * p); }
  else if (kind === 'up') { c.z = 1.14; c.y = 90 * amt * (1 - 2 * p); }
  else if (kind === 'down') { c.z = 1.14; c.y = -90 * amt * (1 - 2 * p); }
  else if (kind === 'orbit') { c.z = 1.12 + .05 * p; c.r = .035 * amt * (p - .5); c.x = 30 * amt * (p - .5); }
  else if (kind === 'punch') { const q = E.expo(pr(s, 0, .35)); c.z = 1.22 - .1 * q + .04 * amt * p; }
  // the micro drift: never a static frame
  c.x += osc(s, .23, 5) + osc(s, .51, 3); c.y += osc(s + 1.3, .19, 4) + osc(s, .43, 2.5); c.r += osc(s + .7, .11, .002);
  return c;
}
function plate(name, c = {}) {
  const im = IM[name]; if (!im) { T('missing ' + name, 540, 960, 40, {f: 'LB', col: '#f55'}); return; }
  const z = c.z ?? 1, os = 1 + Math.abs(c.r || 0) * 2.2, k = Math.max(W / im.width, H / im.height) * z * os, w = im.width * k, h = im.height * k;
  let ox = W / 2 - w * (c.ax ?? .5) + (c.x || 0), oy = H / 2 - h * (c.ay ?? .5) + (c.y || 0);
  if (c.clamp !== false) { // the image keeps covering the (slightly rotated) frame
    ox = cl(ox, W - w + (os - 1) * W / 2, -(os - 1) * W / 2); oy = cl(oy, H - h + (os - 1) * H / 2, -(os - 1) * H / 2); }
  X.save(); if (c.alpha != null) X.globalAlpha *= c.alpha;
  if (c.r) { X.translate(W / 2, H / 2); X.rotate(c.r); X.translate(-W / 2, -H / 2); }
  X.imageSmoothingQuality = 'high'; X.drawImage(im, ox, oy, w, h); X.restore();
}
function img(name, x, y, w, o = {}) {
  const im = IM[name]; if (!im) return; const h = w * im.height / im.width;
  X.save(); if (o.alpha != null) X.globalAlpha *= o.alpha; X.translate(x, y); if (o.r) X.rotate(o.r);
  if (o.sh) { X.shadowColor = o.shCol || 'rgba(0,4,20,.8)'; X.shadowBlur = o.sh; X.shadowOffsetY = o.sh / 3; }
  X.imageSmoothingQuality = 'high'; X.drawImage(im, -w / 2, -h * (o.ay ?? .5), w, h); X.restore();
}
function disc(name, x, y, r, o = {}) {
  const im = IM[name]; if (!im) return; const z = o.z ?? 1;
  const k = Math.max(2 * r / im.width, 2 * r / im.height) * z, w = im.width * k, h = im.height * k;
  X.save(); if (o.alpha != null) X.globalAlpha *= o.alpha;
  X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); X.clip();
  X.imageSmoothingQuality = 'high'; X.drawImage(im, x - w * (o.ax ?? .5) + (o.dx || 0), y - h * (o.ay ?? .5) + (o.dy || 0), w, h); X.restore();
  if (o.ring) { X.save(); if (o.alpha != null) X.globalAlpha *= o.alpha; X.strokeStyle = o.ring; X.lineWidth = o.lw || 6; X.shadowColor = o.ring; X.shadowBlur = 24; X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); X.stroke(); X.restore(); }
}

/* -------------------------------------------------------------------- the text -- */
const fnt = (px, f) => `${px}px ${f}`;
const SPC = px => px * .3;
function TW(s, px, f = 'YB') { X.save(); X.font = fnt(px, f); X.direction = f[0] === 'L' ? 'ltr' : 'rtl'; const w = X.measureText(s).width; X.restore(); return w; }
function T(s, x, y, px, o = {}) {
  const f = o.f || 'YB'; X.save(); X.font = fnt(px, f); X.textAlign = o.al || 'center'; X.textBaseline = 'middle';
  X.direction = o.dir || (f[0] === 'L' ? 'ltr' : 'rtl'); if (o.alpha != null) X.globalAlpha *= o.alpha;
  const yy = y + px * .06;
  if (o.stroke) { X.lineJoin = 'round'; X.lineWidth = o.stroke; X.strokeStyle = o.strokeCol || 'rgba(0,9,40,.92)'; if (o.shadow) { X.shadowColor = 'rgba(0,4,20,.85)'; X.shadowBlur = o.shadow; } X.strokeText(s, x, yy); X.shadowBlur = 0; }
  else if (o.shadow) { X.shadowColor = 'rgba(0,4,20,.85)'; X.shadowBlur = o.shadow; X.shadowOffsetY = o.shadow / 5; }
  if (o.glow) { X.shadowColor = o.glowCol || CYAN; X.shadowBlur = o.glow; X.shadowOffsetY = 0; }
  X.fillStyle = o.col || WHITE; X.fillText(s, x, yy); X.restore();
}
function RICH(parts, x, y, px, o = {}) { // one line in pieces, laid out right to left (Persian order)
  const sp = SPC(px); const ws = parts.map(p => TW(p.s, p.px || px, p.f || 'YB'));
  const tot = ws.reduce((a, b) => a + b, 0) + sp * (parts.length - 1) * (o.space ?? 1);
  let cur = o.al === 'right' ? x : o.al === 'left' ? x + tot : x + tot / 2;
  parts.forEach((p, i) => { T(p.s, cur, y, p.px || px, {...o, ...p, al: 'right'}); cur -= ws[i] + sp * (o.space ?? 1); });
  return tot;
}
function HEAD(t, at, str, x, y, px, o = {}) { // a kinetic headline: its words rise in, one after another
  const words = str.split(' '); const keys = o.keys || []; const f = o.f || 'YB'; const st = o.stagger ?? .07;
  const sp = SPC(px); const ws = words.map(w => TW(w, px, f)); const tot = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cur = (o.al === 'right' ? x : x + tot / 2);
  words.forEach((w, i) => {
    const p = E.back(pr(t, at + i * st, at + i * st + .38)); const a = pr(t, at + i * st, at + i * st + .16);
    if (a > 0) T(w, cur - ws[i] / 2, y + (1 - p) * px * .55, px, {f, al: 'center', col: keys.some(k => w.includes(k)) ? (o.keyCol || CYAN) : (o.col || WHITE),
      alpha: a * (o.alpha ?? 1), stroke: o.stroke, shadow: o.shadow ?? 18, glow: o.glow});
    cur -= ws[i] + sp;
  });
}

/* ---------------------------------------------------------------- the graphics -- */
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); }
function pill(x, y, w, h, o = {}) { // centred at x, y
  X.save(); if (o.alpha != null) X.globalAlpha *= o.alpha; rr(x - w / 2, y - h / 2, w, h, o.r ?? h / 2);
  if (o.fill !== null) { X.fillStyle = o.fill || 'rgba(0,9,40,.78)'; X.fill(); }
  if (o.line) { X.strokeStyle = o.line; X.lineWidth = o.lw || 2; if (o.glow) { X.shadowColor = o.line; X.shadowBlur = o.glow; } X.stroke(); }
  X.restore();
}
function chip(s, x, y, px, o = {}) { const w = TW(s, px, o.f || 'YB') + px * 1.2; pill(x, y, w, px * 1.7, {fill: o.fill, line: o.line, lw: o.lw, alpha: o.alpha, glow: o.glow}); T(s, x, y, px, {f: o.f || 'YB', col: o.col || WHITE, alpha: o.alpha}); return w; }
function ring(x, y, r, p, o = {}) { if (p <= 0) return; X.save(); if (o.alpha != null) X.globalAlpha *= o.alpha; X.strokeStyle = o.col || CYAN; X.lineWidth = o.lw || 6; X.lineCap = 'round'; X.shadowColor = o.col || CYAN; X.shadowBlur = o.glow ?? 20; X.beginPath(); X.arc(x, y, r, (o.a0 ?? -Math.PI / 2), (o.a0 ?? -Math.PI / 2) + Math.PI * 2 * cl(p)); X.stroke(); X.restore(); }
function glowLine(x1, y1, x2, y2, col = CYAN, lw = 4, glow = 18, alpha = 1) { X.save(); X.globalAlpha *= alpha; X.strokeStyle = col; X.lineWidth = lw; X.lineCap = 'round'; X.shadowColor = col; X.shadowBlur = glow; X.beginPath(); X.moveTo(x1, y1); X.lineTo(x2, y2); X.stroke(); X.restore(); }
function xmark(x, y, s, p, col = '#FF5470', lw = 16) { if (p <= 0) return; const a = E.o3(pr(p, 0, .5)), b = E.o3(pr(p, .5, 1)); glowLine(x - s / 2, y - s / 2, x - s / 2 + s * a, y - s / 2 + s * a, col, lw, 22); if (b > 0) glowLine(x + s / 2, y - s / 2, x + s / 2 - s * b, y - s / 2 + s * b, col, lw, 22); }
function check(x, y, s, p, col = CYAN, lw = 16) { if (p <= 0) return; const a = E.o3(pr(p, 0, .4)), b = E.o3(pr(p, .4, 1)); glowLine(x - s * .45, y, x - s * .45 + s * .3 * a, y + s * .3 * a, col, lw, 22); if (b > 0) glowLine(x - s * .15, y + s * .3, x - s * .15 + s * .6 * b, y + s * .3 - s * .65 * b, col, lw, 22); }
function arrow(x1, y1, x2, y2, p, col = CYAN, lw = 8) {
  if (p <= 0) return; const q = E.o3(cl(p)); const x = mix(x1, x2, q), y = mix(y1, y2, q); glowLine(x1, y1, x, y, col, lw, 16);
  const ang = Math.atan2(y2 - y1, x2 - x1), hl = lw * 3.2; X.save(); X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 16; X.beginPath();
  X.moveTo(x + Math.cos(ang) * hl * .6, y + Math.sin(ang) * hl * .6); X.lineTo(x + Math.cos(ang + 2.5) * hl, y + Math.sin(ang + 2.5) * hl); X.lineTo(x + Math.cos(ang - 2.5) * hl, y + Math.sin(ang - 2.5) * hl); X.closePath(); X.fill(); X.restore();
}
function gauge(x, y, h, v, max, o = {}) { // a vertical gauge from y (top, 0) to y + h (max); v fills it
  const col = o.col || CYAN, n = o.ticks || 12; X.save(); if (o.alpha != null) X.globalAlpha *= o.alpha;
  X.strokeStyle = 'rgba(245,251,255,.35)'; X.lineWidth = 3; X.beginPath(); X.moveTo(x, y); X.lineTo(x, y + h); X.stroke();
  for (let k = 0; k <= n; k++) { const yy = y + h * k / n; X.beginPath(); X.moveTo(x - (k % 2 ? 10 : 18), yy); X.lineTo(x, yy); X.stroke(); if (o.label && k % (o.every || 2) === 0) T(fa(max * k / n), x - 30, yy, 26, {f: 'YR', al: 'right', col: 'rgba(245,251,255,.7)'}); }
  const vy = y + h * cl(v / max); glowLine(x, y, x, vy, col, 7, 18);
  X.fillStyle = col; X.shadowColor = col; X.shadowBlur = 22; X.beginPath(); X.arc(x, vy, 11, 0, Math.PI * 2); X.fill(); X.restore();
  return vy;
}
function vign(a = .5) { const g = X.createRadialGradient(540, 900, 420, 540, 960, 1250); g.addColorStop(0, 'rgba(0,9,40,0)'); g.addColorStop(1, `rgba(0,6,26,${a})`); X.fillStyle = g; X.fillRect(0, 0, W, H); }
function sweep(t, at, dur = .9, alpha = .22) { const p = pr(t, at, at + dur); if (p <= 0 || p >= 1) return; const x = mix(-400, W + 400, E.io(p)); X.save(); const g = X.createLinearGradient(x - 220, 0, x + 220, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, `rgba(220,252,255,${alpha})`); g.addColorStop(1, 'rgba(255,255,255,0)'); X.globalCompositeOperation = 'screen'; X.translate(0, 0); X.fillStyle = g; X.fillRect(0, 0, W, H); X.restore(); }
function shade(top = .0, bottom = .55) { const g = X.createLinearGradient(0, 0, 0, H); g.addColorStop(0, `rgba(0,9,40,${top})`); g.addColorStop(.55, 'rgba(0,9,40,0)'); g.addColorStop(1, `rgba(0,9,40,${bottom})`); X.fillStyle = g; X.fillRect(0, 0, W, H); }

/* ------------------------------------------------------------- the transitions -- */
function drawShot(k, t, ctx) {
  const prev = X; X = ctx; X.save(); X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  X.fillStyle = NAVY; X.fillRect(0, 0, W, H);
  try { SH[k].fn(t - SH[k].at, t); } finally { X.restore(); X = prev; }
}
function trans(a, b, p, t, kind) {
  drawShot(a, t, OFF[0]); drawShot(b, t, OFF[1]);
  const A = OFF[0].canvas, B = OFF[1].canvas; X.save();
  const flash = (amt, col = '220,252,255') => { if (amt > 0) { X.fillStyle = `rgba(${col},${amt})`; X.fillRect(0, 0, W, H); } };
  if (kind === 'whip') {
    const e = E.io(p), dx = W * e;
    for (const [img, base] of [[A, -dx], [B, W - dx]]) for (let k = 0; k < 5; k++) { X.globalAlpha = k ? .16 : 1; X.drawImage(img, base + (k - 2) * 26 * Math.sin(Math.PI * p), 0); }
  } else if (kind === 'wipe') {
    X.drawImage(A, 0, 0); const r = 1400 * E.io(p); X.save(); X.beginPath(); X.arc(540, 960, r, 0, Math.PI * 2); X.clip(); X.drawImage(B, 0, 0); X.restore();
    if (p > 0 && p < 1) { X.strokeStyle = CYAN; X.lineWidth = 8; X.shadowColor = CYAN; X.shadowBlur = 30; X.beginPath(); X.arc(540, 960, r, 0, Math.PI * 2); X.stroke(); }
  } else if (kind === 'zoom') {
    const za = 1 + .6 * E.in2(pr(p, 0, .6)), aa = 1 - pr(p, .35, .62), zb = 1.28 - .28 * E.o3(pr(p, .38, 1)), ab = pr(p, .38, .66);
    X.globalAlpha = 1; X.drawImage(B, 540 - 540 * zb, 960 - 960 * zb, W * zb, H * zb);
    X.globalAlpha = aa; X.drawImage(A, 540 - 540 * za, 960 - 960 * za, W * za, H * za);
    X.globalAlpha = 1; if (ab < 1) { X.globalAlpha = ab; X.drawImage(B, 540 - 540 * zb, 960 - 960 * zb, W * zb, H * zb); X.globalAlpha = 1; }
    flash(.28 * Math.pow(1 - Math.abs(p - .5) * 2, 2));
  } else if (kind === 'flash') {
    X.drawImage(p < .5 ? A : B, 0, 0); flash(.85 * Math.pow(1 - Math.abs(p - .5) * 2, 2.2));
  } else if (kind === 'stream') {
    X.drawImage(A, 0, 0); const n = 16;
    for (let k = 0; k < n; k++) { const q = E.io(pr(p, k / n * .45, .55 + k / n * .45)); if (q <= 0) continue; const y0 = H * k / n, hh = H / n; const w = W * q;
      X.save(); X.beginPath(); X.rect(k % 2 ? 0 : W - w, y0, w, hh + 1); X.clip(); X.drawImage(B, 0, 0); X.restore();
