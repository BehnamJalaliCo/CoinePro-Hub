# The owner's clients (apps/web, apps/android), owned by the consultation session: typecheck, lint, build and an
# end-to-end smoke of the web; unit tests, a screenshot comparison against the recorded images and both APKs for
# Android. On the working branch the APKs are published to the rolling prerelease "android-latest" so the owner can
# install them from GitHub. Each client's jobs run only when that client's files changed in the push, to keep within
# the account's Actions minutes.
name: clients

on:
  push:
    paths:
      - "apps/web/**"
      - "apps/android/**"
      - "apps/VERSION"
      - "apps/api/openapi/**"
      - "design/**"
      - ".github/workflows/clients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which client changed in this push (the compare API; no checkout). A new branch, a manual run or a compare that
  # cannot be read runs everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.diff.outputs.web }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          all() { { echo "web=true"; echo "android=true"; } >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$GITHUB_EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] || all
          files=$(gh api "repos/$GH_REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename') || all
          [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ] || all
          has() { if printf '%s\n' "$files" | grep -qE "$1"; then echo true; else echo false; fi; }
          echo "web=$(has '^(apps/web/|apps/api/openapi/|design/|\.github/workflows/clients\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "android=$(has '^(apps/android/|apps/VERSION$|design/|\.github/workflows/clients\.yml$)')" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    container: node:22.22.0-trixie-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # Every page of the demo holding renders without errors and the owner's main actions work end to end.
  web-e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npm run test:e2e

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # publish the android-latest prerelease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generated design assets are current
        run: python3 apps/android/scripts/gen_assets.py --check

      - name: One version for both apps (apps/VERSION and the web's package.json)
        run: test "$(cat apps/VERSION)" = "$(python3 -c 'import json; print(json.load(open("apps/web/package.json"))["version"])')"

      # Optional: the owner's signing key (repository secrets). Without it the release APK is signed with
      # the runner's throwaway debug key and passkeys cannot work with it.
      - name: Owner signing key
        env:
          KEYSTORE_B64: ${{ secrets.HQ_SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hq.jks"
            echo "HQ_SIGNING_STORE_FILE=$RUNNER_TEMP/hq.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        working-directory: apps/android
        env:
          HQ_SIGNING_STORE_PASSWORD: ${{ secrets.HQ_SIGNING_STORE_PASSWORD }}
          HQ_SIGNING_KEY_ALIAS: ${{ secrets.HQ_SIGNING_KEY_ALIAS }}
          HQ_SIGNING_KEY_PASSWORD: ${{ secrets.HQ_SIGNING_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon --console=plain verifyRoborazziDebug assembleDebug assembleRelease

      - name: Publish android-latest
        if: github.ref_name == 'claude/coinepro-hub-setup-hsvnw7' || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=apps/android/app/build/outputs/apk
          cp "$out/debug/app-debug.apk" coinepro-hq-debug.apk
          cp "$out/release/app-release.apk" coinepro-hq.apk
          v="$(cat apps/VERSION)"
          cp coinepro-hq.apk "coinepro-hq-$v.apk"
          notes="Version $v, commit ${GITHUB_SHA::7} (apps/CHANGELOG.md). coinepro-hq.apk: the app (passkey sign-in)."
          notes="$notes coinepro-hq-debug.apk: development build with the demo holding."
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --title "Android $v" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release edit android-latest --title "Android $v" --notes "$notes"
          gh release upload android-latest coinepro-hq.apk "coinepro-hq-$v.apk" coinepro-hq-debug.apk --clobber
