# Nightly: the same gates as `make check`, with deeper fuzzing of the API
# (Schemathesis examples per operation) than on every push.
name: nightly

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HQ_FUZZ_EXAMPLES: "40"
    steps:
      - name: Checkout (full history for gitleaks)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: make check (deep fuzzing)
        run: make check
