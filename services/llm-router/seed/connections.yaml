# Connections. Prices: USD per 1M tokens, copied from Anthropic's official
# pricing page (source_url, as_of on every model; owner decision, prompt 04 §9;
# re-checked 2026-10-17: Sonnet 5.5 cache reads are $0.10, i.e. 0.05x input).
# cache_write = 5-minute writes, cache_write_1h = 1-hour writes. Claude Haiku
# 5.5 is priced by prompt length: above 100,000 prompt tokens (input + cache
# read + cache write) every rate of `long_prompt` applies.
# All API connections start disabled and without keys (prompt 03 §5); keys go
# into OpenBao at secret_ref later.
x-anthropic-models: &anthropic_models
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5
  - claude-fable-5-1
x-anthropic-pricing: &anthropic_pricing
  claude-fable-5-1:
    {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50, cache_write_1h: 20.00,
     source_url: "https://platform.claude.com/docs/en/about-claude/pricing", as_of: "2026-10-17"}
  claude-opus-5-5:
    {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00, cache_write_1h: 8.00,
     source_url: "https://platform.claude.com/docs/en/about-claude/pricing", as_of: "2026-10-17"}
  claude-sonnet-5-5:
    {input: 2.00, output: 10.00, cache_read: 0.10, cache_write: 2.50, cache_write_1h: 4.00,
     source_url: "https://platform.claude.com/docs/en/about-claude/pricing", as_of: "2026-10-17"}
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
    cache_write_1h: 0.20
    long_prompt:
      {above_prompt_tokens: 100000, input: 0.50, output: 2.50, cache_read: 0.05,
       cache_write: 0.625, cache_write_1h: 1.00}
    source_url: "https://platform.claude.com/docs/en/about-claude/pricing"
    as_of: "2026-10-17"

connections:
  - key: claude-max
    kind: claude_subscription
    provider: anthropic
    display_name: Claude subscription (main account)
    status: enabled
    secret_ref: kv/claude-runtime/oauth
    models: *anthropic_models
    default_model: claude-sonnet-5-5
    pricing: *anthropic_pricing
    limits: {}

  # ⟨2026-11-09⟩ the owner's second subscription (its token: `make claude-token SLOT=2`). Off until
  # the token is in OpenBao; then the main account's quota running out moves calls here, and the
  # company servers' Claude Code sessions run on it (contract §26).
  - key: claude-max-2
    kind: claude_subscription
    provider: anthropic
    display_name: Claude subscription (second account)
    status: disabled
    secret_ref: kv/claude-runtime/oauth-2
    models: *anthropic_models
    default_model: claude-sonnet-5-5
    pricing: *anthropic_pricing
    limits: {}
    # 1, not 0: llm.connections CHECK (fallback_priority > 0) refused 0 (prompt 29 deploy). The twin
    # subscription is picked by its kind, so the number only has to be non-null.
    fallback_priority: 1

  - key: anthropic-api
    kind: api
    provider: anthropic
    display_name: Anthropic API
    status: disabled
    secret_ref: kv/llm-connections/anthropic-api
    models: *anthropic_models
    default_model: claude-sonnet-5-5
    pricing: *anthropic_pricing
    limits: {monthly_usd: 0}
    fallback_priority: 1

  - key: openai
    kind: api
    provider: openai
    display_name: OpenAI API
    status: disabled
    secret_ref: kv/llm-connections/openai
    models: []
    pricing: {}
    limits: {monthly_usd: 0}
    fallback_priority: 2

  - key: google-gemini
    kind: api
    provider: gemini
    display_name: Google Gemini API
    status: disabled
    secret_ref: kv/llm-connections/google-gemini
    models: []
    pricing: {}
    limits: {monthly_usd: 0}
    fallback_priority: 3

  - key: openai-compatible
    kind: api
    provider: openai_compatible
    display_name: OpenAI-compatible provider (set api_base)
    status: disabled
    secret_ref: kv/llm-connections/openai-compatible
    models: []
    pricing: {}
    limits: {monthly_usd: 0}
    fallback_priority: 4
