# Connections. Prices: USD per 1M tokens (Anthropic first-party list prices,
# 2026-10; cache_write = 1.25x input for 5-minute writes; Haiku 5.5 cache_read
# is not published separately and uses the usual 0.1x of input).
# All API connections start disabled and without keys (prompt 03 §5); keys go
# into OpenBao at secret_ref later.
x-anthropic-models: &anthropic_models
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5
  - claude-fable-5-1
x-anthropic-pricing: &anthropic_pricing
  claude-fable-5-1: {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}

connections:
  - key: claude-max
    kind: claude_subscription
    provider: anthropic
    display_name: Claude subscription (main account)
    status: enabled
    secret_ref: kv/claude-runtime/oauth
    models: *anthropic_models
    default_model: claude-sonnet-5-5
    pricing: *anthropic_pricing
    limits: {}

  - key: anthropic-api
    kind: api
    provider: anthropic
    display_name: Anthropic API
    status: disabled
    secret_ref: kv/llm-connections/anthropic-api
    models: *anthropic_models
    default_model: claude-sonnet-5-5
    pricing: *anthropic_pricing
    limits: {monthly_usd: 0}
    fallback_priority: 1

  - key: openai
    kind: api
    provider: openai
    display_name: OpenAI API
    status: disabled
    secret_ref: kv/llm-connections/openai
    models: []
    pricing: {}
    limits: {monthly_usd: 0}
    fallback_priority: 2

  - key: google-gemini
    kind: api
    provider: gemini
    display_name: Google Gemini API
    status: disabled
    secret_ref: kv/llm-connections/google-gemini
    models: []
    pricing: {}
    limits: {monthly_usd: 0}
    fallback_priority: 3

  - key: openai-compatible
    kind: api
    provider: openai_compatible
    display_name: OpenAI-compatible provider (set api_base)
    status: disabled
    secret_ref: kv/llm-connections/openai-compatible
    models: []
    pricing: {}
    limits: {monthly_usd: 0}
    fallback_priority: 4
