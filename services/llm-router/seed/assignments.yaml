# Default assignments. holding = the company with kind "holding" (its code).
# The whole holding runs on the Claude subscription (OPERATING_MODEL §1.6);
# the general advisor stays on Opus 5.5 with effort xhigh (§1.1, §1.13).
assignments:
  - {scope_type: holding, scope_ref: HQ, connection: claude-max, model: claude-sonnet-5-5, effort: medium,
     note: Default for the whole holding}
  - {scope_type: role, scope_ref: advisor, model: claude-opus-5-5, effort: xhigh,
     note: General advisor (§1.1)}
  # The weekly review's brief: a few plain lines for the owner, not a study
  # (one brief cost 265K on Opus xhigh, 2026-11-05). The advisor's own
  # thinking stays on Opus.
  - {scope_type: task_class, scope_ref: advisor_review, model: claude-sonnet-5-5, effort: medium,
     note: Weekly review brief (owner 2026-11-06)}
  # A proactive note and a decision memo: a short text for the owner on facts
  # gathered by code (the technical triggers no longer reach the model).
  - {scope_type: task_class, scope_ref: advisor_proactive, model: claude-sonnet-5-5, effort: medium,
     note: Proactive note (owner 2026-11-06)}
  - {scope_type: task_class, scope_ref: advisor_memo, model: claude-sonnet-5-5, effort: medium,
     note: Decision memo (owner 2026-11-06)}
  # Contract §40 (2026-11-07): a session's memory folded every 20 turns and at
  # close is a small job for the cheapest model that does it well; the playbook
  # drafted by the session's holder is a strong-but-not-premium one.
  # ⟨2026-11-13⟩ Sonnet, not Haiku: on F-0018 Haiku ran past its output cap on every fold
  # (25-40 turns of a working session) and the memory stayed empty; Sonnet folds 25 turns in
  # ~10 s, ~1.5K tokens. A fresh direct session starts from this memory.
  - {scope_type: task_class, scope_ref: session_memory, model: claude-sonnet-5-5, effort: low,
     note: A session's memory folded (contract 40.1)}
  - {scope_type: task_class, scope_ref: playbook_draft, model: claude-sonnet-5-5, effort: medium,
     note: A playbook drafted from a session (contract 40.2)}
