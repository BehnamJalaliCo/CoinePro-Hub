  - {key: ask_hub, transferable: false, description: "The librarian's answer to ask the hub (prompt 12 §2)"}
  - {key: ceo_letter, transferable: false, description: "A CEO's weekly letter to the owner (prompt 12 §4.3)"}
  - {key: hr_eval, transferable: false, description: "The monthly HR evaluation (prompt 12 §6)"}
  - {key: dceo_predict, transferable: false, description: "The digital CEO's model prediction (prompt 12 §13)"}
