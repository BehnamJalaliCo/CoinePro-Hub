# Task classes. transferable = may run on an alternative provider when the
# Claude quota is exhausted (OPERATING_MODEL §1.6): low-risk, well-defined,
# checkable work only. Unknown task classes are rejected by the router.
task_classes:
  - {key: general, transferable: false, description: Default class when nothing more specific applies}
  - {key: advisor, transferable: false, description: General advisor (never on an alternative)}
  - {key: coding, transferable: false, description: Code and deploy work}
  - {key: decision, transferable: false, description: Decisions and resolutions}
  - {key: customer_message, transferable: false, description: Direct customer messages}
  - {key: ops_alert, transferable: false, description: Alert analysis and incident work}
  - {key: translate, transferable: true, description: Translation}
  - {key: summarize, transferable: true, description: Summaries}
  - {key: classify, transferable: true, description: Classification and tagging}
  - {key: extract, transferable: true, description: Structured extraction}
  - {key: draft, transferable: true, description: Drafts that are reviewed later}
  # prompt 6 §3: the light model's punctuation of the owner's own transcribed
  # voice (A0, P1); never on another provider (it is the owner's speech).
  - {key: stt_punctuation, transferable: false, description: Punctuation of a Persian voice transcript}
  # prompt 08 §7: the academy's golden evals (the role's answer, the judge's score)
  - {key: academy_eval, transferable: false, description: An academy eval case answered by the role under test}
  - {key: academy_judge, transferable: false, description: The judge's score of an academy eval answer}
  - {key: order_routing, transferable: false, description: "Where an order of the owner goes (prompt 06 §5; the owner's words stay on Claude)"}
  # prompt 12 (contract §21.0, §21.13): the owner zone (the advisor's memos,
  # proactive notes and weekly brief, the librarian, the digital CEO), the CEOs'
  # letters, the HR evaluation; never on an alternative provider. The sub_*
  # classes are the substitute players' calls (ChatGPT, Gemini, DeepSeek on the
  # owner's subscriptions), recorded at their equivalent cost; the router never
  # routes them (api migration 0027 inserts the same rows).
  - {key: advisor_memo, transferable: false, description: "The advisor's decision memo on a pending card (prompt 12 §1)"}
  - {key: advisor_proactive, transferable: false, description: "The advisor's proactive note on a rule trigger (prompt 12 §1.3)"}
  - {key: advisor_review, transferable: false, description: "The advisor's weekly review brief (prompt 12 §3)"}
  - {key: ask_hub, transferable: false, description: "The librarian's answer to ask the hub (prompt 12 §2)"}
  - {key: ceo_letter, transferable: false, description: "A CEO's weekly letter to the owner (prompt 12 §4.3)"}
  - {key: hr_eval, transferable: false, description: "The monthly HR evaluation (prompt 12 §6)"}
  - {key: dceo_predict, transferable: false, description: "The digital CEO's model prediction (prompt 12 §13)"}
  - {key: dceo_principles, transferable: false, description: "The digital CEO's weekly principles (prompt 12 §13)"}
  - {key: sub_code_review, transferable: false, description: "A substitute player's second code review (subscription only)"}
  - {key: sub_second_opinion, transferable: false, description: "A substitute player's second opinion on a memo (subscription only)"}
  - {key: sub_cross_check, transferable: false, description: "A substitute player's cross-check of sampled claims (subscription only)"}
  - {key: sub_errand, transferable: false, description: "A substitute player's errand draft (subscription only)"}
  - {key: sub_draft, transferable: false, description: "A substitute player's first draft of content (subscription only)"}
  - {key: sub_long_read, transferable: false, description: "A substitute player's summary of a long read (subscription only)"}
  - {key: sub_creative, transferable: false, description: "A substitute player's image or video (subscription only)"}
  # prompt 13 §3 (contract §22.0): the legal counsel's work and its reading of
  # a reply; never on an alternative provider (api migration 0028_1 inserts them).
  - {key: legal_case, transferable: false, description: "The legal counsel's work on a case (prompt 13 §3; never on an alternative)"}
  - {key: legal_email, transferable: false, description: "The legal counsel's reading of a reply and its next step (prompt 13 §3)"}
