# Tooling config for every Python service under services/ (not a package).
# Each service ships its own requirements.lock; tests use requirements-test.lock.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["hq-common/src", "llm-router/src", "claude-runtime/src", "gateway/src", "stt/src", "egress/src", "provisioner/src", "substitutes/src", "tts/src", "media-render/src"]
extend-exclude = ["llm-router/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF", "SIM", "PT", "C4", "PIE", "RET"]
ignore = [
    "S104",  # services bind 0.0.0.0 inside their container; never published
    "S101",  # asserts narrow types for mypy; images never run with -O
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106", "S108", "S311", "S603", "S608", "BLE001", "E501", "C408", "PT011", "PT012", "PT018", "PT022", "RUF001"]
# Persian and Arabic-Indic digits and the names of secrets are matched on purpose.
"hq-common/src/hq_common/redact.py" = ["RUF001", "E501", "S105"]
"*/testing/*" = ["S311"]
# Persian letters and affixes are the subject of the normaliser.
"hq-common/src/hq_common/persian.py" = ["RUF001", "RUF002", "RUF003"]
# Persian words and invisible spaces are what the egress rules look for.
"egress/src/hq_egress/rules.py" = ["RUF001"]
"egress/src/hq_egress/extract.py" = ["RUF001"]
# The steps' Persian titles (contract §18.8 ProvisionRun.steps.title_fa).
"provisioner/src/hq_provisioner/runner.py" = ["RUF001"]
"hq-common/src/hq_common/injection.py" = ["RUF001"]
# Persian punctuation that breaks lines for the voice; the bench's Persian text.
"tts/src/hq_tts/*.py" = ["RUF001"]
# The render bench's Persian fixtures and the overlay page's Persian sample.
"media-render/src/hq_media_render/*.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["hq_common", "llm_router", "claude_runtime", "hq_gateway", "hq_stt", "hq_egress", "hq_provisioner", "hq_substitutes", "hq_tts", "hq_media_render"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "hq-common/src:llm-router/src:claude-runtime/src:gateway/src:stt/src:egress/src:provisioner/src:substitutes/src:tts/src:media-render/src"
explicit_package_bases = true
cache_dir = "/tmp/mypy-cache"

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*", "nats", "nats.*", "asyncpg", "asyncpg.*", "prometheus_client.*", "faster_whisper", "faster_whisper.*", "lxml", "lxml.*", "playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
data_file = "/tmp/.coverage"
# Run in the browser image (Playwright + Chromium), not in the test image; their
# decisions (rules.py) are tested here, the browser itself by the egress smoke test.
# Likewise the render worker's Chromium and ffmpeg driver (prompt 13): its pure
# parts are tested here, a real render by `make media-bench` in its own image.
omit = ["*/hq_egress/browser.py", "*/hq_egress/browser_web.py", "*/hq_media_render/render.py",
        "*/hq_media_render/bench.py", "*/hq_media_render/probe.py", "*/hq_media_render/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
