<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The bench's design page (make media-bench): phone and desktop, full page. -->
<style>
body { margin: 0; font-family: IRANYekanX; background: #FFFFFF; color: #0E1116; }
header { background: #0E1116; color: #FFFFFF; padding: 24px 32px; font-weight: 700; font-size: 22px; }
main { max-width: 1100px; margin: 0 auto; padding: 32px; display: grid; gap: 24px;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.card { border: 2px solid #1D3557; border-radius: 16px; padding: 24px; min-height: 260px; }
.card h2 { margin: 0 0 12px; font-size: 24px; }
.cta { display: inline-block; margin-top: 16px; background: #F2B705; color: #0E1116; padding: 12px 24px;
  border-radius: 999px; font-weight: 700; }
.warn { background: #1D3557; color: #FFFFFF; padding: 24px 32px; font-size: 18px; }
</style></head>
<body><header>کوینه‌پرو · آموزش</header><main>
@CARDS@
</main><div class="warn">معامله‌ی رمزارز پرریسک است و ممکن است سرمایه از دست برود.</div></body></html>
