# CoinePro HQ — Valkey. Role: cache. Anything that must survive belongs in
# Postgres, NATS JetStream or Temporal, never only here.
# requirepass and maxmemory are injected on stdin at start-up from the
# environment (see compose.yaml), so no secret lives in this file.

bind * -::*
port 6379
protected-mode yes
dir /data

# Persistence: AOF on, fsync once per second.
appendonly yes
appendfsync everysec

# Cache semantics: when maxmemory is reached, evict the least recently used
# key of any kind instead of rejecting writes.
maxmemory-policy allkeys-lru
