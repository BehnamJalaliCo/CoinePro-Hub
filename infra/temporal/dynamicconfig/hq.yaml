# Temporal dynamic config (re-read every 60s).
# SQL visibility stores IDs in varchar(255).
limit.maxIDLength:
  - value: 255
    constraints: {}

# Bounded memory. History: the server reached its memory cap three times
# (2026-10-31 after 13 days, 11-07, 11-12 after 4 days) and then spent
# 300-680% CPU in garbage collection. Cause, measured on a bench and read in
# the 1.32.1 source (RUNBOOK, "Temporal memory"):
#   1. A cache entry past its TTL is only dropped when the SAME workflow is
#      asked for again. Closed workflows are never asked for again, so every
#      run of the last 72 h (the retention) stayed in memory. The background
#      purge of expired entries exists but is off by default.
#   2. The byte limits count far less than an entry really holds: about
#      0.8 KB counted for about 17 KB of heap per cached workflow, and 17x for
#      history events. "64 MiB + 32 MiB" was really more than 1 GiB.
# So: the purge is on, the workflow cache is limited by COUNT (an entry is
# about 17-25 KB of heap, so 4096 entries are about 100 MB at the very most),
# and the events cache, which has no purge, gets a small byte limit (4 MiB
# counted, about 70 MB of heap at the very most).
# Compose sets small SQL pools (SQL_MAX_CONNS 10, SQL_MAX_IDLE_CONNS 5) and
# GOMEMLIMIT (profiles/*.env). The persistence rate limits stay at their
# defaults: capping them (300 QPS) starved the 512 shards' start-up.
# The cache keys are read once, at start: a change needs a restart of temporal.
history.cacheSizeBasedLimit:
  - value: false
    constraints: {}
history.hostLevelCacheMaxSize:
  - value: 4096            # workflows; about 100 MB of heap when full
    constraints: {}
history.cacheTTL:
  - value: 30m
    constraints: {}
history.cacheBackgroundEvict:
  - value:
      Enabled: true        # drop expired entries without waiting for a second read
      LoopInterval: 1m
      MaxEntryPerCall: 1024
    constraints: {}
history.enableHostLevelEventsCache:
  - value: true
    constraints: {}
history.eventsHostLevelCacheMaxSizeBytes:
  - value: 4194304         # 4 MiB counted, host-wide (about 70 MB of heap at most)
    constraints: {}
history.eventsCacheMaxSizeBytes:
  - value: 262144          # 256 KiB per shard (the fallback if the host-level cache is off)
    constraints: {}
history.eventsCacheTTL:
  - value: 30m
    constraints: {}
