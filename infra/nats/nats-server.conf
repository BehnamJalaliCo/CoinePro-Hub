# CoinePro HQ — NATS with JetStream (single node).
server_name: hq-nats-1
listen: 0.0.0.0:4222

# Monitoring (/healthz, /varz, /jsz). Published on 127.0.0.1 only.
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 20GB
}

# Clients authenticate; the password comes from the environment.
authorization {
  user: hq
  password: $NATS_PASSWORD
}
