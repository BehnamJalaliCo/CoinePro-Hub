# tmpfiles.d: /run/hq holds the lock the one-shots share (prompt 12 §4): the
# hourly backup and the TTS pass never run at the same time.
d /run/hq 0750 Hub Hub -
# ⟨1.9⟩ prompt 18: the demand file of on-demand speech to text. The worker
# (uid 10001, its bind mount /stt-demand) touches want; coinepro-hq-stt.path
# (root) and the starter (Hub) only read its time.
d /run/hq/stt 0755 10001 10001 -
