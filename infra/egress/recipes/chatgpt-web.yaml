# ChatGPT in the hub's signed-in browser profile `chatgpt-web` (prompt 12
# §9.1.5, contract §21.13): text, and images on the owner's plan. A reviewed
# file: a change here is a reviewed change, never an agent's write.
# The selectors are written against chatgpt.com as documented on 2026-10-22
# and are NOT yet verified on the live site (no sign-in exists until the
# owner's `make chatgpt-web-login`); the first failing step falls back to one
# Claude run with web.browse on this profile, which proposes the fix here.
# 2026-10-31 (after prompt 19), checked on the live site: the composer is no
# longer #prompt-textarea but a contenteditable div, and with the profile's
# locale fa-IR the send button is found by its Persian label («ارسال…»), not
# data-testid=send-button (every call failed at 1:wait). The stop button takes
# its testid or its Persian label («توقف…»).
# 2026-10-31.3: the answer no longer carries data-message-author-role (a test
# call was sent and answered, then 6:read found nothing), and a temporary chat
# has no data-local-conversation-final-assistant either. An answer's row has
# a read-aloud button («بلند…», only under ChatGPT's answers, only once one is
# finished): the read waits for it.
# 2026-10-31.4-.5: .3's read took the whole thread («شما گفتید: … ChatGPT گفت: …»);
# each answer follows ChatGPT's own hidden heading («ChatGPT گفت:» / "ChatGPT
# said:"), so the read takes the block right after the last one (the
# heading's outermost element: it nests). Checked by test calls: the answer
# is not the heading's sibling, so the read takes the answer's turn (the
# outermost block above the heading without the user's «شما گفتید») and in it
# the first block that holds neither the heading nor the bare «ChatGPT» label.
# 2026-11-02.1 (prompt 20.1, the lesson of 19.3): GPT's text now runs here,
# not on Codex, so the text task leans on the page's structure, never on the
# words of one language: the prompt goes with Enter in the composer (a
# send-button testid as an optional second try, no label); the stop and the
# finished answer's action bar are found by their testids first; the answer
# is read as the last rendered answer block (ChatGPT renders only its own
# answers as markdown), and only when that finds nothing, by .5's heading
# (the Persian «ChatGPT گفت:» or the English one). Every label kept is a
# fallback next to a structural selector, in both languages.
# 2026-11-04.1 (prompt 22, production lines): the `cover` task: the cover folder (the
# job's files) goes into the composer's file input, the brief is sent, the generated
# image comes back. Structural, not yet verified on the live site.
# 2026-11-13.1 (F-0018): every cover and image job failed at 4:wait: ChatGPT answered «Image
# generation is not available in this temporary chat. Open a regular ChatGPT chat» (its own
# screenshot). The image and cover tasks open a regular new chat (one chat per job, as the
# owner asked: «برای هر کار یه صفحه جدا»); the text task keeps the temporary chat.
# 2026-11-14.1 (the owner: «چت جی پی تی رو درستش کن», TY's daily stories): .13.1 never ran
# (egress read the recipes only at its start and was not restarted: a test job still answered
# 2026-11-04.1 from a temporary chat). Restarted, .13.1 made the image in a regular chat in 46 s
# and still failed at 4:wait: the page's language is Persian, so no image's alt starts with
# "Generated image". The image is now found by its source (the site's own file address,
# estuary or oaiusercontent, a blob while it is drawn) inside the thread, and only once the
# answer is finished: the stop button gone and the answer's action bar shown, like the text
# task. The last such image is the made one (a cover's attached files come before it).
key: chatgpt-web
version: "2026-11-14.1"
site: chatgpt.com
# A temporary chat: nothing of the job stays in the account's history.
start_url: "https://chatgpt.com/?temporary-chat=true"
# The only hosts the profile may reach (and their subdomains): the site, its
# static and file hosts, and the challenge page it puts in front of a chat.
hosts:
  - chatgpt.com
  - openai.com
  - oaistatic.com
  - oaiusercontent.com
  - challenges.cloudflare.com
# Beyond those, what the owner's sign-in window may reach (the sign-in
# providers ChatGPT offers).
login_hosts:
  - accounts.google.com
  # Google's consent pages after sign-in (the EU consent, the account bar)
  - gds.google.com
  - consent.google.com
  - ogs.google.com
  # Google sets the sign-in cookie on the country domain of the hub's IP too (Germany)
  - accounts.google.de
  - gstatic.com
  - appleid.apple.com
  - login.live.com
  - login.microsoftonline.com
expired:
  url_contains: ["/auth/login", "/log-in", "auth.openai.com"]
  selectors:
    - "[data-testid=login-button]"
    - "button:has-text('Log in')"
tasks:
  text:
    timeout_s: 240
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: wait, selector: "div[contenteditable=true]", timeout_s: 30}
      - {do: fill, selector: "div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "div[contenteditable=true]", key: Enter}
      - {do: click, selector: "[data-testid=send-button]", optional: true}
      - {do: wait, selector: "[data-testid=stop-button], button[aria-label*='توقف'], button[aria-label*='Stop']", timeout_s: 20, optional: true}
      - {do: wait_gone, selector: "[data-testid=stop-button], button[aria-label*='توقف'], button[aria-label*='Stop']", timeout_s: 200}
      - do: wait
        selector: >-
          [data-testid=copy-turn-action-button], [data-testid=voice-play-turn-action-button],
          button[aria-label*='بلند'], button[aria-label*='Read aloud']
        timeout_s: 30
      - do: read
        selector: "[data-message-author-role=assistant] .markdown, div.markdown"
        alt:
          - >-
            xpath=(//*[(normalize-space(.)='ChatGPT گفت:' or normalize-space(.)='ChatGPT said:')
            and normalize-space(..)!=normalize-space(.)])[last()]
            /ancestor::*[not(contains(.,'شما گفتید')) and not(contains(.,'You said'))][last()]
            //*[not(contains(.,'ChatGPT گفت')) and not(contains(.,'ChatGPT said'))
            and (contains(..,'ChatGPT گفت') or contains(..,'ChatGPT said'))
            and normalize-space(.)!='' and normalize-space(.)!='ChatGPT'
            and not(ancestor-or-self::button)][1]
  image:
    timeout_s: 180
    steps:
      - {do: goto, url: "https://chatgpt.com/"}
      - {do: wait, selector: "div[contenteditable=true]", timeout_s: 30}
      - {do: fill, selector: "div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "div[contenteditable=true]", key: Enter}
      - {do: click, selector: "[data-testid=send-button]", optional: true}
      - {do: wait, selector: "[data-testid=stop-button], button[aria-label*='توقف'], button[aria-label*='Stop']", timeout_s: 20, optional: true}
      - {do: wait_gone, selector: "[data-testid=stop-button], button[aria-label*='توقف'], button[aria-label*='Stop']", timeout_s: 150}
      - do: wait
        selector: >-
          main img[src*='/backend-api/estuary/content'], main img[src*='oaiusercontent.com'],
          main img[alt^='Generated image']
        timeout_s: 30
      - do: wait
        selector: >-
          [data-testid=copy-turn-action-button], [data-testid=good-response-turn-action-button],
          button[aria-label*='کپی'], button[aria-label*='Copy']
        timeout_s: 20
        optional: true
      - {do: pause, ms: 2000}
      - do: download_image
        selector: >-
          main img[src*='/backend-api/estuary/content'], main img[src*='oaiusercontent.com'],
          main img[alt^='Generated image']
        attr: src
  cover:
    timeout_s: 270
    steps:
      - {do: goto, url: "https://chatgpt.com/"}
      - {do: wait, selector: "div[contenteditable=true]", timeout_s: 30}
      - {do: attach, selector: "input[type=file]"}
      - {do: pause, ms: 3000}
      - {do: fill, selector: "div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "[data-testid=stop-button], button[aria-label*='توقف'], button[aria-label*='Stop']", timeout_s: 20, optional: true}
      - {do: wait_gone, selector: "[data-testid=stop-button], button[aria-label*='توقف'], button[aria-label*='Stop']", timeout_s: 200}
      - do: wait
        selector: >-
          [data-testid=copy-turn-action-button], [data-testid=good-response-turn-action-button],
          button[aria-label*='کپی'], button[aria-label*='Copy']
        timeout_s: 20
        optional: true
      - {do: pause, ms: 2000}
      - do: download_image
        selector: >-
          main img[src*='/backend-api/estuary/content'], main img[src*='oaiusercontent.com'],
          main img[alt^='Generated image']
        attr: src
