# YouTube Studio in the hub's browser profile `youtube-web` (2026-11-17): DotCoin.me's reels go
# out once each as a public Short on the owner's channel @DotCoin-me (the YouTube API keeps an
# unaudited app's uploads private, so the browser comes first). The owner's own Google account:
# the profile began as a copy of `aistudio-web` (same account); `make youtube-web-login` is the
# owner's fallback sign-in. A reviewed file.
#   channel  read only: Studio opened, the active channel's name read
#   titles   read only: the channel's content list (a duplicate check before an upload)
#   upload   the job's video (its one file) as a Short: title = the job's prompt, description =
#            the job's description, not made for kids, the job's visibility (PUBLIC or UNLISTED;
#            a job without one stops before it), then the video's link read
#   public   an uploaded video (the job's video_id) made Public on its Studio page
#   ⟨2026-11-17.5⟩ long videos (16:9, 8-10 minutes, 3 a week):
#   upload_long  a long video and its thumbnail, both already in the profile browser's spool (the
#            job's `spooled`, never base64: file 0 the video, file 1 the thumbnail): title = the
#            job's prompt, description = the job's description (its chapters' "00:00 …" lines),
#            the thumbnail (optional: a channel without custom thumbnails still uploads; the
#            answer's notes.thumbnail is what the thumbnail area said after it), tags (the job's
#            `tags`, typed: comma-separated, ending in a comma) and category Education (both
#            optional), not made for kids, the job's visibility; then it waits until the whole
#            file is sent (notes.sent) and reads the video's link
#   features read only: the channel's feature eligibility (custom thumbnails, videos over 15
#            minutes: "intermediate features"), as the page's text
#   videos   read only: the channel's long videos in Studio's content list, every visibility and
#            drafts too (a duplicate check before a long upload)
#   ⟨2026-11-17.6⟩ details    an uploaded video's (job's video_id) tags (the job's `tags`) and its
#            language, Persian, then Save; the answer is the tags box as saved
#   subtitles  the job's one spooled .srt (with timing) as the video's Persian subtitles, published
#   ⟨2026-11-17.19⟩ thumbnail  an uploaded video's custom thumbnail (the job's one spooled picture),
#            then Save (the channel is phone-verified since 2026-11-17)
#   ⟨2026-11-18.1⟩ Search Console of dotcoin.me (the same Google account owns the domain property
#   sc-domain:dotcoin.me; the owner's SEO automation, flow dotcoin_seo):
#   gsc_28d, gsc_7d  read only: the Performance report (Search, web, all four metrics) of the last 28
#            / 7 days as Search Console's own export (Download CSV: a ZIP of Chart, Queries, Pages,
#            Countries, Devices, Search appearance and Filters .csv), taken with `capture` (the
#            request the menu makes, fetched by the profile browser; no download is started)
#   gsc_pages  read only: the Page indexing report (indexed / not indexed and why), as its text
#   gsc_sitemap  sitemap.xml submitted again (the job's prompt: the sitemap's path) and the
#            Sitemaps table read (last read, status, discovered pages)
#   gsc_inspect  read only: URL inspection of the job's prompt (one dotcoin.me URL), its verdict
#   gsc_request  the same, then «Request indexing» (Google's own daily cap; the answer is the
#            dialog: requested, quota or an error)
# Driven by automations/sites/dotcoin/youtube.py, youtube_long.py and seo.py (host timers), never
# by an agent.
key: youtube-web
version: "2026-11-18.2"
site: studio.youtube.com
start_url: "https://studio.youtube.com/"
hosts:
  - studio.youtube.com
  - youtube.com
  - upload.youtube.com
  - googlevideo.com
  - ytimg.com
  - ggpht.com
  - gstatic.com
  - googleapis.com
  - googleusercontent.com
  # the Google session's own upkeep (cookie rotation, the account menu)
  - accounts.google.com
  - accounts.youtube.com
  - www.google.com
  - apis.google.com
  - play.google.com
  # 2026-11-18: Search Console (dotcoin.me's SEO automation reads its reports and asks for indexing)
  - search.google.com
login_hosts:
  - gds.google.com
  - consent.google.com
  - consent.youtube.com
  - ogs.google.com
  - myaccount.google.com
  # 2026-11-17: the owner's YouTube sign-in broke on Google's consent page and its country domain
  - policies.google.com
  - accounts.google.co.uk
  - accounts.google.de
expired:
  url_contains: ["accounts.google.com", "ServiceLogin"]
  hosts: [accounts.google.com]
  selectors:
    - "a[href*='ServiceLogin']"
tasks:
  channel:
    timeout_s: 90
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: wait, selector: "ytcp-navigation-drawer, #entity-name", state: attached, timeout_s: 60}
      - {do: pause, ms: 3000}
      - {do: read, selector: "ytcp-navigation-drawer #entity-name", alt: ["ytcp-navigation-drawer", "body"]}
  titles:
    # the channel's public Shorts (a duplicate check before an upload): their titles as text
    timeout_s: 90
    steps:
      - {do: goto, url: "https://www.youtube.com/@DotCoin-me/shorts"}
      - {do: wait, selector: "ytd-rich-grid-renderer, ytd-browse", state: attached, timeout_s: 45}
      - {do: pause, ms: 3000}
      - {do: read, selector: "ytd-rich-grid-renderer #contents", alt: ["ytd-browse #contents", "body"]}
  upload:
    timeout_s: 600
    steps:
      # the upload dialog of the active channel (Studio's own route)
      - {do: goto, url: "https://www.youtube.com/upload"}
      - {do: wait, selector: "ytcp-uploads-file-picker input[type=file], input[type=file]", state: attached, timeout_s: 60}
      - {do: attach, selector: "input[type=file]", timeout_s: 60}
      # the details step: title (the job's prompt) and description, both rich text boxes
      - {do: wait, selector: "#title-textarea #textbox", timeout_s: 180}
      - {do: pause, ms: 2000}
      - {do: fill, selector: "#title-textarea #textbox", text: "{prompt}"}
      - {do: fill, selector: "#description-textarea #textbox", text: "{description}"}
      - {do: click, selector: "tp-yt-paper-radio-button[name='VIDEO_MADE_FOR_KIDS_NOT_MFK']", timeout_s: 30}
      - {do: pause, ms: 1500}
      # details -> video elements -> checks -> visibility
      - {do: click, selector: "#next-button", timeout_s: 30}
      - {do: pause, ms: 1500}
      - {do: click, selector: "#next-button", timeout_s: 30}
      - {do: pause, ms: 1500}
      - {do: click, selector: "#next-button", timeout_s: 30}
      - {do: wait, selector: "tp-yt-paper-radio-button[name='{visibility}']", timeout_s: 30}
      - {do: click, selector: "tp-yt-paper-radio-button[name='{visibility}']"}
      - {do: pause, ms: 1500}
      # the file is sent before the dialog closes (a closed page would end the upload)
      - {do: wait, selector: "ytcp-video-upload-progress[upload-progress-ended], ytcp-video-info a", state: attached, timeout_s: 300}
      - {do: read, selector: "ytcp-video-info a", alt: [".video-url-fadeable a"]}
      - {do: click, selector: "#done-button", timeout_s: 30}
      # the "published" dialog and its link (the answer)
      - {do: wait, selector: "ytcp-video-share-dialog, ytcp-uploads-still-processing-dialog", state: attached, timeout_s: 120}
      - {do: pause, ms: 3000}
      - {do: read, selector: "ytcp-video-share-dialog #share-url", alt: ["ytcp-video-info a", ".video-url-fadeable a"]}
  public:
    # NOT yet run on the live page (2026-11-17): the video's details page, its visibility menu,
    # Public, the menu's Done, the page's Save
    timeout_s: 150
    steps:
      - {do: goto, url: "https://studio.youtube.com/video/{video_id}/edit"}
      - {do: wait, selector: "ytcp-video-metadata-visibility, #visibility-select", state: attached, timeout_s: 60}
      - {do: pause, ms: 2000}
      - {do: click, selector: "ytcp-video-metadata-visibility #select-button, ytcp-video-metadata-visibility", timeout_s: 20}
      - {do: wait, selector: "tp-yt-paper-radio-button[name='PUBLIC']", timeout_s: 20}
      - {do: click, selector: "tp-yt-paper-radio-button[name='PUBLIC']"}
      - {do: click, selector: "ytcp-video-visibility-select #save-button, #save-button", timeout_s: 20}
      - {do: pause, ms: 1500}
      - {do: click, selector: "ytcp-button#save, #save", timeout_s: 20}
      - {do: pause, ms: 4000}
      - {do: read, selector: "ytcp-video-metadata-visibility", alt: ["ytcp-video-info", "body"]}
  upload_long:
    # The video (file 0) and its thumbnail (file 1) are the job's spooled files. A failure before
    # step 2 leaves nothing on YouTube; after it, a Private draft; from the Done click on, the video
    # may be out (youtube_long.py: state `check`, never tried again by itself).
    timeout_s: 1500
    # 2026-11-18.2: no request interception for this task (browser_web.ProxyRelay): an intercepted
    # upload body is copied into Chrome's browser process (~9x the file); DotCoin's 186 MB long
    # video was killed at browser-web's memory cap (15:05Z, TargetClosedError at step 3). The egress
    # proxy still keeps the job to the hosts above. (Shorts' `upload` keeps interception.)
    intercept: false
    steps:
      - {do: goto, url: "https://www.youtube.com/upload"}
      - {do: wait, selector: "ytcp-uploads-file-picker input[type=file], input[type=file]", state: attached, timeout_s: 60}
      - {do: attach, selector: "input[type=file]", file: 0, timeout_s: 120}
      # the details step: title (the job's prompt) and description, both rich text boxes
      - {do: wait, selector: "#title-textarea #textbox", timeout_s: 180}
      - {do: pause, ms: 2000}
      - {do: fill, selector: "#title-textarea #textbox", text: "{prompt}"}
      - {do: fill, selector: "#description-textarea #textbox", text: "{description}"}
      # the thumbnail into the details step's own image input (a hidden input: no click, no file
      # chooser); what the thumbnail area shows after it is kept as notes.thumbnail
      - {do: attach, selector: "ytcp-thumbnails-compact-editor-uploader input[type=file], input#file-loader", file: 1, optional: true, timeout_s: 20}
      - {do: pause, ms: 5000}
      - {do: read, selector: "ytcp-thumbnails-compact-editor", alt: ["ytcp-thumbnail-uploader"], note: thumbnail, optional: true, timeout_s: 10}
      - {do: click, selector: "tp-yt-paper-radio-button[name='VIDEO_MADE_FOR_KIDS_NOT_MFK']", timeout_s: 30}
      - {do: pause, ms: 1500}
      # "Show more": tags (typed: each comma makes a tag) and category Education, both optional
      - {do: click, selector: "ytcp-uploads-details #toggle-button, ytcp-video-metadata-editor #toggle-button, #toggle-button", optional: true}
      - {do: pause, ms: 2000}
      # (2026-11-17.6: video 1's tags were not kept: the box is clicked first, the last tag closed with
      # Enter, and what the box then shows is kept as notes.tags)
      - {do: click, selector: "#tags-container #text-input, #tags-container input", optional: true, timeout_s: 10}
      - {do: fill, selector: "#tags-container #text-input, #tags-container input", text: "{tags}", typed: true, optional: true, timeout_s: 45}
      - {do: press, selector: "#tags-container #text-input, #tags-container input", key: "Enter", optional: true, timeout_s: 5}
      - {do: pause, ms: 1000}
      - {do: read, selector: "#tags-container", note: tags, optional: true, timeout_s: 10}
      - {do: click, selector: "#category ytcp-text-dropdown-trigger, #category-container ytcp-text-dropdown-trigger", optional: true, timeout_s: 10}
      - {do: click, selector: "tp-yt-paper-item[test-id='CREATOR_VIDEO_CATEGORY_EDUCATION']", optional: true, timeout_s: 10}
      # a list left open (its item not found) is closed again: Escape reaches the topmost overlay only
      - {do: press, selector: "tp-yt-iron-dropdown:visible tp-yt-paper-listbox", key: "Escape", optional: true, timeout_s: 3}
      - {do: pause, ms: 1500}
      # details -> video elements -> checks -> visibility
      - {do: click, selector: "#next-button", timeout_s: 30}
      - {do: pause, ms: 1500}
      - {do: click, selector: "#next-button", timeout_s: 30}
      - {do: pause, ms: 1500}
      - {do: click, selector: "#next-button", timeout_s: 30}
      - {do: wait, selector: "tp-yt-paper-radio-button[name='{visibility}']", timeout_s: 30}
      - {do: click, selector: "tp-yt-paper-radio-button[name='{visibility}']"}
      - {do: pause, ms: 1500}
      # the whole file is sent before the dialog closes (a closed page would end the upload): no
      # request to YouTube's upload host in flight for a while, then Studio's own progress
      - {do: wait_sent, url: "https://upload.youtube.com/", timeout_s: 1300, note: sent}
      - {do: wait_gone, selector: "ytcp-video-upload-progress[uploading]", timeout_s: 120, optional: true}
      - {do: read, selector: "ytcp-video-info a", alt: [".video-url-fadeable a"]}
      - {do: click, selector: "#done-button", timeout_s: 30}
      # the "saved" / "published" dialog and its link (the answer; the link above when it is not shown)
      - {do: wait, selector: "ytcp-video-share-dialog, ytcp-uploads-still-processing-dialog", state: attached, timeout_s: 120, optional: true}
      - {do: pause, ms: 3000}
      - {do: read, selector: "ytcp-video-share-dialog #share-url", alt: ["ytcp-video-info a", ".video-url-fadeable a"], optional: true}
  features:
    # read only: Studio's Settings -> Channel -> Feature eligibility (youtube.com/features opens it)
    timeout_s: 120
    steps:
      - {do: goto, url: "https://www.youtube.com/features"}
      - {do: wait, selector: "ytcp-settings-dialog, ytcp-feature-eligibility, ytcp-navigation-drawer", state: attached, timeout_s: 60, optional: true}
      - {do: pause, ms: 5000}
      - {do: read, selector: "ytcp-settings-dialog tp-yt-paper-dialog, ytcp-settings-dialog", alt: ["tp-yt-paper-dialog", "ytcp-navigation-drawer", "body"]}
  videos:
    # read only: Studio's content list, long videos (youtube.com/my_videos opens it); no fallback to
    # the page's body: a page that is not the list fails the job (never a silent "no duplicate")
    timeout_s: 120
    steps:
      - {do: goto, url: "https://www.youtube.com/my_videos"}
      - {do: wait, selector: "ytcp-video-section-content, ytcp-video-list", state: attached, timeout_s: 60}
      - {do: pause, ms: 4000}
      - {do: read, selector: "ytcp-video-section-content, ytcp-video-list"}
  details:
    # an uploaded video's Studio page (the job's video_id): its tags (the job's `tags`) and its
    # language (Persian: subtitles are added in it), then Save; the answer is the tags box as saved
    timeout_s: 240
    steps:
      - {do: goto, url: "https://studio.youtube.com/video/{video_id}/edit"}
      - {do: wait, selector: "#title-textarea #textbox", timeout_s: 60}
      - {do: pause, ms: 2500}
      - {do: click, selector: "ytcp-video-metadata-editor #toggle-button, #toggle-button", optional: true, timeout_s: 10}
      - {do: pause, ms: 1500}
      - {do: click, selector: "#tags-container #text-input, #tags-container input", timeout_s: 20}
      - {do: fill, selector: "#tags-container #text-input, #tags-container input", text: "{tags}", typed: true, timeout_s: 60}
      - {do: press, selector: "#tags-container #text-input, #tags-container input", key: "Enter", optional: true, timeout_s: 5}
      - {do: pause, ms: 1500}
      - {do: read, selector: "#tags-container", note: tags, optional: true, timeout_s: 10}
      - {do: click, selector: "ytcp-form-language-input ytcp-dropdown-trigger, #language-input ytcp-dropdown-trigger", optional: true, timeout_s: 10}
      - {do: click, selector: "tp-yt-paper-item:has-text('Persian'), tp-yt-paper-item:has-text('فارسی')", optional: true, timeout_s: 10}
      - {do: pause, ms: 1000}
      - {do: click, selector: "ytcp-button#save, #save", timeout_s: 20}
      - {do: pause, ms: 5000}
      - {do: read, selector: "#tags-container", alt: ["ytcp-video-metadata-editor"]}
  subtitles:
    # The job's one spooled .srt (with timing) as the video's (job's video_id) Persian subtitles, as
    # Studio's page shows it (2026-11-17, video 1): a video whose language row has no subtitles yet
    # offers «Add» -> «Upload file»; one with YouTube's automatic track shows, under the pointer, an
    # edit icon -> «Overwrite track» Continue -> the editor's ⋮ -> «Upload file». The file goes into
    # the dialog's file input (never the native chooser), then Publish; the answer is the row.
    timeout_s: 300
    steps:
      - {do: goto, url: "https://studio.youtube.com/video/{video_id}/translations"}
      - {do: wait, selector: "ytgn-video-translation-row", state: attached, timeout_s: 60}
      - {do: pause, ms: 3000}
      # no subtitles yet: the row's «Add»
      - {do: click, selector: "ytgn-video-translation-row:has-text('Persian') ytcp-button:has-text('Add'):visible", optional: true, timeout_s: 3}
      # YouTube's automatic track: the pointer on the cell, its first icon (edit), Continue, the ⋮
      - {do: click, selector: "ytgn-video-translation-row >> text=Published", optional: true, timeout_s: 3}
      - {do: pause, ms: 800}
      - {do: click, selector: "ytgn-video-translation-row:has-text('Persian') ytcp-icon-button:visible >> nth=0", optional: true, timeout_s: 5}
      - {do: click, selector: "ytcp-button:has-text('Continue'):visible", optional: true, timeout_s: 5}
      - {do: wait, selector: "ytcp-button:has-text('Edit as text'):visible", optional: true, timeout_s: 20}
      - {do: pause, ms: 1500}
      - {do: click, selector: ":is(ytcp-icon-button, tp-yt-icon-button, button):visible:right-of(ytcp-button:has-text('Edit as text')) >> nth=0", optional: true, timeout_s: 5}
      - {do: pause, ms: 1500}
      # both ways: «Upload file», with timing, the file into the dialog's input
      - {do: click, selector: "text=Upload file >> visible=true", timeout_s: 15}
      - {do: pause, ms: 2000}
      - {do: click, selector: "tp-yt-paper-radio-button:has-text('With timing'):visible", optional: true, timeout_s: 5}
      # the dialog's own input is the newest one: the file set there loads at once (no Continue, no chooser)
      - {do: attach, selector: "input[type=file] >> nth=-1", file: 0, timeout_s: 15}
      - {do: pause, ms: 5000}
      - {do: wait, selector: "ytcp-button:has-text('Edit as text'):visible", timeout_s: 30}
      - {do: click, selector: "ytcp-button:has-text('Publish'):visible", timeout_s: 30}
      - {do: pause, ms: 5000}
      # the video language's row (our track); YouTube's automatic one is listed apart once ours is in
      - {do: read, selector: "ytgn-video-translation-row:has-text('video language')", alt: ["ytgn-video-translations-section"]}
  thumbnail:
    # an uploaded video's (job's video_id) custom thumbnail: the job's one spooled picture into the
    # details page's own thumbnail input (no file chooser), then Save; the answer is the thumbnail
    # area as saved
    timeout_s: 180
    steps:
      - {do: goto, url: "https://studio.youtube.com/video/{video_id}/edit"}
      - {do: wait, selector: "#title-textarea #textbox", timeout_s: 60}
      - {do: pause, ms: 2500}
      - {do: attach, selector: "ytcp-thumbnails-compact-editor-uploader input[type=file], input#file-loader", file: 0, timeout_s: 20}
      - {do: pause, ms: 5000}
      - {do: read, selector: "ytcp-thumbnails-compact-editor", alt: ["ytcp-thumbnail-uploader"], note: thumbnail, optional: true, timeout_s: 10}
      - {do: click, selector: "ytcp-button#save:visible, #save:visible", timeout_s: 20}
      - {do: pause, ms: 5000}
      - {do: read, selector: "ytcp-thumbnails-compact-editor", alt: ["ytcp-thumbnail-uploader", "ytcp-video-metadata-editor"]}
  # ---- Search Console (dotcoin.me), 2026-11-18.1: the page's own controls by their labels -------
  gsc_28d:
    timeout_s: 150
    steps:
      - {do: goto, url: "https://search.google.com/search-console/performance/search-analytics?resource_id=sc-domain%3Adotcoin.me&num_of_days=28&metrics=CLICKS%2CIMPRESSIONS%2CCTR%2CPOSITION"}
      - {do: wait, selector: "div[role=button][aria-label='EXPORT']", timeout_s: 60}
      - {do: pause, ms: 4000}
      - {do: click, selector: "div[role=button][aria-label='EXPORT']:visible", timeout_s: 20}
      - {do: wait, selector: "[role=menuitem][aria-label='Download CSV']:visible", timeout_s: 20}
      - {do: pause, ms: 1000}
      # the export as the page fetches it, never a download (Chromium's download path crashes here)
      - {do: capture, selector: "[role=menuitem][aria-label='Download CSV']:visible", url: "https://search.google.com/search-console/export/", timeout_s: 60}
  gsc_7d:
    timeout_s: 150
    steps:
      - {do: goto, url: "https://search.google.com/search-console/performance/search-analytics?resource_id=sc-domain%3Adotcoin.me&num_of_days=7&metrics=CLICKS%2CIMPRESSIONS%2CCTR%2CPOSITION"}
      - {do: wait, selector: "div[role=button][aria-label='EXPORT']", timeout_s: 60}
      - {do: pause, ms: 4000}
      - {do: click, selector: "div[role=button][aria-label='EXPORT']:visible", timeout_s: 20}
      - {do: wait, selector: "[role=menuitem][aria-label='Download CSV']:visible", timeout_s: 20}
      - {do: pause, ms: 1000}
      # the export as the page fetches it, never a download (Chromium's download path crashes here)
      - {do: capture, selector: "[role=menuitem][aria-label='Download CSV']:visible", url: "https://search.google.com/search-console/export/", timeout_s: 60}
  gsc_pages:
    timeout_s: 120
    steps:
      - {do: goto, url: "https://search.google.com/search-console/index?resource_id=sc-domain%3Adotcoin.me"}
      - {do: wait, selector: "text=Page indexing", timeout_s: 60}
      - {do: pause, ms: 5000}
      - {do: read, selector: "c-wiz[jsrenderer]:visible:has-text('Page indexing')", alt: ["body"]}
  gsc_sitemap:
    # the prompt is the sitemap's path on the property (sitemap.xml): submitted again, then the table
    timeout_s: 120
    steps:
      - {do: goto, url: "https://search.google.com/search-console/sitemaps?resource_id=sc-domain%3Adotcoin.me"}
      - {do: wait, selector: "input[aria-label='Enter sitemap URL']", timeout_s: 60}
      - {do: pause, ms: 3000}
      - {do: click, selector: "input[aria-label='Enter sitemap URL']", timeout_s: 15}
      - {do: fill, selector: "input[aria-label='Enter sitemap URL']", text: "{prompt}", timeout_s: 15}
      - {do: click, selector: "div[role=button]:has-text('SUBMIT')", timeout_s: 15}
      - {do: pause, ms: 5000}
      - {do: click, selector: "[role=dialog] [role=button]:has-text('Got it'), [role=dialog] button:has-text('Got it')", optional: true, timeout_s: 8}
      - {do: pause, ms: 2000}
      - {do: read, selector: "c-wiz[jsrenderer]:visible:has-text('Submitted sitemaps')", alt: ["body"]}
  gsc_inspect:
    # the prompt is one URL of the property; the answer is the inspection's verdict and details
    timeout_s: 150
    steps:
      - {do: goto, url: "https://search.google.com/search-console?resource_id=sc-domain%3Adotcoin.me"}
      - {do: wait, selector: "input[aria-label^='Inspect any URL']", timeout_s: 60}
      - {do: pause, ms: 3000}
      - {do: click, selector: "input[aria-label^='Inspect any URL']", timeout_s: 15}
      - {do: fill, selector: "input[aria-label^='Inspect any URL']", text: "{prompt}", timeout_s: 15}
      - {do: press, selector: "input[aria-label^='Inspect any URL']", key: "Enter", timeout_s: 15}
      - {do: wait, selector: "text=/URL is (not )?on Google|URL is unknown to Google|URL not in property/ >> visible=true", timeout_s: 90}
      - {do: pause, ms: 3000}
      - {do: read, selector: "c-wiz[jsrenderer]:visible:has-text('URL Inspection')", alt: ["body"]}
  gsc_request:
    # gsc_inspect, then «Request indexing»: Google's live test, then its dialog (requested, the
    # day's quota, or an error), kept in notes.request; the answer is the verdict
    timeout_s: 240
    steps:
      - {do: goto, url: "https://search.google.com/search-console?resource_id=sc-domain%3Adotcoin.me"}
      - {do: wait, selector: "input[aria-label^='Inspect any URL']", timeout_s: 60}
      - {do: pause, ms: 3000}
      - {do: click, selector: "input[aria-label^='Inspect any URL']", timeout_s: 15}
      - {do: fill, selector: "input[aria-label^='Inspect any URL']", text: "{prompt}", timeout_s: 15}
      - {do: press, selector: "input[aria-label^='Inspect any URL']", key: "Enter", timeout_s: 15}
      - {do: wait, selector: "div[role=button][aria-label^='Request indexing']:visible", timeout_s: 90}
      - {do: pause, ms: 2000}
      - {do: read, selector: "c-wiz[jsrenderer]:visible:has-text('URL Inspection')", alt: ["body"], note: verdict, optional: true, timeout_s: 15}
      - {do: click, selector: "div[role=button][aria-label^='Request indexing']:visible", timeout_s: 15}
      # (the page keeps hidden copies of its dialogs: only a visible one counts)
      - {do: wait, selector: "text=/Indexing requested|priority crawl queue|Quota exceeded|Something went wrong|problem submitting/i >> visible=true", timeout_s: 180}
      - {do: pause, ms: 1500}
      - {do: read, selector: "text=/Indexing requested|priority crawl queue|Quota exceeded|Something went wrong|problem submitting/i >> visible=true"}
