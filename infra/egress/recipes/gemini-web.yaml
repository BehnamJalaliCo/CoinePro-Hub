# Gemini in the hub's signed-in browser profile `gemini-web` (prompt 12
# §9.1.5, contract §21.13): text, images and short videos (at most 10 s) on
# the owner's Google AI Pro plan. A reviewed file.
# The selectors are written against gemini.google.com as documented on
# 2026-10-22; a failing step falls back to one Claude run with web.browse on
# this profile, which proposes the fix here.
# 2026-10-31 (prompt 19), checked on the live site: the profile opens with
# locale fa-IR, so Gemini's labels are Persian and `aria-label='Send message'`
# matched nothing (every council call failed at 4:click). Each label selector
# now takes the English and the Persian label; the send button's Persian one
# («ارسال…») was seen live, the stop button's («توقف…») is Gemini's own wording,
# not yet seen (it shows only while an answer is being written).
# 2026-10-31.2: the first test call filled the box but the click on the send
# button sent nothing (the hub's own screenshot: the text still in the box), so
# the prompt goes with Enter in the box (no label, any language). An answer is
# read only once its action bar (message-actions) shows, so a stop button that
# is never matched cannot hand back half an answer.
# 2026-11-11 (audit): the video task still waited for the English-only
# «Download video» label, so on the fa-IR page every video job (its quota
# already spent) failed at the wait step. Its download button now takes the
# Persian label too: «دانلود» together with «وید…» (ویدیو or ویدئو), so another
# download button on the page is not taken for it.
# 2026-11-27.1: every Gemini picture since 11-21 failed at 10:click (the «4 Neon» menu item) and the
# hub then held Gemini for 6 h after each failure, so the DotCoin stories of 11-27 (00:32Z) got
# «channel_not_configured». Seen with web.browse: the profile is SIGNED OUT (Google ended the session
# on 11-21; the page shows «برای ذخیره فعالیت، به سیستم وارد شوید» and a «ورود به سیستم» button), and
# the signed-out model menu cannot pick Neon. `expired` only knew the English «Sign in», so the jobs
# said recipe_failed instead of «sign in again»: the Persian page's sign-in button now counts too.
key: gemini-web
version: "2026-11-27.2"
site: gemini.google.com
start_url: "https://gemini.google.com/app"
hosts:
  - gemini.google.com
  - gstatic.com
  - googleusercontent.com
  - apis.google.com
  - www.google.com
  # 2026-10-31 (owner's order): what Gemini sends a prompt through, refused
  # until now in the job and in the sign-in window (egress log): its own API,
  # its anti-abuse check and its live channel, and Google's client log.
  - geminiweb-pa.clients6.google.com
  - waa-pa.clients6.google.com
  - signaler-pa.clients6.google.com
  - play.google.com
  # 2026-11-14.1 (owner's yes, story images by Gemini's «Argon»): the made image is served from
  # here; refused until now, it stayed grey and its download failed (host_not_allowed).
  - work.fife.usercontent.google.com
  # 2026-11-20: Google rotates the sign-in cookies through accounts.google.com while a page is open;
  # refused in the jobs (it was a login host only), the session died on 11-18 (Gemini opened signed
  # out, every image failed). youtube-bj, chatgpt-web and deepseek-web allow it and stayed signed in.
  - accounts.google.com
login_hosts:
  - accounts.google.com
  # Google's consent pages after sign-in (the EU consent, the account bar)
  - gds.google.com
  - consent.google.com
  - ogs.google.com
  # Google sets the sign-in cookie on the country domain of the hub's IP too (Germany)
  - accounts.google.de
  - accounts.youtube.com
  - myaccount.google.com
expired:
  url_contains: ["accounts.google.com", "ServiceLogin"]
  hosts: [accounts.google.com]
  selectors:
    - "a[href*='ServiceLogin']"
    - "a:has-text('Sign in')"
    - "a:has-text('ورود به سیستم')"
    - "button:has-text('ورود به سیستم')"
tasks:
  text:
    timeout_s: 240
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: click, selector: "[data-test-id=temp-chat-button]", optional: true}
      - {do: wait, selector: "rich-textarea div[contenteditable=true]", timeout_s: 30}
      # 2026-11-27.2 (seen live, signed in): the menu = menuitemradio «4 Neon» … plus a SUBMENU
      # «سطح «اندیشگر»» holding پایین / متوسط / بالا. The old steps looked for «بالا» in the main menu,
      # missed, and the second menu click CLOSED the still-open menu, so Neon was never found (10:click).
      # Now: Neon first (optional in text), then the thinking submenu → «بالا» (optional), then Escape.
      - {do: pause, ms: 2000}
      - {do: click, selector: "[data-test-id=bard-mode-menu-button], bard-mode-switcher button", timeout_s: 10, optional: true}
      - {do: pause, ms: 1500}
      - {do: click, selector: "[role=menuitemradio]:has-text('Neon'), [role=menuitem]:has-text('Neon')", timeout_s: 10, optional: true}
      - {do: pause, ms: 1500}
      - {do: press, selector: "body", key: Escape, optional: true}
      - {do: click, selector: "[data-test-id=bard-mode-menu-button], bard-mode-switcher button", timeout_s: 10, optional: true}
      - {do: pause, ms: 1200}
      - {do: click, selector: "[role=menuitem]:has-text('اندیشگر'), [role=menuitem]:has-text('Thinking')", timeout_s: 6, optional: true}
      - {do: pause, ms: 1200}
      - {do: click, selector: "[role=menuitemradio]:has-text('بالا'), [role=menuitemradio]:has-text('High')", timeout_s: 6, optional: true}
      - {do: pause, ms: 1200}
      - {do: press, selector: "body", key: Escape, optional: true}
      - {do: pause, ms: 800}
      - {do: fill, selector: "rich-textarea div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "rich-textarea div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "button[aria-label='Stop response'], button[aria-label*='توقف']", timeout_s: 20, optional: true}
      - {do: wait_gone, selector: "button[aria-label='Stop response'], button[aria-label*='توقف']", timeout_s: 200}
      - {do: wait, selector: "model-response message-actions", timeout_s: 30}
      - {do: read, selector: "model-response message-content"}
  image:
    timeout_s: 180
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: click, selector: "[data-test-id=temp-chat-button]", optional: true}
      - {do: wait, selector: "rich-textarea div[contenteditable=true]", timeout_s: 30}
      # 2026-11-14.1 (owner: «اگر جمنای قراره بسازه مدل آرگون باید بسازه»): the model menu, then
      # «4 Argon» (a chat model; with it chosen, Gemini's own image tool makes the picture); the
      # full-size file through Gemini's download button (checked on the live page 2026-11-14)
      # 2026-11-14.2: .1 failed at the download (TargetClosedError): the steps of the test that
      # worked the same day: short pauses for the menu and before the download (the full-size file
      # is still being fetched when the image shows), and the button by any of its names
      # 2026-11-27.2 (seen live, signed in): the menu = menuitemradio «4 Neon» … plus a SUBMENU
      # «سطح «اندیشگر»» holding پایین / متوسط / بالا. The old steps looked for «بالا» in the main menu,
      # missed, and the second menu click CLOSED the still-open menu, so Neon was never found (10:click).
      # Now: Neon first (required), then the thinking submenu → «بالا» (optional), then Escape.
      - {do: pause, ms: 2000}
      - {do: click, selector: "[data-test-id=bard-mode-menu-button], bard-mode-switcher button", timeout_s: 10}
      - {do: pause, ms: 1500}
      - {do: click, selector: "[role=menuitemradio]:has-text('Neon'), [role=menuitem]:has-text('Neon'), [role=menuitemradio]:has-text('Argon'), [role=menuitem]:has-text('Argon')", timeout_s: 10}
      - {do: pause, ms: 1500}
      - {do: press, selector: "body", key: Escape, optional: true}
      - {do: click, selector: "[data-test-id=bard-mode-menu-button], bard-mode-switcher button", timeout_s: 10, optional: true}
      - {do: pause, ms: 1200}
      - {do: click, selector: "[role=menuitem]:has-text('اندیشگر'), [role=menuitem]:has-text('Thinking')", timeout_s: 6, optional: true}
      - {do: pause, ms: 1200}
      - {do: click, selector: "[role=menuitemradio]:has-text('بالا'), [role=menuitemradio]:has-text('High')", timeout_s: 6, optional: true}
      - {do: pause, ms: 1200}
      - {do: press, selector: "body", key: Escape, optional: true}
      - {do: pause, ms: 800}
      - {do: fill, selector: "rich-textarea div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "rich-textarea div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "generated-image img, single-image img.image", timeout_s: 140}
      - {do: pause, ms: 3000}
      # 2026-11-15.4: the night of 11-14 every image failed at the download: Gemini revokes the
      # picture's blob: URL once it is drawn (fetching it fails), and its download button closed the
      # page (TargetClosedError). The shown picture is now taken from its own pixels at its natural
      # size (browser-web's download_image, 2026-11-15); the download button is not used.
      # 2026-11-15.7 = .4 again after diagnostic calls .5/.6: the button's full-size download takes
      # the whole browser down 5-10 s after the click (its profile lock left behind; browser-web's
      # memory at its 1 GiB ceiling), so the shown picture stays the answer (572x1024 for now).
      - {do: download_image, selector: "generated-image img, single-image img.image", attr: src, timeout_s: 30}
  video:
    timeout_s: 600
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: click, selector: "[data-test-id=temp-chat-button]", optional: true}
      - {do: wait, selector: "rich-textarea div[contenteditable=true]", timeout_s: 30}
      - {do: fill, selector: "rich-textarea div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "rich-textarea div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "button[aria-label='Download video'], button[aria-label*='دانلود'][aria-label*='وید']", timeout_s: 590}
      - {do: download, selector: "button[aria-label='Download video'], button[aria-label*='دانلود'][aria-label*='وید']", timeout_s: 60}
