# Gemini in the hub's signed-in browser profile `gemini-web` (prompt 12
# §9.1.5, contract §21.13): text, images and short videos (at most 10 s) on
# the owner's Google AI Pro plan. A reviewed file.
# The selectors are written against gemini.google.com as documented on
# 2026-10-22; a failing step falls back to one Claude run with web.browse on
# this profile, which proposes the fix here.
# 2026-10-31 (prompt 19), checked on the live site: the profile opens with
# locale fa-IR, so Gemini's labels are Persian and `aria-label='Send message'`
# matched nothing (every council call failed at 4:click). Each label selector
# now takes the English and the Persian label; the send button's Persian one
# («ارسال…») was seen live, the stop button's («توقف…») is Gemini's own wording,
# not yet seen (it shows only while an answer is being written).
# 2026-10-31.2: the first test call filled the box but the click on the send
# button sent nothing (the hub's own screenshot: the text still in the box), so
# the prompt goes with Enter in the box (no label, any language). An answer is
# read only once its action bar (message-actions) shows, so a stop button that
# is never matched cannot hand back half an answer.
key: gemini-web
version: "2026-10-31.3"
site: gemini.google.com
start_url: "https://gemini.google.com/app"
hosts:
  - gemini.google.com
  - gstatic.com
  - googleusercontent.com
  - apis.google.com
  - www.google.com
  # 2026-10-31 (owner's order): what Gemini sends a prompt through, refused
  # until now in the job and in the sign-in window (egress log): its own API,
  # its anti-abuse check and its live channel, and Google's client log.
  - geminiweb-pa.clients6.google.com
  - waa-pa.clients6.google.com
  - signaler-pa.clients6.google.com
  - play.google.com
login_hosts:
  - accounts.google.com
  # Google's consent pages after sign-in (the EU consent, the account bar)
  - gds.google.com
  - consent.google.com
  - ogs.google.com
  # Google sets the sign-in cookie on the country domain of the hub's IP too (Germany)
  - accounts.google.de
  - accounts.youtube.com
  - myaccount.google.com
expired:
  url_contains: ["accounts.google.com", "ServiceLogin"]
  hosts: [accounts.google.com]
  selectors:
    - "a[href*='ServiceLogin']"
    - "a:has-text('Sign in')"
tasks:
  text:
    timeout_s: 240
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: click, selector: "[data-test-id=temp-chat-button]", optional: true}
      - {do: wait, selector: "rich-textarea div[contenteditable=true]", timeout_s: 30}
      - {do: fill, selector: "rich-textarea div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "rich-textarea div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "button[aria-label='Stop response'], button[aria-label*='توقف']", timeout_s: 20, optional: true}
      - {do: wait_gone, selector: "button[aria-label='Stop response'], button[aria-label*='توقف']", timeout_s: 200}
      - {do: wait, selector: "model-response message-actions", timeout_s: 30}
      - {do: read, selector: "model-response message-content"}
  image:
    timeout_s: 180
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: click, selector: "[data-test-id=temp-chat-button]", optional: true}
      - {do: wait, selector: "rich-textarea div[contenteditable=true]", timeout_s: 30}
      - {do: fill, selector: "rich-textarea div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "rich-textarea div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "generated-image img", timeout_s: 170}
      - {do: download_image, selector: "generated-image img", attr: src}
  video:
    timeout_s: 600
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: click, selector: "[data-test-id=temp-chat-button]", optional: true}
      - {do: wait, selector: "rich-textarea div[contenteditable=true]", timeout_s: 30}
      - {do: fill, selector: "rich-textarea div[contenteditable=true]", text: "{prompt}"}
      - {do: press, selector: "rich-textarea div[contenteditable=true]", key: Enter}
      - {do: wait, selector: "button[aria-label='Download video']", timeout_s: 590}
      - {do: download, selector: "button[aria-label='Download video']", timeout_s: 60}
