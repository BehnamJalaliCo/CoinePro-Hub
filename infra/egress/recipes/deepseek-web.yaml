# DeepSeek's free chat in the hub's signed-in browser profile `deepseek-web`
# (prompt 12 §9.1.5, contract §21.13): text only (seats quick_search and
# third_opinion). Owner's decision 2026-10-22: only two features of the site,
# ALWAYS on: deep thinking ("DeepThink") and web search; nothing else of the
# site is used. A reviewed file.
# The selectors are written against chat.deepseek.com as documented on
# 2026-10-22; a failing step falls back to one Claude run with web.browse on
# this profile, which proposes the fix here.
# 2026-10-31 (prompt 19), checked on the live site: the profile opens with
# locale fa-IR, so the toggles read «تفکر عمیق» and «جستجو», and they are not
# role=button (every council call failed at 2:click_unless). They carry
# aria-pressed, which now finds them and their state, in English or Persian.
# 2026-10-31.2: with .1 three calls came back "done" in 3-4 s holding the
# half-written thinking (deep thinking writes its own .ds-markdown first, and
# the 'Stop' button never matched). An answer is read only once the action bar
# under the answer (the message with the thinking block) shows; checked on a
# finished chat of the profile. The read takes the last .ds-markdown: the answer.
key: deepseek-web
version: "2026-10-31.2"
site: chat.deepseek.com
start_url: "https://chat.deepseek.com/"
hosts:
  - chat.deepseek.com
  - deepseek.com
  - challenges.cloudflare.com
  # DeepSeek's captcha and risk checks (hCaptcha, AWS WAF, Shumei): without them
  # the login says "Captcha failed to load" and a chat may be refused.
  - hcaptcha.com
  - awswaf.com
  - fengkongcloud.com
login_hosts:
  - accounts.google.com
  # Google's consent pages after sign-in (the EU consent, the account bar)
  - gds.google.com
  - consent.google.com
  - ogs.google.com
  # Google sets the sign-in cookie on the country domain of the hub's IP too (Germany)
  - accounts.google.de
  - cdn-apple.com
  - gstatic.com
  - appleid.apple.com
features: [deep_thinking, web_search]
expired:
  url_contains: ["/sign_in", "/login"]
  selectors:
    - "input[type=password]"
    - "button:has-text('Log in')"
tasks:
  text:
    timeout_s: 300
    steps:
      - {do: goto, url: "{start_url}"}
      - {do: wait, selector: "textarea", timeout_s: 30}
      # Both toggles on for every job (clicked only while off).
      - do: click_unless
        selector: "[aria-pressed]:has-text('DeepThink'), [aria-pressed]:has-text('تفکر عمیق')"
        unless: "[aria-pressed=true]:has-text('DeepThink'), [aria-pressed=true]:has-text('تفکر عمیق')"
      - do: click_unless
        selector: "[aria-pressed]:has-text('Search'), [aria-pressed]:has-text('جستجو')"
        unless: "[aria-pressed=true]:has-text('Search'), [aria-pressed=true]:has-text('جستجو')"
      - {do: fill, selector: "textarea", text: "{prompt}"}
      - {do: press, selector: "textarea", key: Enter}
      - {do: wait, selector: ".ds-markdown", timeout_s: 120}
      - {do: wait, selector: ".ds-message:has([class*=ds-think]) + div div[role=button]", timeout_s: 280}
      - {do: read, selector: ".ds-markdown"}
