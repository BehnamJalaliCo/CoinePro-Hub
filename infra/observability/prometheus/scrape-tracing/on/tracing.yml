# Scrape jobs of the opt-in profile "tracing" (review 7.1 §0.2): mounted only
# while HQ_TRACING=on (hq.sh sets HQ_TRACING_SCRAPE=on).
scrape_configs:
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
