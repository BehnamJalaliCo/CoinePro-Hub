# Scrape jobs for services that run in every profile.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node-exporter runs on the host network, bound to the hq-internal gateway.
  - job_name: node
    static_configs:
      - targets: ["172.30.0.1:9100"]
        labels:
          instance: hub

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: temporal
    static_configs:
      - targets: ["temporal:9090"]

  - job_name: openbao
    metrics_path: /v1/sys/metrics
    params:
      format: [prometheus]
    static_configs:
      - targets: ["openbao:8200"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # LLM layer (prompt 03): /metrics needs the metrics bearer token too.
  - job_name: llm-router
    authorization:
      credentials_file: /etc/prometheus/secrets/llm-metrics.token
    static_configs:
      - targets: ["llm-router:8000"]

  - job_name: claude-runtime
    authorization:
      credentials_file: /etc/prometheus/secrets/llm-metrics.token
    static_configs:
      - targets: ["claude-runtime:8100"]
