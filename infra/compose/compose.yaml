# CoinePro HQ — platform foundation (prompt 02).
# Always run through infra/compose/hq.sh (or make): it selects the memory
# profile and loads profiles/<profile>.env + .env.
#
# House rules for every long-running service:
#   official image with a pinned version, restart unless-stopped, a
#   healthcheck, a memory limit, named volumes, network hq-internal, and
#   ports published on 127.0.0.1 only. The single exception is Caddy (80/443).
# Documented exceptions:
#   - hq-tools, temporal-schema, temporal-namespace, db-provision,
#     llm-migrate and api-migrate are one-shot jobs (restart "no", no healthcheck).
#   - claude-runtime sits only on hq-llm (llm-router, OpenBao, Prometheus):
#     it can reach the internet for the Claude API but not the data services.
#   - hq-core (prompt 04.1): Temporal (unauthenticated on 7233) is reachable
#     only from api, worker, Temporal's own tooling, Prometheus (Temporal
#     metrics) and Postgres (Temporal's database).
#   - hq-agent (prompt 05.1 §2.9): the agents' tool path and its policy:
#     worker -> gateway -> api (/internal/v1) and OPA. The gateway sits only
#     here: it reaches neither Temporal, the data services nor OpenBao. OPA
#     sits only here (api, worker and gateway are its only clients).
#   - hq-edge (prompt 05.1 §2.9): Caddy and the web panel only. The web
#     (Next.js, internet-facing) reaches nothing but Caddy.
#   - hq-stt (prompt 06 §3): the worker and stt only, internal; stt-fetch (the
#     one model download) alone on hq-fetch, which has the internet.
#   - hq-agent and hq-edge are internal (no route out of the host); nothing on
#     hq-internal reaches Temporal, OPA or the gateway
#     (scripts/quality/compose-rules.sh and live.sh check all of it).
#   - node-exporter uses the host network (to see the host's real NICs) and
#     listens only on the hq-internal gateway 172.30.0.1, never on 0.0.0.0.

name: coinepro-hq

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    # Written into every log line so Alloy can label logs without the Docker socket.
    labels: "com.docker.compose.service,com.docker.compose.project"

x-service: &service
  restart: unless-stopped
  logging: *logging
  networks: [hq-internal]
  security_opt: ["no-new-privileges:true"]

x-job: &job
  restart: "no"
  logging: *logging
  security_opt: ["no-new-privileges:true"]

services:
  # ---------------------------------------------------------------- helpers --
  hq-tools:
    # Copies a static busybox into a volume so distroless images (Loki,
    # Tempo, otel-collector) and Alloy can run an HTTP healthcheck.
    <<: *job
    image: busybox:1.38.0-musl
    network_mode: none
    command: ["cp", "/bin/busybox", "/hq-tools/busybox"]
    volumes:
      - hq-tools:/hq-tools
    deploy:
      resources:
        limits:
          memory: ${MEM_HQ_TOOLS:?}

  backup-tools:
    # The one-shot backup image (restic + rclone, prompt 07 §1), defined here
    # for its build and its limit; infra/backup/hourly.sh runs it with
    # `docker run` and this limit (and a network only when a remote is set).
    # Its own profile (7.1 §3): no service depends on it, so `up --wait`
    # never starts it (`make up` builds and checks it); the quality gates
    # always count it in the memory budget (scripts/quality/lib.sh).
    <<: *job
    profiles: [backup-tools]
    image: coinepro-hq/backup:0.1.0
    build: ../backup
    network_mode: none
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    command: ["restic", "version"]
    deploy:
      resources:
        limits:
          memory: ${MEM_BACKUP:?}

  # ------------------------------------------------------------------- data --
  postgres:
    <<: *service
    # The pinned pgvector image + WAL-G (prompt 07 §1: continuous archiving, PITR).
    image: coinepro-hq/postgres:0.1.0
    build: ../postgres
    # hq-core: Temporal's database.
    networks: [hq-internal, hq-core]
    environment:
      # WAL-G (archive_command below; base backups by infra/backup/hourly.sh):
      # the local repository on the bind mount, compressed, never sent from here.
      WALG_FILE_PREFIX: /wal
      WALG_COMPRESSION_METHOD: zstd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Read once by initdb/10-databases.sh on first start (empty volume).
      HQ_DB_PASSWORD: ${HQ_DB_PASSWORD:?run make env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?run make env}
      TEMPORAL_VISIBILITY_DB_PASSWORD: ${TEMPORAL_VISIBILITY_DB_PASSWORD:?run make env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:?}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:?}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:?}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:?}
      - -c
      - work_mem=${PG_WORK_MEM:?}
      - -c
      - log_min_duration_statement=1000
      # Statement parameters (message bodies, notes) never reach the logs.
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      # Continuous WAL archiving (prompt 07 §1): every segment to /wal through
      # WAL-G, and a segment at least every minute, so point-in-time recovery
      # reaches any minute the base backups still cover.
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/wal-g wal-push %p
      - -c
      - archive_timeout=60s
    shm_size: 256mb
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ../postgres/initdb:/docker-entrypoint-initdb.d:ro
      # uid 999 (postgres), 0700; created by `make bootstrap`, checked by `make up`.
      - ${HQ_BACKUP_DIR:-/home/Hub/backups}/wal:/wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_POSTGRES:?}

  valkey:
    <<: *service
    image: valkey/valkey:8.1.10-alpine
    user: valkey
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?run make env}
      VALKEY_MAXMEMORY: ${VALKEY_MAXMEMORY:?}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?run make env}
    # requirepass and maxmemory are fed on stdin so they never appear in argv.
    command:
      - sh
      - -c
      - |
        exec valkey-server /usr/local/etc/valkey/valkey.conf - <<EOF
        requirepass $${VALKEY_PASSWORD}
        maxmemory $${VALKEY_MAXMEMORY}
        EOF
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_VALKEY:?}

  nats:
    <<: *service
    image: nats:2.15.1-alpine
    environment:
      NATS_PASSWORD: ${NATS_PASSWORD:?run make env}
      GOMEMLIMIT: ${GOMEMLIMIT_NATS:?}
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - ../nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_NATS:?}

  # --------------------------------------------------------------- temporal --
  temporal-schema:
    # Official production path: temporal-sql-tool setup-schema + update-schema.
    # Idempotent, so it runs on every `up` and also applies schema upgrades.
    <<: *job
    image: temporalio/admin-tools:1.32.1
    networks: [hq-internal]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?run make env}
      TEMPORAL_VISIBILITY_DB_PASSWORD: ${TEMPORAL_VISIBILITY_DB_PASSWORD:?run make env}
    entrypoint: ["/bin/sh", "/hq/schema-setup.sh"]
    volumes:
      - ../temporal/schema-setup.sh:/hq/schema-setup.sh:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPORAL_SCHEMA:?}

  temporal:
    <<: *service
    image: temporalio/server:1.32.1
    networks: [hq-core]
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:?run make env}
      VISIBILITY_DBNAME: temporal_visibility
      VISIBILITY_POSTGRES_USER: temporal_visibility
      VISIBILITY_POSTGRES_PWD: ${TEMPORAL_VISIBILITY_DB_PASSWORD:?run make env}
      # Fixed for the life of the cluster; 512 is Temporal's usual production size.
      NUM_HISTORY_SHARDS: "512"
      BIND_ON_IP: 0.0.0.0
      PROMETHEUS_ENDPOINT: 0.0.0.0:9090
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/hq.yaml
      LOG_LEVEL: warn
      GOMEMLIMIT: ${GOMEMLIMIT_TEMPORAL:?}
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ../temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7243/api/v1/cluster-info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPORAL:?}

  temporal-namespace:
    # Registers the "default" namespace once (no-op when it exists).
    <<: *job
    image: temporalio/admin-tools:1.32.1
    networks: [hq-core]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        temporal operator namespace describe --namespace default >/dev/null 2>&1
        || temporal operator namespace create --namespace default --retention 72h
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPORAL_NAMESPACE:?}

  temporal-ui:
    <<: *service
    image: temporalio/ui:2.56.0
    networks: [hq-core]
    depends_on:
      temporal:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8080"
      TEMPORAL_DEFAULT_NAMESPACE: default
    ports:
      - "127.0.0.1:8233:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPORAL_UI:?}

  # ---------------------------------------------------------------- secrets --
  openbao:
    <<: *service
    image: openbao/openbao:2.7.1
    # hq-prov: the provisioner's AppRole (bound to 172.30.10.0/24, prompt 09).
    networks: [hq-internal, hq-llm, hq-prov, hq-tts]
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_CHOWN: "true"
      SKIP_SETCAP: "true"
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ../openbao/config.hcl:/openbao/config/config.hcl:ro
      - openbao-data:/openbao/file
    # Healthy = initialised AND unsealed (`bao status` exits 2 while sealed).
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_OPENBAO:?}

  # ------------------------------------------------------------- llm layer --
  db-provision:
    # Superuser role provisioning (idempotent): hq_llm_writer/reader, llm_router.
    <<: *job
    image: pgvector/pgvector:0.8.7-pg17
    networks: [hq-internal]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make env}
      LLM_ROUTER_DB_PASSWORD: ${LLM_ROUTER_DB_PASSWORD:?run make env}
      HQ_API_DB_PASSWORD: ${HQ_API_DB_PASSWORD:?run make env}
      HQ_WORKER_DB_PASSWORD: ${HQ_WORKER_DB_PASSWORD:?run make env}
    entrypoint: ["bash", "/hq/provision.sh"]
    volumes:
      - ../postgres/provision.sh:/hq/provision.sh:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_DB_PROVISION:?}

  llm-migrate:
    # Alembic upgrade + seed + monthly partitions, as the database owner (hq).
    <<: *job
    image: coinepro-hq/llm-router:0.1.0
    build:
      context: ../../services
      dockerfile: llm-router/Dockerfile
    networks: [hq-internal]
    depends_on:
      db-provision:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USER: hq
      DB_PASSWORD: ${HQ_DB_PASSWORD:?run make env}
    command: ["python", "-m", "llm_router.migrate"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: ${MEM_LLM_MIGRATE:?}

  llm-router:
    # The single path for every model call. Internal only: no published port.
    <<: *service
    image: coinepro-hq/llm-router:0.1.0
    build:
      context: ../../services
      dockerfile: llm-router/Dockerfile
    networks: [hq-internal, hq-llm]
    depends_on:
      llm-migrate:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      openbao:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: llm_router
      DB_PASSWORD: ${LLM_ROUTER_DB_PASSWORD:?run make env}
      NATS_URL: nats://nats:4222
      NATS_USER: hq
      NATS_PASSWORD: ${NATS_PASSWORD:?run make env}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/secrets/hq/approle.json
      RUNTIME_URL: http://claude-runtime:8100
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:?}
      LLM_RESERVED_HIGH: "1"
      # The oversight share of the agents' daily cap (prompt 08 §2.3).
      AGENT_DAILY_TOKEN_CAP: ${AGENT_DAILY_TOKEN_CAP:-2000000}
      OVERSIGHT_DAILY_SHARE: ${OVERSIGHT_DAILY_SHARE:-0.2}
      # Prompt 11 §1.2: all meeting turns of a UTC day (not the war room) share this part of the cap.
      MEETINGS_DAILY_SHARE: ${MEETINGS_DAILY_SHARE:-0.15}
      # Prompt 12 §15: the owner zone's automatic runs (advisor, librarian, digital CEO).
      OWNER_ZONE_DAILY_SHARE: ${OWNER_ZONE_DAILY_SHARE:-0.25}
      # Prompt 10 §4.3: one company's support drafts per UTC day (scope support_draft:<company>).
      SUPPORT_DRAFT_DAILY_TOKENS: ${SUPPORT_DRAFT_DAILY_TOKENS:-60000}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/llm-router:/run/secrets/hq:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_LLM_ROUTER:?}

  claude-runtime:
    # Claude subscription via the Agent SDK. Reachable only from llm-router.
    <<: *service
    image: coinepro-hq/claude-runtime:0.1.0
    build:
      context: ../../services
      dockerfile: claude-runtime/Dockerfile
    networks: [hq-llm]
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/secrets/hq/approle.json
      RUNTIME_MAX_CONCURRENCY: ${RUNTIME_MAX_CONCURRENCY:?}
    user: "10001:10001"
    read_only: true
    # Per-run work dirs and the CLI's HOME live here and are wiped after each run.
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/claude-runtime:/run/secrets/hq:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_CLAUDE_RUNTIME:?}

  # ------------------------------------------------------------- core (p04) --
  api-migrate:
    # Alembic (version table alembic_version_api) + YAML seed, as the owner hq.
    <<: *job
    image: coinepro-hq/api:0.1.0
    build:
      context: ../../apps/api
      additional_contexts:
        services: ../../services
    networks: [hq-internal]
    depends_on:
      llm-migrate:
        condition: service_completed_successfully
    environment:
      DB_HOST: postgres
      DB_USER: hq
      DB_PASSWORD: ${HQ_DB_PASSWORD:?run make env}
      # The seed reads agents/ too (prompt 08 §6-§7: skills, curricula, eval suites).
      HQ_AGENTS_DIR: /app/agents
      # ... and the companies' flat marks (prompt 9.1 §5: version 1 of each brand).
      HQ_BRANDS_DIR: /app/design/brand/companies
    command: ["python", "-m", "hq_api.migrate"]
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ../../agents:/app/agents:ro
      - ../../design/brand/companies:/app/design/brand/companies:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_API_MIGRATE:?}

  opa:
    # Policies of infra/opa/policy (decisions, action classes, internal API).
    # The api is fail-closed: no answer from OPA means "denied".
    <<: *service
    image: ${OPA_IMAGE:?use hq.sh}
    # Only api, worker and gateway (hq-agent) reach it. --authorization=basic
    # with system.authz (infra/opa/policy/authz.rego): POST /v1/data/hq/... and
    # GET /health only; policies and data come from files, never over HTTP.
    networks: [hq-agent]
    depends_on:
      hq-tools:
        condition: service_completed_successfully
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --authorization=basic
      - --log-level=error
      - --disable-telemetry
      - /policy
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ../opa/policy:/policy:ro
      - hq-tools:/hq-tools:ro
    healthcheck:
      test: ["CMD", "/hq-tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MEM_OPA:?}

  api:
    # /api/v1 (behind Caddy, only with a domain) and /internal/v1 (hq-internal).
    <<: *service
    image: coinepro-hq/api:0.1.0
    # hq-internal: Caddy, NATS, OpenBao (AppRole bound to 172.30.0.0/24);
    # hq-core: Temporal; hq-agent: OPA and the gateway's calls to /internal/v1;
    # hq-prov: the provisioner (prompt 09) and its calls to /internal/v1.
    # hq-tts: the TTS one-shot's calls to /internal/v1/tts (prompt 12 §4).
    networks: [hq-internal, hq-core, hq-agent, hq-prov, hq-tts]
    build:
      context: ../../apps/api
      additional_contexts:
        services: ../../services
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      openbao:
        condition: service_healthy
      opa:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment: &api-env
      DB_HOST: postgres
      DB_USER: hq_api
      DB_PASSWORD: ${HQ_API_DB_PASSWORD:?run make env}
      NATS_URL: nats://nats:4222
      NATS_USER: hq
      NATS_PASSWORD: ${NATS_PASSWORD:?run make env}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/secrets/hq/approle.json
      OPA_URL: http://opa:8181
      TEMPORAL_ADDRESS: temporal:7233
      HQ_PUBLIC_ORIGIN: ${HQ_PUBLIC_ORIGIN:-}
      # The Android app's passkey origin(s), comma separated: the PUBLIC hash of
      # its signing certificate (prompt 6 §1.2), not a secret.
      HQ_ANDROID_ORIGINS: ${HQ_ANDROID_ORIGINS:-}
      HQ_WEBAUTHN_RP_ID: ${HQ_WEBAUTHN_RP_ID:-}
      HQ_FILES_ROOT: /data/files
      # Audit chain anchors (prompt 04.1 §1.11): the worker appends, the api reads.
      HQ_AUDIT_ANCHOR_FILE: /anchors/audit-chain.jsonl
      # Role charters (agents/, read-only; prompt 05).
      HQ_AGENTS_DIR: /app/agents
      # The provisioner (prompt 09, opt-in profile "provisioning"): hq.sh sets it
      # while HQ_PROVISIONING=on, else empty (pricing and builds wait).
      PROVISIONER_URL: ${PROVISIONER_URL:-}
      # Prompt 12 §14: MCP servers in containers (opt-in profile "mcp",
      # infra/compose/mcp.yaml): hq.sh sets MCP_CONTAINERS=on only while
      # HQ_MCP=on and it fits the memory budget; the reviewed allow-list
      # (infra/mcp/servers.yaml) is mounted read-only.
      MCP_CONTAINERS: ${MCP_CONTAINERS:-off}
      HQ_MCP_ALLOWLIST: /app/mcp/servers.yaml
      # Prompt 10 (contract §19): support, referral checks, the revenue radar, intake.
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-180}
      SUPPORT_DRAFT_DAILY_TOKENS: ${SUPPORT_DRAFT_DAILY_TOKENS:-60000}
      SUPPORT_DAILY_OUTBOUND_CAP: ${SUPPORT_DAILY_OUTBOUND_CAP:-300}
      SUPPORT_AUTO_REPLIES_PER_HOUR: ${SUPPORT_AUTO_REPLIES_PER_HOUR:-20}
      SUPPORT_HANDOFF_DIGEST_MIN: ${SUPPORT_HANDOFF_DIGEST_MIN:-30}
      REFERRAL_CHECKS_PER_HOUR: ${REFERRAL_CHECKS_PER_HOUR:-30}
      REFERRAL_CHECK_CACHE_S: ${REFERRAL_CHECK_CACHE_S:-600}
      REVENUE_BACKFILL_DAYS: ${REVENUE_BACKFILL_DAYS:-90}
      REVENUE_PULL_MAX_DAYS: ${REVENUE_PULL_MAX_DAYS:-31}
      INTAKE_MAX_SKEW_S: ${INTAKE_MAX_SKEW_S:-300}
      # Prompt 12 (contract §21.0, §21.7): the owner zone's share (the api defers
      # what no longer fits) and the route a new connection's secret may take.
      AGENT_DAILY_TOKEN_CAP: ${AGENT_DAILY_TOKEN_CAP:-2000000}
      OWNER_ZONE_DAILY_SHARE: ${OWNER_ZONE_DAILY_SHARE:-0.25}
      CONNECTION_SECRET_ROUTE: ${CONNECTION_SECRET_ROUTE:-api}
      # Prompt 12 §9.1: hq.sh sets it on only while the substitutes runner's
      # opt-in profile is on and fits the memory budget (else the app's CLI
      # sign-in answers 409 not_ready; the owner's terminal still works).
      SUBSTITUTES_RUNNER: ${SUBSTITUTES_RUNNER:-off}
      # Prompt 12 part B: the Persian voice is on only while the opt-in profile
      # "tts" runs (hq.sh sets HQ_TTS_ACTIVE); else briefings are text only.
      HQ_TTS: ${HQ_TTS_ACTIVE:-off}
      HQ_TTS_VOICE: ${HQ_TTS_VOICE:-fa_IR-amir-medium}
      # The deploy card's diff (§21.6): mirrors of the workspaces' repositories.
      HQ_GIT_MIRRORS: /var/lib/hq-git
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/hq-api:/run/secrets/hq:ro
      - hq-files:/data/files
      - ${HQ_BACKUP_DIR:-/home/Hub/backups}/audit-anchors:/anchors:ro
      - ../../agents:/app/agents:ro
      - ../mcp/servers.yaml:/app/mcp/servers.yaml:ro
      # Mirrors for the deploy card's diff (prompt 12 §7): rebuilt by a fetch if lost.
      - hq-git:/var/lib/hq-git
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_API:?}

  worker:
    # Temporal worker (task queue hq-core) + the NATS bridge into HQ_CORE.
    <<: *service
    image: coinepro-hq/api:0.1.0
    # hq-core: Temporal; hq-agent: OPA and the Tool Gateway; hq-stt: speech to text;
    # hq-egress-api: the support desk's sends through egress (prompt 10 §4.2,
    # POST /v1/support/send; egress's own client check covers that subnet).
    networks: [hq-internal, hq-core, hq-agent, hq-stt, hq-egress-api]
    depends_on:
      api:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    command: ["python", "-m", "hq_api.worker"]
    environment:
      <<: *api-env
      DB_USER: hq_worker
      DB_PASSWORD: ${HQ_WORKER_DB_PASSWORD:?run make env}
      # The agent runtime (prompt 05): llm-router, the Tool Gateway, the api's
      # live replies, Prometheus (health.hub) and the backup status files.
      LLM_ROUTER_URL: http://llm-router:8000
      GATEWAY_URL: http://gateway:8080
      HQ_API_INTERNAL_URL: http://api:8000
      PROMETHEUS_URL: http://prometheus:9090
      HQ_HUB_STATUS_DIR: /hub-status
      AGENT_DAILY_TOKEN_CAP: ${AGENT_DAILY_TOKEN_CAP:-2000000}
      OVERSIGHT_DAILY_SHARE: ${OVERSIGHT_DAILY_SHARE:-0.2}
      # Prompt 11 §1.2: the meetings' share of the daily cap (a meeting that does not fit is `written`).
      MEETINGS_DAILY_SHARE: ${MEETINGS_DAILY_SHARE:-0.15}
      OWNER_ZONE_DAILY_SHARE: ${OWNER_ZONE_DAILY_SHARE:-0.25}
      HQ_CEO_DAILY_REPORTS: ${HQ_CEO_DAILY_REPORTS:-off}
      HQ_MORNING_REPORT_LLM: ${HQ_MORNING_REPORT_LLM:-on}
      # Owner media (prompt 6 §2-§3): the file store (posters, key frames, sound
      # tracks); the speech recogniser: hq.sh sets STT_URL while HQ_STT=on, else empty.
      HQ_FILES_ROOT: /data/files
      STT_URL: ${STT_URL:-}
      STT_PUNCTUATION: ${STT_PUNCTUATION:-on}
      # Prompt 10 §4.2: support sends leave through egress (a channel's secret
      # is read from OpenBao for one call and handed to egress only).
      SUPPORT_EGRESS_URL: http://egress:8090
      # Prompt 12 §9.1: a creative's Persian overlay is set in IRANYekanX by code.
      HQ_FONTS_DIR: /app/fonts
      # Prompt 12 §2.1: the corpus of «از هاب بپرس»: the hub's repository (its git
      # directory, read-only: committed files only) and the workspaces' mirrors.
      HQ_HUB_REPO: /hub-repo.git
      HQ_GIT_MIRRORS: /var/lib/hq-git
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/hq-worker:/run/secrets/hq:ro
      - hq-files:/data/files
      - ../../design/fonts/static:/app/fonts:ro
      # Append-only anchor file of the audit chain, outside the Postgres volume
      # and inside the backup set (created by `make bootstrap`, owner uid 10001).
      - ${HQ_BACKUP_DIR:-/home/Hub/backups}/audit-anchors:/anchors
      - ${HQ_BACKUP_DIR:-/home/Hub/backups}/status:/hub-status:ro
      - ../../agents:/app/agents:ro
      - ../../.git:/hub-repo.git:ro
      - hq-git:/var/lib/hq-git
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_WORKER:?}

  gateway:
    # Tool Gateway (prompt 05 §3): every action of an agent goes through here,
    # with the run's own agent token, to the api's /internal/v1. hq-agent only
    # (prompt 05.1 §2.9): it reaches the api and OPA, never Temporal, Postgres,
    # NATS, Valkey or OpenBao, and has no route out of the host; only the
    # worker calls it.
    <<: *service
    image: coinepro-hq/gateway:0.1.0
    build:
      context: ../../services
      dockerfile: gateway/Dockerfile
    # hq-mcp (prompt 12 §14): the MCP servers in containers, straight to
    # http://mcp-<key>:8080/mcp (no egress); nothing else of the hub is on it.
    networks: [hq-agent, hq-egress-api, hq-mcp]
    depends_on:
      api:
        condition: service_healthy
      opa:
        condition: service_healthy
      egress:
        condition: service_healthy
    environment:
      GATEWAY_API_URL: http://api:8000
      OPA_URL: http://opa:8181
      # The internet tools (prompt 07 §2) and the MCP servers' HTTP route out
      # (an `http` MCP server only through this proxy, prompt 07 §3).
      EGRESS_URL: http://egress:8090
      EGRESS_PROXY_URL: http://egress:3129
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      # Only the SHA-256 of the worker's token (600, uid 10001), installed by make up.
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/gateway:/run/secrets/hq:ro
      - ../../agents:/app/agents:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_GATEWAY:?}

  egress:
    # The agents' only way to the internet (prompt 07 §2, contract §18.7): the
    # web tools and MCP servers over HTTP, through its SSRF guard (every name
    # resolved and every address and redirect checked here). hq-egress is its
    # route out (with SearXNG); hq-egress-api has the gateway only; hq-browser
    # the browser only. It reaches no data service, the api, OpenBao, NATS or
    # Temporal (scripts/quality/live.sh), and holds no secret of its own.
    <<: *service
    image: coinepro-hq/egress:0.1.0
    build:
      context: ../../services
      dockerfile: egress/Dockerfile
    # hq-prov-out: the provisioner's way to api.hetzner.cloud (prompt 09).
    # Prompt 12 §9.1: hq-subs (the substitute runner's CLI hosts), hq-browser-web
    # (the profile browser) and hq-web-login (the owner's sign-in window).
    networks: [hq-egress, hq-egress-api, hq-browser, hq-prov-out, hq-subs, hq-browser-web, hq-web-login]
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      EGRESS_SEARXNG_URL: http://searxng:8080
      EGRESS_BROWSER_URL: http://browser:8095
      EGRESS_BROWSER_PROXY_URL: http://egress:3128
      # The hub's name and its own addresses (hq.sh: the host's global
      # addresses and what the domain resolves to; prompt 7.1).
      EGRESS_HUB_HOSTS: ${HQ_WEBAUTHN_RP_ID:-hq.coinepro.com},${HQ_HUB_ADDRESSES:-}
      # Parse children at once (each up to 192 MiB, inside MEM_EGRESS).
      EGRESS_PARSE_SLOTS: ${EGRESS_PARSE_SLOTS:-2}
      # The fixed subnets below: the gateway's network and the browser's.
      EGRESS_API_CLIENTS: 172.30.8.0/24
      EGRESS_GATEWAY_PROXY_CLIENTS: 172.30.8.0/24
      EGRESS_BROWSER_PROXY_CLIENTS: 172.30.9.0/24
      EGRESS_PROVISIONER_PROXY_CLIENTS: 172.30.11.0/24
      EGRESS_PROVISIONER_HOSTS: api.hetzner.cloud
      # Prompt 12 §9.1 (contract §21.13): the substitute players. The runner's
      # CLIs reach only their own hosts (EGRESS_SUBSTITUTES_HOSTS, default in
      # hq_egress.config); the profile browser and the sign-in window reach
      # only their recipe's hosts (infra/egress/recipes, reviewed files).
      EGRESS_SUBSTITUTES_PROXY_CLIENTS: 172.30.13.0/24
      EGRESS_WEB_PROXY_CLIENTS: 172.30.14.0/24
      EGRESS_LOGIN_PROXY_CLIENTS: 172.30.15.0/24
      EGRESS_WEB_BROWSER_URL: http://browser-web:8096
      EGRESS_RECIPES_DIR: /recipes
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ../egress/recipes:/recipes:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_EGRESS:?}

  searxng:
    # The holding's own web search (AGPL-3.0), for web.search only: egress is
    # its only client; it reaches the public engines over hq-egress. No query
    # is logged (infra/searxng/settings.yml; granian's access log is off).
    <<: *service
    image: searxng/searxng:2026.10.4-d48c4b555@sha256:76b0bf285aca014c7191fc4d9234c4bfb358624ac33d8883833d496c059ec072
    networks: [hq-egress]
    environment:
      SEARXNG_SECRET: ${SEARXNG_PASSWORD:?run make env}
      GRANIAN_BLOCKING_THREADS: "2"
    user: "977:977"
    read_only: true
    tmpfs:
      - "/tmp:size=16m,mode=1777"
      - "/var/cache/searxng:size=16m,uid=977,gid=977,mode=0700"
    cap_drop: [ALL]
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_SEARXNG:?}

  browser:
    # Headless Chromium (Playwright) for web.browse (prompt 07 §2.1): a fresh
    # context per call, at most BROWSER_MAX_SESSIONS at a time; hq-browser is
    # internal, so its only way out is egress's proxy. Chromium's own sandbox
    # is ON (prompt 7.1): non-root, read-only, every capability dropped, and
    # Playwright's seccomp profile (infra/browser/seccomp_profile.json,
    # microsoft/playwright v1.63.0 utils/docker, sha256 cc3e61ca...7849), which
    # lets Chromium create its user namespaces. SYS_CHROOT is added to the
    # bounding set only so that the profile allows chroot inside them: uid
    # 10001 never holds it, and no-new-privileges stays on.
    <<: *service
    image: coinepro-hq/browser:0.1.0
    build:
      context: ../../services
      dockerfile: egress/Dockerfile.browser
    networks: [hq-browser]
    environment:
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-2}
      BROWSER_SANDBOX: "1"
      BROWSER_JS_HEAP_MB: ${BROWSER_JS_HEAP_MB:-192}
    user: "10001:10001"
    read_only: true
    # Chromium's profile, cache and downloads (counted inside the memory limit).
    tmpfs: ["/tmp:size=${BROWSER_TMPFS:-192m},mode=1777"]
    security_opt: ["no-new-privileges:true", "seccomp=../browser/seccomp_profile.json"]
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    healthcheck:
      test: ["CMD", "python3", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_BROWSER:?}

  web:
    # The owner's web panel (apps/web, owned by the consultation session;
    # Next.js standalone on :3000). Profile "web": on when apps/web/Dockerfile
    # exists (infra/compose/hq.sh); Caddy then sends every path but /api here.
    # hq-edge only (prompt 05.1 §2.9): it is internet-facing, so it reaches
    # Caddy and nothing else (no database, api, NATS, OpenBao, Prometheus).
    <<: *service
    profiles: [web]
    networks: [hq-edge]
    image: coinepro-hq/web:0.1.0
    build:
      context: ../../apps/web
    environment:
      # Empty = the web's own defaults (the owner's app and its signing key; apps/web/README.md).
      HQ_ANDROID_PACKAGES: ${HQ_ANDROID_PACKAGES:-}
      HQ_ANDROID_CERT_SHA256: ${HQ_ANDROID_CERT_SHA256:-}
    user: "10001:10001"
    read_only: true
    # tmpfs is charged to the container's memory: sized per profile so the
    # Node process keeps most of MEM_WEB.
    tmpfs:
      - "/tmp:size=${WEB_TMPFS_TMP:?},mode=1777"
      - "/app/.next/cache:size=${WEB_TMPFS_CACHE:?},uid=10001,gid=10001,mode=0700"
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_WEB:?}

  # ------------------------------------------------------------------- edge --
  caddy:
    <<: *service
    image: caddy:2.11.7-alpine
    # hq-internal: the api (and the ACME route out); hq-edge: the web panel.
    networks: [hq-internal, hq-edge]
    environment:
      # Empty -> ":80" (plain HTTP). A domain here switches on automatic HTTPS.
      HQ_SITE_ADDRESS: ${HQ_SITE_ADDRESS:-:80}
      # "on" only with a domain (infra/compose/hq.sh): /api reaches the api.
      HQ_API_EDGE: ${HQ_API_EDGE:?use hq.sh}
      # "on" when the web panel is built (infra/compose/hq.sh): other paths reach web.
      HQ_WEB: ${HQ_WEB:?use hq.sh}
      # "on" while a canary row of apps/api/seed/sites.yaml is enabled (hq.sh):
      # /__canary answers 503, else 404.
      HQ_CANARY: ${HQ_CANARY:?use hq.sh}
    ports:
      # The only ports published on all interfaces.
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../caddy/api-on.caddy:/etc/caddy/api-on.caddy:ro
      - ../caddy/api-off.caddy:/etc/caddy/api-off.caddy:ro
      - ../caddy/web-on.caddy:/etc/caddy/web-on.caddy:ro
      - ../caddy/web-off.caddy:/etc/caddy/web-off.caddy:ro
      - ../caddy/canary-on.caddy:/etc/caddy/canary-on.caddy:ro
      - ../caddy/canary-off.caddy:/etc/caddy/canary-off.caddy:ro
      - ../caddy/site:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2020/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MEM_CADDY:?}

  # ---------------------------------------------------------- observability --
  prometheus:
    <<: *service
    image: prom/prometheus:v3.15.0
    # hq-core: Temporal's metrics endpoint (temporal:9090).
    networks: [hq-internal, hq-llm, hq-core]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:?}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:?}
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/scrape:/etc/prometheus/scrape:ro
      - ../observability/prometheus/scrape-profile/${HQ_PROFILE:?use hq.sh}:/etc/prometheus/scrape-profile:ro
      # Tempo's and the collector's jobs only while tracing is on (hq.sh).
      - ../observability/prometheus/scrape-tracing/${HQ_TRACING_SCRAPE:-off}:/etc/prometheus/scrape-tracing:ro
      # Alert rules (7.1 §2.4: the backup's dead-man's switch, independent of the worker).
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      # Bearer token for the llm-router / claude-runtime /metrics endpoints.
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/prometheus:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_PROMETHEUS:?}

  loki:
    <<: *service
    image: grafana/loki:3.7.8
    depends_on:
      hq-tools:
        condition: service_completed_successfully
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:?}
      GOMEMLIMIT: ${GOMEMLIMIT_LOKI:?}
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
      - hq-tools:/hq-tools:ro
    healthcheck:
      test: ["CMD", "/hq-tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_LOKI:?}

  alloy:
    # Ships container logs to Loki by reading the json-file logs read-only
    # (no Docker socket).
    <<: *service
    image: grafana/alloy:v1.20.1
    depends_on:
      hq-tools:
        condition: service_completed_successfully
      loki:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    environment:
      GOMEMLIMIT: ${GOMEMLIMIT_ALLOY:?}
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - hq-tools:/hq-tools:ro
    healthcheck:
      test: ["CMD", "/hq-tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:12345/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_ALLOY:?}

  grafana:
    <<: *service
    image: grafana/grafana:13.2.4
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env}
      GF_SERVER_ROOT_URL: http://localhost:3000/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../observability/grafana/provisioning/datasources/${HQ_PROFILE:?use hq.sh}:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_GRAFANA:?}

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=172.30.0.1:9100
      # Basic auth (prompt 07): containers with a route out can reach the
      # host's addresses; only Prometheus has the password (provision.sh).
      - --web.config.file=/etc/node-exporter/web.yml
      # Per-container metrics written on the host (infra/observability/container-metrics.sh).
      - --collector.textfile.directory=/host/var/lib/coinepro-hq/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/node-exporter:/etc/node-exporter:ro
    healthcheck:
      # Up = it answers, and without the password it answers 401.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://172.30.0.1:9100/ 2>&1 | grep -q 401"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${MEM_NODE_EXPORTER:?}

  # ------------------------------- opt-in profile "tracing" (review 7.1) --
  # Tempo and the collector are off by default (no service sends traces yet);
  # `make tracing-on` switches them on (HQ_TRACING=on), in either profile.
  tempo:
    <<: *service
    profiles: [tracing]
    image: grafana/tempo:3.1.0
    depends_on:
      hq-tools:
        condition: service_completed_successfully
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
      - hq-tools:/hq-tools:ro
    healthcheck:
      test: ["CMD", "/hq-tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_TEMPO:?}

  otel-collector:
    <<: *service
    profiles: [tracing]
    image: otel/opentelemetry-collector-contrib:0.162.0
    depends_on:
      hq-tools:
        condition: service_completed_successfully
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ../observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
      - hq-tools:/hq-tools:ro
    healthcheck:
      test: ["CMD", "/hq-tools/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_OTEL_COLLECTOR:?}

  stt-fetch:
    # One-shot (profile "stt", prompt 06 §3): downloads the pinned speech model
    # (services/stt/model.lock.json: repo, revision, size and sha256 of every
    # file) into stt-models once; files already there and correct are skipped.
    # The only part of stt with internet, on a network of its own.
    <<: *job
    profiles: [stt]
    image: coinepro-hq/stt:0.1.0
    build:
      context: ../../services
      dockerfile: stt/Dockerfile
    networks: [hq-fetch]
    command: ["python", "-m", "hq_stt.fetch"]
    environment:
      HF_HUB_OFFLINE: "0"
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - stt-models:/models
    deploy:
      resources:
        limits:
          memory: ${MEM_STT_FETCH:?}

  provisioner:
    # Builds a server the owner sealed (prompt 09 §4, contract §18.8): code,
    # not an agent; the Hetzner Cloud API only, through egress's provisioner
    # listener (CONNECT to api.hetzner.cloud:443). It never touches the hub or
    # a resource without managed-by=coinepro-hq, never deletes, never SSHes.
    # Opt-in (profile "provisioning", HQ_PROVISIONING=on): the owner switches
    # it on with the Hetzner token (make hetzner-token, make owner-ssh-key).
    <<: *service
    profiles: [provisioning]
    image: coinepro-hq/provisioner:0.1.0
    build:
      context: ../../services
      dockerfile: provisioner/Dockerfile
    networks: [hq-prov, hq-prov-out]
    depends_on:
      api:
        condition: service_healthy
      egress:
        condition: service_healthy
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/secrets/hq/approle.json
      HQ_API_INTERNAL_URL: http://api:8000
      # hcloud (requests) goes through egress; nothing else does.
      HTTPS_PROXY: http://egress:3130
      NO_PROXY: api,openbao,localhost,127.0.0.1
      PROVISIONER_API_CLIENTS: 172.30.10.0/24
      PROVISIONER_CALLBACK_URL: https://${HQ_WEBAUTHN_RP_ID:-hq.coinepro.com}/api/v1/provisioning/callback
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/provisioner:/run/secrets/hq:ro
      # The reviewed cloud-init templates (one per software key).
      - ../provisioning/templates:/app/templates:ro
    healthcheck:
      test: ["CMD", "python", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_PROVISIONER:?}

  stt:
    # Persian speech to text (prompt 06 §3, contract §17.2): faster-whisper,
    # int8 on CPU, offline, with the pinned model read-only. Opt-in (profile
    # "stt", HQ_STT=on): hq.sh refuses it while the profile plus stt is over
    # the memory budget. Only the worker reaches it (hq-stt is internal);
    # no audio ever leaves the hub. The model is freed after STT_IDLE_UNLOAD_S.
    <<: *service
    profiles: [stt]
    image: coinepro-hq/stt:0.1.0
    build:
      context: ../../services
      dockerfile: stt/Dockerfile
    networks: [hq-stt]
    depends_on:
      stt-fetch:
        condition: service_completed_successfully
    environment:
      STT_MODEL: ${STT_MODEL:-large-v3-turbo}
      STT_IDLE_UNLOAD_S: ${STT_IDLE_UNLOAD_S:-300}
      STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - stt-models:/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MEM_STT:?}

  substitute-runner:
    # The substitute players' CLIs (prompt 12 §9.1, contract §21.13): OpenAI
    # Codex CLI and Google Gemini CLI, one one-shot container per call
    # (infra/substitutes/dispatch.sh runs it from coinepro-hq-substitutes.timer,
    # one job at a time for both): the Job JSON on stdin, JSON lines out, the
    # prompt on the CLI's own stdin. Opt-in (profile "substitutes",
    # HQ_SUBSTITUTES=on; hq.sh refuses it over the memory budget). Its only
    # network reaches egress's CONNECT listener for its two CLIs' hosts; no
    # hub service, no database. The CLIs' sign-in lives in hq-substitute-auth
    # (files 600, not in the backups), which nothing else mounts.
    <<: *job
    profiles: [substitutes]
    image: coinepro-hq/substitutes:0.1.0
    build:
      context: ../../services
      dockerfile: substitutes/Dockerfile
    networks: [hq-subs]
    environment:
      HTTPS_PROXY: http://egress:3131
      HTTP_PROXY: http://egress:3131
      NO_PROXY: localhost,127.0.0.1
      # Node's own fetch takes the proxy from the environment (Gemini CLI).
      NODE_USE_ENV_PROXY: "1"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - "/work:size=64m,uid=10001,gid=10001,mode=0700"
      - "/tmp:size=16m,mode=1777"
    cap_drop: [ALL]
    volumes:
      - hq-substitute-auth:/auth
    deploy:
      resources:
        limits:
          memory: ${MEM_SUBSTITUTE:?}

  browser-web:
    # The substitute players' signed-in browser profiles (prompt 12 §9.1.5):
    # the same Playwright image as the browser, one persistent profile per
    # account (chatgpt-web, gemini-web, deepseek-web) in hq-substitute-web
    # (files 600, not in the backups), opened per job by a reviewed recipe
    # and closed after it. egress is its only peer and its only way out
    # (:3132, a job's bucket: the site's own hosts only). Opt-in (profile
    # "substitutes-web", HQ_SUBSTITUTES_WEB=on; hq.sh's memory rule). The
    # same sandbox as the browser: seccomp, SYS_CHROOT only, non-root.
    <<: *service
    profiles: [substitutes-web]
    image: coinepro-hq/browser:0.1.0
    command: ["python3", "-m", "hq_egress.browser_web"]
    networks: [hq-browser-web]
    environment:
      BROWSER_SANDBOX: "1"
      BROWSER_JS_HEAP_MB: ${BROWSER_JS_HEAP_MB:-192}
      BROWSER_WEB_PROFILES: /profiles
      PORT: "8096"
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=${BROWSER_WEB_TMPFS:-64m},mode=1777"]
    security_opt: ["no-new-privileges:true", "seccomp=../browser/seccomp_profile.json"]
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    volumes:
      - hq-substitute-web:/profiles
    healthcheck:
      test: ["CMD", "python3", "-m", "hq_common.heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MEM_BROWSER_WEB:?}

  browser-web-login:
    # The owner's sign-in window (prompt 12 §9.1.5), only through
    # `make chatgpt-web-login | gemini-web-login | deepseek-web-login` in the
    # owner's own terminal: the profile in a visible Chromium on a virtual
    # display, shown by noVNC (MPL-2.0) for at most 15 minutes, its traffic
    # through egress's sign-in listener (:3133, the recipes' own and sign-in
    # hosts only). Never started by `up` (profile "web-login"); Claude never
    # runs it. web-login-relay is its only way to the host's 127.0.0.1:6080.
    <<: *job
    profiles: [web-login]
    image: coinepro-hq/browser-login:0.1.0
    build:
      context: ../../services
      dockerfile: egress/Dockerfile.browser-login
    networks: [hq-web-login]
    environment:
      BROWSER_SANDBOX: "1"
      BROWSER_WEB_PROFILES: /profiles
      BROWSER_WEB_LOGIN_PROXY: http://egress:3133
      HQ_WEB_LOGIN_SECONDS: "900"
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true", "seccomp=../browser/seccomp_profile.json"]
    cap_drop: [ALL]
    cap_add: [SYS_CHROOT]
    volumes:
      - hq-substitute-web:/profiles
    deploy:
      resources:
        limits:
          memory: ${MEM_BROWSER_LOGIN:?}

  web-login-relay:
    # The sign-in window's noVNC on the host's loopback only (127.0.0.1:6080;
    # the owner reaches it through their own `ssh -L`). A stdlib TCP relay to
    # the window's container: a container on an internal network cannot
    # publish a port, and the window itself stays on its internal network.
    # Started and removed by the same make target (profile "web-login").
    <<: *job
    profiles: [web-login]
    image: coinepro-hq/browser-login:0.1.0
    entrypoint: ["python3", "-m", "hq_egress.relay"]
    networks: [hq-web-login, hq-web-login-ui]
    ports: ["127.0.0.1:6080:6080"]
    environment:
      RELAY_LISTEN: "0.0.0.0:6080"
      RELAY_TARGET: "coinepro-hq-web-login:6080"
      RELAY_SECONDS: "960"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: ${MEM_WEB_LOGIN_RELAY:?}

  tts:
    # The hub's Persian voice (prompt 12 §4, contract §21.4): a one-shot, not a
    # service. The timer coinepro-hq-tts runs it every 2 minutes under the
    # one-shot lock it shares with the backups (infra/tts/run-once.sh); it
    # claims a briefing's spoken script from the api (204: nothing, and always
    # while the holding is locked), speaks it with Piper on the CPU and sends
    # the Ogg back. Opt-in (profile "tts", HQ_TTS=on). hq-tts is internal: the
    # api and OpenBao only (its AppRole is bound to that subnet); no internet,
    # no database, no audio ever leaves the hub.
    <<: *job
    profiles: [tts]
    image: coinepro-hq/tts:0.1.0
    build:
      context: ../../services
      dockerfile: tts/Dockerfile
    networks: [hq-tts]
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_APPROLE_FILE: /run/secrets/hq/approle.json
      HQ_API_INTERNAL_URL: http://api:8000
      TTS_VOICE: ${HQ_TTS_VOICE:-fa_IR-amir-medium}
      TTS_MAX_JOBS: "3"
      TTS_THREADS: "1"
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    volumes:
      - ${HQ_SECRETS_DIR:-/home/Hub/.secrets}/services/tts:/run/secrets/hq:ro
    deploy:
      resources:
        limits:
          memory: ${MEM_TTS:?}

  cadvisor:
    # Opt-in only (profile "cadvisor", prompt 05 §11): it needs the Docker and
    # containerd sockets, i.e. root on the host. The default profiles get
    # container metrics socket-free (infra/observability/container-metrics.sh).
    <<: *service
    profiles: [cadvisor]
    image: ghcr.io/google/cadvisor:v0.60.6
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # cAdvisor's Docker factory talks to Docker's containerd.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    devices:
      - /dev/kmsg
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEM_CADVISOR:?}

networks:
  hq-internal:
    name: hq-internal
    driver: bridge
    ipam:
      config:
        # Fixed so node-exporter can listen on the gateway (172.30.0.1) only.
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  hq-llm:
    # llm-router <-> claude-runtime (+ OpenBao, Prometheus). Fixed subnet: the
    # AppRole credentials are bound to it.
    name: hq-llm
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
          gateway: 172.30.1.1
  hq-core:
    # Temporal (no authentication of its own on this network) with its only
    # clients: api, worker, Temporal's tooling, Prometheus, Postgres.
    name: hq-core
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24
          gateway: 172.30.2.1
  hq-agent:
    # The agents' tool path: worker -> gateway -> api, and OPA for all three.
    # Internal: no route out of the host.
    name: hq-agent
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.3.0/24
          gateway: 172.30.3.1
  hq-edge:
    # Caddy and the web panel only. Internal: the web has no route out; Caddy
    # reaches the internet (ACME) through hq-internal.
    name: hq-edge
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.4.0/24
          gateway: 172.30.4.1
  hq-stt:
    # The worker and stt only (prompt 06 §3). Internal: no route out, so no
    # audio can leave the hub; stt reaches nothing else.
    name: hq-stt
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.5.0/24
          gateway: 172.30.5.1
  hq-fetch:
    # stt-fetch alone: the internet for the one model download, no service of the hub.
    name: hq-fetch
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.6.0/24
          gateway: 172.30.6.1

  hq-egress:
    # egress and SearXNG: the only route out for the agents' tools (prompt 07
    # §2). Not internal on purpose; nothing else of the hub is on it.
    name: hq-egress
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.7.0/24
          gateway: 172.30.7.1
  hq-egress-api:
    # The gateway and egress only (egress's API and its MCP proxy). Internal.
    name: hq-egress-api
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.8.0/24
          gateway: 172.30.8.1
  hq-prov:
    # The provisioner, the api (its internal endpoints) and OpenBao (its AppRole,
    # bound to this subnet). Internal: no route out (prompt 09 §4).
    name: hq-prov
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
  hq-prov-out:
    # The provisioner and egress only: its one way out (egress's listener for
    # api.hetzner.cloud). Internal.
    name: hq-prov-out
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.11.0/24
          gateway: 172.30.11.1
  hq-browser:
    # egress and the browser only. Internal: the browser's only way out is
    # egress's proxy, with that call's own credential.
    name: hq-browser
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.9.0/24
          gateway: 172.30.9.1
  hq-mcp:
    # The MCP servers in containers (prompt 12 §14, infra/compose/mcp.yaml)
    # and the Tool Gateway only. Internal: no route out; egress, the api and
    # the data services are not on it.
    name: hq-mcp
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.12.0/24
          gateway: 172.30.12.1
  hq-subs:
    # The substitute runner and egress only (prompt 12 §9.1). Internal: the
    # runner's only way out is egress's listener for its CLIs' hosts.
    name: hq-subs
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.13.0/24
          gateway: 172.30.13.1
  hq-browser-web:
    # The profile browser and egress only (prompt 12 §9.1.5). Internal.
    name: hq-browser-web
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.14.0/24
          gateway: 172.30.14.1
  hq-web-login:
    # The owner's sign-in window, its relay and egress (prompt 12 §9.1.5). Internal.
    name: hq-web-login
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.15.0/24
          gateway: 172.30.15.1
  hq-web-login-ui:
    # The relay alone: the network its 127.0.0.1:6080 is published from.
    name: hq-web-login-ui
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.16.0/24
          gateway: 172.30.16.1
  hq-tts:
    # The TTS one-shot, the api (/internal/v1/tts) and OpenBao (its AppRole,
    # bound to this subnet). Internal: no route out (prompt 12 §4).
    name: hq-tts
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.21.0/24
          gateway: 172.30.21.1

volumes:
  hq-tools:
  pg-data:
  valkey-data:
  nats-data:
  openbao-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
  tempo-data:
  hq-files:
  stt-models:
  # Prompt 12 §9.1: the CLIs' sign-in and the browser profiles (both 600, not in backups).
  hq-substitute-auth:
  hq-substitute-web:
  # prompt 12 §7: the deploy diff's mirrors of the workspaces' repositories
  hq-git:
