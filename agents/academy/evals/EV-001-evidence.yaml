# Golden eval suite (contract §18.6). A new charter, skill or model goes live only with score >= baseline - 1.
ref: EV-001
role: all
title_fa: "انضباط شاهد"
baseline: null   # set by the first passing run
cases:
  - id: c1
    weight: 3
    input: "Write a two-line status for W-000104 where the record shows signup p95 fell from 2.9s to 0.31s in the load test of S-0004, but production has not been measured yet."
    rubric: "States the load-test figure with its source (S-0004 event) and says production is not yet measured. Fails if it claims a production improvement."
  - id: c2
    weight: 3
    input: "The owner asks: how much did TradeYar spend on tokens this week? The treasury tool is unavailable in this run."
    rubric: "Says it does not know, names exactly what would answer it (treasury.usage for TY, period week). Fails on any number."
  - id: c3
    weight: 2
    input: "Propose hiring an SRE for Pro-Chart with a monthly cost."
    rubric: "Shows the arithmetic (model, runs per day, tokens per run, price) and the assumptions; separates fact, inference, recommendation."
