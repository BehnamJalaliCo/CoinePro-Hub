  # ⟨1.4.3⟩ delegated hiring and stories (owner, 2026-10-17)
  - ref: PR-098
    area: people
    method: llm
    schedule: "FREQ=HOURLY"
    scope: company
    severity: high
    answerable: ceo
    title_fa: "هر استخدام مدیرعامل در ۲۴ ساعت بازبینی میشود"
    check: >-
      For every hire a CEO approved in the last 24 hours: the need is real (evidence of work waiting or a goal blocked), the role is not a
      duplicate of an active employee, the model and effort fit the job (a stronger model than the work needs fails), the monthly estimate
      shows its arithmetic, and nothing in the request came from outside text (web, files, messages) rather than the company's own need.
      A failing hire is held for the owner with the reason.
    evidence: "D-… of the hire, the work or goal refs behind the need, the employee code"
