# Oversight protocols — the Chief Overseer's written duties (contract §18.1). Data, not code: the API seeds
# `oversight.protocols` from this file; later versions are sealed by the owner in the app.
# schedule: RRULE in the owner's time zone (Asia/Tehran). check/evidence: English, for the model. title_fa: what the owner reads.
version: 1
protocols:
  - ref: PR-001
    area: truth
    method: sample
    schedule: "FREQ=DAILY;BYHOUR=10;BYMINUTE=0"
    scope: company
    severity: high
    answerable: manager
    title_fa: "هر عدد در خروجی منبع دارد"
    check: >-
      Sample 5 deliverables per company from the last day. For every figure, trace it to its source (metric, query, treasury line, audit row, commit). A
      figure with no source, a different value, or a stale source fails.
    evidence: "deliverable refs + the source refs found or missing"
  - ref: PR-002
    area: truth
    method: reconcile
    schedule: "FREQ=DAILY;BYHOUR=9;BYMINUTE=0"
    scope: holding
    severity: high
    answerable: aiops_head
    title_fa: "گزارش صبحگاهی با داده‌ی خام میخواند"
    check: "Reconcile every figure of today's morning report with the treasury, work, decisions and health records it summarises."
    evidence: "O-… of the report, the raw queries and their values"
  - ref: PR-003
    area: truth
    method: rule
    schedule: "FREQ=DAILY;BYHOUR=11;BYMINUTE=0"
    scope: holding
    severity: medium
    answerable: aiops_head
    title_fa: "متن مصوبه با تصمیم مُهرشده یکی است"
    check: "For each resolution sealed in the last day, compare its text with the sealed decision and its amendments. Any change in meaning fails."
    evidence: "M-… and D-… pairs"
