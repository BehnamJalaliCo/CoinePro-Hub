# Tooling config for apps/api (api + worker). Not an installable package:
# the images put src/ on PYTHONPATH. Mirrors services/pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "/w/hq-common/src"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "ASYNC", "RUF", "SIM", "PT", "C4", "PIE", "RET"]
ignore = [
    "S104",  # services bind 0.0.0.0 inside their container; never published
    "S101",  # asserts narrow types for mypy; images never run with -O
    "B008",  # FastAPI dependencies are declared as argument defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "S311", "S603", "S608", "BLE001", "E501", "C408", "PT011", "PT012", "PT018", "PT022", "RUF001"]
"src/hq_api/**" = ["RUF001", "RUF002", "RUF003"]  # Persian text in messages and comments

[tool.ruff.lint.pycodestyle]
# The formatter keeps code at 100; embedded SQL may run to 120 before wrapping.
max-line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["hq_common", "hq_api"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Lint runs in the api test image: hq-common is mounted at /w/hq-common/src.
mypy_path = "src:/w/hq-common/src"
explicit_package_bases = true
cache_dir = "/tmp/mypy-cache"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nats", "nats.*", "asyncpg", "asyncpg.*", "prometheus_client.*", "pywebpush", "pywebpush.*", "py_vapid", "py_vapid.*", "schemathesis", "schemathesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-p no:cacheprovider -q"
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
data_file = "/tmp/.coverage-api"
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
skip_empty = true
show_missing = false
