# Alembic config for apps/api's schemas (core extensions, work, cartable, msg,
# notify, auth, owner, audit, control, files). Connection settings come from
# the environment (see migrations/env.py), never from this file. The version
# table is separate from llm-router's, which owns core.companies and llm.*.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_table = alembic_version_api

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
