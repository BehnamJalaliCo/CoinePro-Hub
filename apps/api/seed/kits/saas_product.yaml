# Company kit «محصول نرم‌افزاری» (contract §31.2): a ready product company from
# one order (a site or an app with sign-ups and revenue). Data, not code; it
# names no company. See content_brand.yaml for what each key does.
key: saas_product
title_fa: محصول نرم‌افزاری
purpose_fa: >-
  شرکتی برای یک محصول (سایت یا اپ): تیم کامل، گروه کاری محتوا برای رشد، مقاله‌ی سایت و پست تلگرام،
  و عددهای ثبت‌نام، کاربر فعال و درآمد.
team_template: standard
groups: [content]
lines:
  - {template: site_article, platform: site_article, title_fa: مقاله‌ی سایت}
  - {template: telegram_post, platform: telegram_post, title_fa: پست تلگرام}
kpis:
  - funnel.signups_7d
  - users.active
  - key: product.revenue_month_usd
    name_fa: درآمد ماه
    unit: USD
    direction: up
    freshness_hours: 168
    scorecard: true
    aggregate: sum
  - key: site.organic_clicks_7d
    name_fa: کلیک ارگانیک سایت در ۷ روز
    unit: ""
    direction: up
    freshness_hours: 48
    aggregate: sum
connections: [search_console, ga4, telegram]
defaults: {}
# ⟨1.15⟩ §33.4 the stages of this company's leads: a visitor becomes a user on trial, then pays.
lead_stages:
  - {key: new, title_fa: جدید, kind: open}
  - {key: contacted, title_fa: تماس گرفته شد, kind: open}
  - {key: trial, title_fa: آزمایشی, kind: open}
  - {key: paid, title_fa: پرداخت کرد, kind: won}
  - {key: lost, title_fa: از دست رفت, kind: lost}

# ⟨1.15⟩ §33.8 the stages of the company journey, each reached by code from rows.
journey:
  - founded
  - server_ready
  - first_content
  - first_visitor
  - first_lead
  - first_payment
  - {key: ten_paying, rule: {kind: paying, min: 10}}
  - break_even
