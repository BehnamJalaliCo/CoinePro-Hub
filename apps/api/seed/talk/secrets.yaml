# Key-shaped strings scrubbed from every turn before it is stored and before
# any model call (contract §32.5): replaced by «[کلید حذف شد]», and the persona
# answers «کلید را با دکمه‌ی 🔑 بدهید». hq_common.redact runs after these, so a
# shape missing here is still masked; these name the providers' own shapes.
replacement: "[کلید حذف شد]"
answer_fa: "کلید را با دکمه‌ی 🔑 بدهید."
patterns:
  - {name: google_api_key, regex: 'AIza[0-9A-Za-z_\-]{35}'}
  - {name: google_oauth_token, regex: 'ya29\.[0-9A-Za-z_\-]{20,}'}
  - {name: google_refresh_token, regex: '1//[0-9A-Za-z_\-]{30,}'}
  - {name: anthropic_key, regex: 'sk-ant-[A-Za-z0-9_\-]{8,}'}
  - {name: openai_key, regex: 'sk-(?:proj-)?[A-Za-z0-9_\-]{20,}'}
  - {name: github_token, regex: 'gh[pousr]_[A-Za-z0-9]{20,}'}
  - {name: github_pat, regex: 'github_pat_[A-Za-z0-9_]{20,}'}
  - {name: aws_access_key, regex: '(?:AKIA|ASIA)[0-9A-Z]{16}'}
  - {name: slack_token, regex: 'xox[abposr]-[A-Za-z0-9\-]{10,}'}
  - {name: telegram_bot_token, regex: '[0-9]{8,10}:[A-Za-z0-9_\-]{35}'}
  - {name: stripe_key, regex: '[sr]k_(?:live|test)_[A-Za-z0-9]{16,}'}
  - {name: openbao_token, regex: 'hv[sbr]\.[A-Za-z0-9_\-]{20,}'}
  - {name: hub_agent_token, regex: 'hqa1\.[A-Za-z0-9_\-]+\.[A-Za-z0-9_\-]+'}
  - {name: jwt, regex: 'eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'}
  - {name: meta_token, regex: 'EAA[A-Za-z0-9]{40,}'}
  - {name: private_key, regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]*?(?:-----END [A-Z ]*PRIVATE KEY-----|\Z)'}
