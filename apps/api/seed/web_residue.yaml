# What a web player's page adds after its answer (contract §29.7): data, not
# code. Cut from the END of an answer only, before it is kept (prompt 20: a
# Gemini answer ended with «مایلید … بررسی کنیم؟ بله»).
#
# buttons: a whole last line that is only a button's label (any case,
#   optional trailing punctuation), dropped while the last line is one.
# replies: a suggested-reply chip («بله», «Yes»). It is also a real one-word
#   verdict («پاسخ کوتاه:\nخیر.»), so it is cut only after a trailing offer
#   (on the offer's line or on the lines after it), never on its own.
# offer_starts: the start of a trailing offer of the page («shall I go on?»),
#   at a line or sentence start only. From such a start to the end of the
#   answer is cut when it holds a question mark and only button or reply
#   labels follow it. Explicit offer forms only: a bare «می‌خواهید» or «Do
#   you want» also opens an answer's own closing question.
