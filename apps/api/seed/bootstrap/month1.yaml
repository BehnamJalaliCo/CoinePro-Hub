# Month-1 setup work (prompt 05 §9.2): one work item per entry, created by the
# service "bootstrap" (never in the owner's name) and applied once with
# `make bootstrap-month1`. Every resulting hire is only a proposal waiting
# for the owner's seal in the cartable.
#   for: companies   every company of kind "company" (no fixed list)
#   for: holding     the holding
#   role             the charter of the employee who receives it (agents/roles/)
#   budget_tokens    the work's token budget (the run stops at it)
key: month1
reference: "docs/COINE_HQ_ROADMAP_v1.md §6.4 (month 1 hiring order)"
items:
  - for: companies
    role: cto
    title: "پیشنهاد تیم فنی ماه ۱"
    brief: |
      تیم فنی ماه ۱ را پیشنهاد بده: یک SRE برای پایش سلامت سایت‌ها و سرویس‌های این شرکت.
      فقط پیشنهاد استخدام بده (ابزار propose با kind=hire و payload.role=sre)، با شرح وظایف،
      مدل و effort، دسترسی‌ها و برآورد مصرف ماهانه. هیچ چیز دیگری را تغییر نده.
    budget_tokens: 60000
  - for: holding
    role: inspector
    title: "پیشنهاد تیم نظارت ماه ۱"
    brief: |
      تیم نظارت ماه ۱ را پیشنهاد بده: مسئول ایمنی هوش مصنوعی (ai_safety)، راستی‌آزما
      (fact_checker) و تحلیلگر امنیت (security_analyst). برای هر کدام یک پیشنهاد استخدام
      جدا (ابزار propose با kind=hire و payload.role همان نقش)، با شرح وظایف، مدل و effort،
      دسترسی‌ها و برآورد مصرف ماهانه. فقط پیشنهاد بده.
    budget_tokens: 90000
  - for: holding
    role: aiops_head
    title: "پیشنهاد SRE سکوی هاب"
    brief: |
      SRE سکوی هاب را پیشنهاد بده (ابزار propose با kind=hire و payload.role=hub_platform_sre)،
      با شرح وظایف، مدل و effort، دسترسی‌ها و برآورد مصرف ماهانه. فقط پیشنهاد بده.
    budget_tokens: 60000
