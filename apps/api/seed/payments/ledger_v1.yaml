# ⟨1.15⟩ Prompt 24 (contract §33.2): the OUTPUT contract of a company's payment ledger.
#
# The hub holds only this file. The query that produces the rows lives on the company's own
# server (`~/.config/hq-runner/ledger.sql`, written by that server's own Claude) and runs there
# against a SELECT-only database role; its connection string never leaves that server. This
# repository is public: it names no company schema, no table of a company and no address.
#
# The hub sends the runner a `ledger` job: args {contract: "ledger_v1", since_cursor, limit}.
# The runner answers {contract: "ledger_v1", rows: [...], next_cursor, has_more}. Every row is
# validated against `columns` and `kinds` below; one broken row refuses the WHOLE batch (the
# source shows a plain Persian reason and nothing of the batch is stored).
contract: ledger_v1
version: 1

request:
  since_cursor:
    type: string
    nullable: true
    max_length: 200
    note: >-
      Opaque to the hub: what the runner returned as next_cursor last time (null for the first
      read). The hub never builds or parses it.
  limit:
    type: integer
    min: 1
    max: 500

response:
  max_rows: 500
  next_cursor:
    type: string
    nullable: true
    max_length: 200

columns:
  ext_id:
    type: string
    nullable: false
    max_length: 120
    pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,119}$'
    rule: >-
      The company's own id of the payment. Unique within the batch; the hub keeps one row per
      company, source and ext_id (a later batch with the same ext_id replaces it).
  customer:
    type: string
    nullable: false
    pattern: '^[0-9a-f]{64}$'
    rule: >-
      HMAC-SHA256 (hex, lower case) of the customer's id with a per-company salt kept on the
      company server. The hub never sees a real id, name, e-mail or phone number.
  plan:
    type: string
    nullable: false
    pattern: '^[a-z0-9][a-z0-9_.-]{0,59}$'
    rule: The plan's key as the company names it (lower case).
  amount_usdt:
    type: decimal_string
    nullable: true
    pattern: '^[0-9]{1,12}(\.[0-9]{1,8})?$'
    rule: >-
      A decimal string in USDT, never a float. Null only for a store's in-app billing: such a
      row is counted, never summed.
  network:
    type: string
    nullable: true
    enum: [bsc_usdt, trc20_usdt]
    rule: Null only for a store's in-app billing.
  tx_hash:
    type: string
    nullable: true
    max_length: 80
    rule: >-
      The on-chain transaction hash the customer submitted. BSC: 0x and 64 hex digits. TRON: 64
      hex digits. Null only for a store's in-app billing.
  paid_at:
    type: timestamp
    nullable: false
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    rule: ISO 8601 in UTC, ending in Z.
  period_start:
    type: timestamp
    nullable: true
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    rule: The first instant the payment covers; ISO UTC (Z). Both period columns or neither.
  period_end:
    type: timestamp
    nullable: true
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
    rule: The end of the period the payment covers (after period_start); ISO UTC (Z).
  kind:
    type: string
    nullable: false
    enum: [crypto, store]
    rule: crypto = paid in USDT on chain; store = an app store's in-app billing.

# The rules that depend on the row's kind (checked after the column rules).
kinds:
  crypto:
    required: [amount_usdt, network, tx_hash]
    tx_hash_by_network:
      bsc_usdt: '^0x[0-9a-fA-F]{64}$'
      trc20_usdt: '^[0-9a-fA-F]{64}$'
  store:
    empty: [amount_usdt, network, tx_hash]   # must be null

# Both period columns or neither; the end after the start.
period:
  both_or_neither: [period_start, period_end]
  end_after_start: true
