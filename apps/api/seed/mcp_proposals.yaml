# Proposed first MCP servers (prompt 07 §3). PROPOSALS ONLY: nothing here is
# registered or enabled. Each becomes real only when the owner registers it
# (POST /tools/mcp, 🔏 the body) and enables it (🔏 the key); the server's own
# listing is then pinned on its first call, so the tool names below are what
# we expect, to be checked against that listing before sealing.
# Classes: A0 read, A1 draft, A2 internal and reversible, A3 = an external
# commitment (always becomes the owner's decision; only its approval runs
# that one call, once).
# Container servers (prompt 12 §14, contract §21.11): a `container` proposal
# runs on the internal network hq-mcp behind mcp-proxy, and is accepted only
# when its key, image (digest) and URL are exactly an entry of the reviewed
# allow-list infra/mcp/servers.yaml; it runs only while the opt-in profile
# `mcp` is on. Allow-listed today: `time` (the reference server) and
# `codecortex` (read-only; its editing, memory and sync tools are listed with
# `enabled: false` and are banned in the allow-list). The others below need
# a secret or the internet: 409 not_ready until a later version.
proposals:
  - key: github-read
    title_fa: GitHub (فقط خواندن)
    source: github/github-mcp-server (MIT), the official server
    transport: container  # stdio with --read-only, behind the reviewed stdio->HTTP bridge on hq-mcp
    url: http://mcp-github:8000/mcp
    secret: a fine-grained read-only token (contents, issues, pull requests), make mcp-secret KEY=github-read
    egress: api.github.com only, through the egress proxy
    companies: all
    tools:  # read-only toolset; anything that writes is left out of the registration
      - {name: get_file_contents, class: A0}
      - {name: list_commits, class: A0}
      - {name: list_issues, class: A0}
      - {name: list_pull_requests, class: A0}
      - {name: search_code, class: A0}
  - key: search-console
    title_fa: Google Search Console
    source: a community Search Console MCP server (open source; pick and review one at sealing time)
    transport: container
    url: http://mcp-search-console:8000/mcp
    secret: a Google service account with read access to the sites (Search Console "restricted" user)
    egress: the Google APIs host only, through the egress proxy
    companies: all
    tools:
      - {name: list_sites, class: A0}
      - {name: search_analytics, class: A0}
      - {name: index_inspect, class: A0}
  - key: analytics
    title_fa: Google Analytics
    source: googleanalytics/google-analytics-mcp (Apache-2.0), Google's own server
    transport: container
    url: http://mcp-analytics:8000/mcp
    secret: a Google service account with the Viewer role on the properties
    egress: the Google APIs hosts only, through the egress proxy
    companies: all
    tools:
      - {name: get_account_summaries, class: A0}
      - {name: get_property_details, class: A0}
      - {name: run_report, class: A0}
      - {name: run_realtime_report, class: A0}
  - key: time
    title_fa: زمان و منطقه‌ی زمانی
    source: modelcontextprotocol/servers "time" (MIT), a reference server
    transport: container  # no network at all; behind mcp-proxy on hq-mcp
    url: http://mcp-time:8080/mcp
    image: coinepro-hq/mcp-time:0.1.0@sha256:8552b94bf09d743779cc643f5cf295029fdac301af234a29b0036186fe8c385a
    secret: none
    egress: none
    companies: all
    tools:
      - {name: get_current_time, class: A0}
      - {name: convert_time, class: A0}
  - key: codecortex
    title_fa: هوش کد (CodeCortex)
    source: BehnamJalaliCo/CodeCortex (Apache-2.0), the owner's own project; read tools only
    transport: container  # no network at all; the hub repository's copy read-only
    url: http://mcp-codecortex:8080/mcp
    image: coinepro-hq/mcp-codecortex:0.1.0@sha256:c1766a8aa2d353fd2baa37f6870b121353b240a806719d6fe38a978e68afeeba
    secret: none
    egress: none
    companies: [HQ]  # the hub's own repository: the holding's agents (advisor, overseer, librarian)
    tools:
      - {name: cortex_repository_map, class: A0}
      - {name: cortex_find_symbol, class: A0}
      - {name: cortex_find_references, class: A0}
      - {name: cortex_dependency_graph, class: A0}
      - {name: cortex_impact, class: A0}
      - {name: cortex_architecture, class: A0}
      - {name: cortex_architecture_drift, class: A0}
      - {name: cortex_symbol_history, class: A0}
      - {name: cortex_pr_intelligence, class: A0}
      - {name: cortex_precise_definition, class: A0}
      - {name: cortex_precise_references, class: A0}
      - {name: cortex_precise_implementations, class: A0}
      - {name: cortex_structural_search, class: A0}
      - {name: cortex_stats, class: A0}
      - {name: cortex_validate, class: A0}
      # Always off (owner, 2026-10-18): editing, its own memory, sync, dependency docs.
      - {name: cortex_rename_symbol, class: A2, enabled: false}
      - {name: cortex_replace_symbol_body, class: A2, enabled: false}
      - {name: cortex_insert_before_symbol, class: A2, enabled: false}
      - {name: cortex_insert_after_symbol, class: A2, enabled: false}
      - {name: cortex_rewrite_apply, class: A2, enabled: false}
      - {name: cortex_rewrite_preview, class: A1, enabled: false}
      - {name: cortex_remember, class: A1, enabled: false}
      - {name: cortex_memory_search, class: A0, enabled: false}
      - {name: cortex_team_memory_search, class: A0, enabled: false}
      - {name: cortex_dependency_docs, class: A0, enabled: false}
  - key: fetch
    title_fa: دریافت صفحه (fetch)
    source: modelcontextprotocol/servers "fetch" (MIT), a reference server
    transport: container
    url: http://mcp-fetch:8000/mcp
    secret: none
    egress: everything through the egress proxy (its SSRF guard applies)
    companies: all
    note: overlaps web.read; enable only if a role needs the MCP form of it
    tools:
      - {name: fetch, class: A0}
