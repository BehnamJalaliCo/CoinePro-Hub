      - {role: motion_designer, why_fa: موشن‌گرافی به‌صورت کد، render و اصلاح بعد از بازبینی, first: true}
      - {role: voice_producer, why_fa: روایت با صدای خود هاب، هم‌زمان با نماها, first: true}
      - {role: visual_designer, why_fa: تصویر پست، کاروسل، استوری و کاور ویدیو, first: true}
