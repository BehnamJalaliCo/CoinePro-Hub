# Standard company template (OPERATING_MODEL §1.1, contract §3.2, §15, §22.1).
# Creating a company from it adds these departments and ONLY the leadership
# positions (the CEO and one manager per department), all asleep. Numbered
# employees are never seeded: they exist only through an approved `hire`.
# head_role / role: the charter each position runs with (agents/roles/<role>.md,
# prompt 05). A department without its own charter yet uses `manager`.
#
# ⟨1.6⟩ prompt 13 (contract §22.1): a department is defined by its mandate
# («مبدأ و مقصد»: where it starts, where it must arrive, what it delivers, its
# limits, the ceiling of any role its manager writes) and its identity (its
# character, tone and taste: every member reads it in its system prompt, after
# the charter). Both are seeded into the department where empty; the owner
# changes them in the app (PUT …/mandate). `team` is only a starting
# suggestion, never a limit: the api shows only the roles whose charter is in
# agents/roles/ (a staged one appears the day it goes live), and the manager
# writes any other role the work needs (§22.5).
# tool_ceiling: what a written role may ever hold; never an oversight power,
# hire.decide, role.decide, kill_switch.*, message.owner or anything A4 (the
# api refuses them whatever this file says).
key: standard
name_fa: قالب استاندارد شرکت
name_en: Standard company
base_tools: &base_tools [work.get, knowledge.search, memory.read, memory.write, deliver, propose, message.thread,
                         work.accept, work.progress, work.fail, activity.set, inquiry.answer, finding.update,
                         files.read, web.search, web.read]
