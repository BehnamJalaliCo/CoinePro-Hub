# The holding (HQ): oversight (independent, veto, directly under the owner)
# and AI operations serve every company; the general advisor sits outside
# every company and talks only to the owner (OPERATING_MODEL §1.1, contract
# §3.2). The owner is the general manager, so the holding has no CEO.
# HQ-SYS is the rule-based system author of reports (no model behind it).
# head_reports_to: the code suffix of an extra position the department head
# reports to (set once, only while empty: edits made later survive).
# head_role / role: the charter each position runs with (agents/roles/<role>.md,
# prompt 05). HQ-SYS has none: it is never woken.
key: holding
name_fa: قالب هلدینگ
name_en: Holding
departments:
  - code: OVS
    name_fa: نظارت
    name_en: Oversight
    manager_title_fa: بازرس کل (نظارت و AI Safety)
    manager_title_en: Inspector General (Oversight and AI Safety)
    head_kind: inspector
    head_role: inspector
    # ⟨1.4⟩ the inspector leads QC under the Chief Overseer (contract §18.0)
    head_reports_to: OVR
    sort: 10
  - code: AIOPS
    name_fa: عملیات هوش مصنوعی
    name_en: AI Operations
    manager_title_fa: مدیر عملیات AI هلدینگ
    manager_title_en: Head of AI Operations (holding)
    head_role: aiops_head
    sort: 20
  # ⟨1.6⟩ prompt 13 (contract §22.1, §22.4): one legal counsel for every
  # company; the department has no manager (head: false), only HQ-LGL below.
  - code: LEGAL
    name_fa: حقوقی
    name_en: Legal
    manager_title_fa: مشاور حقوقی
    manager_title_en: Legal Counsel
    head: false
    sort: 30
leadership:
  ceo: null
  managers: true
  extra:
    - code_suffix: ADV
      kind: advisor
      role: advisor
      title_fa: مشاور کل
      title_en: General Advisor
      thread: A
      thread_kind: advisor
      thread_title_fa: مشاور کل
    # ⟨1.4⟩ the Chief Overseer (rank 2, thread N) and the owner's personal
    # assistant (thread P), contract §18.0; both talk only to the owner.
    - code_suffix: OVR
      kind: overseer
      role: overseer
      department: OVS
      title_fa: ناظر کل
      title_en: Chief Overseer
      thread: N
      thread_kind: overseer
      thread_title_fa: ناظر کل
    - code_suffix: PA
      kind: assistant
      role: assistant
      title_fa: دستیار شخصی
      title_en: Personal Assistant
      thread: P
      thread_kind: assistant
      thread_title_fa: دستیار شخصی
    # ⟨1.6⟩ the legal counsel (thread L, contract §22.4): asleep until work
    # arrives (the owner in thread L, a CEO's work item, a reply to a case).
    - code_suffix: LGL
      kind: employee
      role: legal_counsel
      department: LEGAL
      title_fa: مشاور حقوقی
      title_en: Legal Counsel
      thread: L
      thread_kind: legal
      thread_title_fa: مشاور حقوقی
    - code_suffix: SYS
      kind: system
      title_fa: سامانه‌ی گزارش
      title_en: Report system
